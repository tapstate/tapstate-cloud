# ============================================================
# AWS EC2 self-hosted k3s (production-like preview)
# Usage: helm install tapstate-cloud-control ./helm/tapstate-cloud-control -f helm/tapstate-cloud-control/values-aws.yaml
# ============================================================
# Prerequisites (per ADR-0124 D2 — ops pre-create before Helm install):
#   1. k3s namespace: tapstate-cloud-control
#   2. 4 k3s Secrets: mongo-uri, jwks-signing-key, aws-credentials, atlas-admin-key
#   3. ECR repo created, Docker image pushed
#   4. CloudFront distribution pointing to k3s NodePort 30080
#   5. Route53 A record: cloud.tapstate.io → CloudFront
# ============================================================

replicaCount: 2

image:
  # ECR repo URI set via environment variable or sed replacement
  # e.g., 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/tapstate-cloud
  repository: "${ECR_REPO_URI}"
  pullPolicy: Always  # always pull from ECR
  tag: "${IMAGE_TAG:-latest}"

config:
  springProfilesActive: prod
  jwtIssuer: https://cloud.tapstate.io
  corsAllowedOrigins: "https://cloud.tapstate.io,https://*.cloud.tapstate.io"

  # Production drives real AWS + real Atlas provisioning.
  # Requires the dns / iac k3s Secrets and Activated AtlasConfig + ACTIVE
  # MdbCluster documents in the control-plane store.
  iacMode: real
  publicBaseUrl: https://cloud.tapstate.com
  atlasMdbMock: "false"
  # API explorers are not exposed in production.
  swaggerUiEnabled: "false"
  knife4jEnabled: "false"

service:
  type: NodePort
  nodePort: 30080

ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: cloud.tapstate.io
      paths:
        - path: /
          pathType: Prefix
  # TLS handled by CloudFront → this Ingress is behind CloudFront TLS termination
  tls: []

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

# Autoscaling for production (Week 4+)
autoscaling:
  enabled: false  # disabled Week 2; enable Week 4
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
