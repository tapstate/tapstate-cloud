# ============================================================
# awsdev environment — ECR image + AWS EC2 k3s cluster
# Usage:
#   helm install tapstate-cloud-control ./helm/tapstate-cloud-control \
#     -f helm/tapstate-cloud-control/values.yaml \
#     -f helm/tapstate-cloud-control/values-awsdev.yaml \
#     -n tapstate --create-namespace
# ============================================================

replicaCount: 1

image:
  # ECR (AWS HK ap-east-1) — immutable tags, use per-deploy timestamp
  repository: 263186327888.dkr.ecr.ap-east-1.amazonaws.com/tapstate-cloud/tapstate-cloud-control
  pullPolicy: IfNotPresent
  tag: "awsdev-20260928-1612"

# ECR uses IAM auth — in k3s we use pull secret created by deploy.sh
imagePullSecrets:
  - name: tapstate-ecr-pull

# Single-node k3s on EC2 — no nodeSelector needed
config:
  feishuLongConnectionEnabled: true
  feishuProductionInviteApiUrl: https://cloud.tapstate.com/v1/api/webhooks/feishu/production-invite
  springProfilesActive: dev
  # Must point at THIS control plane; the base values default to the prod
  # issuer, which would make dev-issued resolve JWTs carry the prod issuer.
  jwtIssuer: https://dev.cloud.tapstate.com
  corsAllowedOrigins: "https://dev.cloud.tapstate.com,https://*.dev.cloud.tapstate.com,http://localhost:5173,http://localhost:5174"
  oauthCallbackBaseUrl: https://dev.cloud.tapstate.com
  cloudConsoleUrl: https://dev.cloud.tapstate.com
  jiraCloudId: "9ee330de-c28d-40f8-a92e-5317b5670ea8"
  jiraServiceDeskId: "71"
  jiraRequestTypeId: "129"
  jiraCustomerProvisioningEnabled: "true"
  jiraCustomerProvisioningSiteAdminRiskAcknowledged: "true"
  jiraCloseTransitionName: "Cancel request"

  # awsdev drives real AWS (ap-southeast-1) + real Atlas provisioning.
  # Required secrets beyond the base set:
  #   tapstate-cloud-control-dns      (api-key / api-secret)
  #   tapstate-cloud-control-iac      (master-key, base64 32 bytes)
  # Optional:
  #   tapstate-cloud-control-cluster-version (release-token) — enables the
  #   Cluster version release/offline operator endpoints; absent = fail-closed
  # Atlas access additionally needs Activated atlas_configs + ACTIVE
  # mdb_clusters documents seeded in the control-plane store.
  iacMode: real
  iacEnvironment: dev
  publicBaseUrl: https://dev.cloud.tapstate.com
  atlasMdbMock: "false"
  logLevelCloud: DEBUG
  tawkPropertyId: 6ad811f9c0b97c34b365a428

  # Alert email delivery. SMTP host/username/password come from the shared
  # tapstate-cloud-control-smtp Secret and config.smtp* values; this block only
  # opts the event pipeline in.
  notifications:
    emailEnabled: "true"
    emailFrom: "no-reply@tapstate.com"

service:
  type: NodePort
  port: 8080
  nodePort: 30180

# awsdev uses ECR (ap-east-1); CronJob keeps the 12h pull token fresh
ecrRotation:
  enabled: true
  awsRegion: ap-east-1
  secretName: tapstate-ecr-pull

ingress:
  enabled: false
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
