# ============================================================
# Default values — works for local k3s development
# Override with: -f values-awsdev.yaml (awsdev) or values-awsprod.yaml
# (production) for AWS EC2 self-hosted k3s
# ============================================================

replicaCount: 2

image:
  # In local dev: image built locally and loaded into k3s
  # In AWS ECR: image pushed to ECR repo
  repository: tapstate-cloud
  pullPolicy: IfNotPresent  # AlwaysPull for ECR
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ========== k3s Secrets (pre-created in namespace by ops) ==========
# Per ADR-0121 D4: ALL credentials come from k3s Secrets.
# mongoUri / jwksSigningKey / awsCredentials are REQUIRED — the pod will not
# start without them. godaddy / iacCrypto / runtimeAtlasUri / jwksEncryptionKey
# are wired as OPTIONAL env refs: environments that run
# TAPSTATE_CLOUD_IAC_MODE=mock work without them, and real environments must
# pre-create them before provisioning
# Clusters (a missing secret then surfaces as a coded provisioning failure,
# not a pod start failure).
secrets:
  # MongoDB connection string (Control Plane metadata DB user)
  mongoUri:
    name: tapstate-cloud-control-mongo-uri
    key: mongo-uri
  # JWKS signing private key (PEM)
  jwksSigningKey:
    name: tapstate-cloud-control-jwks-signing-key
    key: signing-key
  # AWS credentials (EC2/CloudFormation API calls)
  awsCredentials:
    name: tapstate-cloud-control-aws-credentials
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
  # GoDaddy DNS API credentials (only needed when TAPSTATE_CLOUD_IAC_MODE=real)
  godaddy:
    name: tapstate-cloud-control-dns
    apiKeyKey: api-key
    apiSecretKeyKey: api-secret
  # Base64-encoded 32-byte AES master key protecting generated SSH private
  # keys at rest (only needed when TAPSTATE_CLOUD_IAC_MODE=real; blank blocks
  # provisioning)
  iacCrypto:
    name: tapstate-cloud-control-iac
    masterKeyKey: master-key
  # Optional fixed MongoDB URI for legacy Clusters without a linked MdbAllocation.
  # Leave the secret absent: new Clusters use the per-allocation Atlas URI and
  # blank falls back to the on-node MongoDB sidecar.
  runtimeAtlasUri:
    name: tapstate-cloud-control-runtime-atlas-uri
    uriKey: atlas-uri
  # AES key for JWKS private-key encryption at rest (only when
  # config.jwksEncryptionEnabled=true)
  jwksEncryptionKey:
    name: tapstate-cloud-control-jwks-encryption-key
    key: encryption-key
  sampleSources:
    name: tapstate-cloud-control-sample-sources
    passwordKey: password
  # Static bearer token guarding the Cluster version release/offline operator
  # endpoints. Optional: when the Secret is absent the endpoints stay
  # fail-closed (503), so environments that never publish versions need no key.
  clusterVersionReleaseToken:
    name: tapstate-cloud-control-cluster-version
    key: release-token

# ========== ConfigMap (non-sensitive config) ==========
config:
  serverPort: 8080
  springProfilesActive: prod
  jwtIssuer: https://cloud.tapstate.io
  resolveJwtExpiryMinutes: "15"
  sessionExpiryDays: "7"
  defaultRegion: ap-southeast-1
  awsRegion: ap-southeast-1
  corsAllowedOrigins: "https://cloud.tapstate.io,https://*.cloud.tapstate.io"
  sampleSourcesHost: "47.238.126.103"

  # ----- API docs -----
  swaggerUiEnabled: "true"
  knife4jEnabled: "true"

  # ----- JWKS management -----
  jwksRotationEnabled: "true"
  jwksEncryptionEnabled: "false"

  # ----- IaC layer (multi-cloud Cluster provisioning) -----
  # Safe chart default is mock: environments that run real cloud APIs override
  # these in values-awsdev.yaml / values-awsprod.yaml.
  iacProvider: aws
  iacMode: mock
  # DNS environment suffix — provisions <id>.<iacEnvironment>.<godaddyDomain>
  iacEnvironment: dev
  # Public URL of THIS control plane, handed to Cluster runtimes
  publicBaseUrl: https://dev.cloud.tapstate.com
  # "false" enables real Atlas Admin API calls; requires Activated AtlasConfig
  # and ACTIVE MdbCluster documents in the control-plane store.
  atlasMdbMock: "true"
  iacAwsInstanceType: t3.medium
  iacAwsDiskSizeGb: "40"

  # ----- GoDaddy DNS (non-sensitive parts; credentials come from Secrets) -----
  godaddyBaseUrl: https://api.godaddy.com
  godaddyDomain: tapstate.com
  godaddyTtl: "600"

  # ----- Logging -----
  logLevelCloud: INFO
  logLevelSecurity: WARN

# ========== Kubernetes resources ==========
serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# Pod-level security (applies to all containers in the pod)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

# Container-level security (applies to the main app container)
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

service:
  type: NodePort
  port: 8080
  # k3s NodePort 30080 (per ADR-0120 deployment topology)
  nodePort: 30080

ingress:
  enabled: true
  className: "traefik"  # k3s default ingress controller
  annotations:
    # TLS handled by CloudFront in production; local k3s: cert-manager or self-signed
    traefik.ingress.kubernetes.io/router.entrypoints: web
  hosts:
    - host: cloud.tapstate.io
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # tls:
  #   - secretName: tapstate-cloud-tls
  #     hosts:
  #       - cloud.tapstate.io

# ========== Resource limits ==========
resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

# ========== Liveness / Readiness probes ==========
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# ========== Rolling update strategy ==========
# Per ADR-0120: kubectl rollout restart tapstate-cloud-api
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
