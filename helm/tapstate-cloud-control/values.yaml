# ============================================================
# Default values — works for local k3s development
# Override with: -f values-awsdev.yaml (awsdev) or values-awsprod.yaml
# (production) for AWS EC2 self-hosted k3s
# ============================================================

replicaCount: 2

image:
  # In local dev: image built locally and loaded into k3s
  # In AWS ECR: image pushed to ECR repo
  repository: tapstate-cloud
  pullPolicy: IfNotPresent  # AlwaysPull for ECR
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ========== k3s Secrets (pre-created in namespace by ops) ==========
# Per ADR-0121 D4: ALL credentials come from k3s Secrets.
# mongoUri / jwksSigningKey / awsCredentials are REQUIRED — the pod will not
# start without them. godaddy / iacCrypto / runtimeAtlasUri / jwksEncryptionKey
# are wired as OPTIONAL env refs: environments that run
# TAPSTATE_CLOUD_IAC_MODE=mock work without them, and real environments must
# pre-create them before provisioning
# Clusters (a missing secret then surfaces as a coded provisioning failure,
# not a pod start failure).
secrets:
  # MongoDB connection string (Control Plane metadata DB user)
  mongoUri:
    name: tapstate-cloud-control-mongo-uri
    key: mongo-uri
  # JWKS signing private key (PEM)
  jwksSigningKey:
    name: tapstate-cloud-control-jwks-signing-key
    key: signing-key
  # AWS credentials (EC2/CloudFormation API calls)
  awsCredentials:
    name: tapstate-cloud-control-aws-credentials
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
  # GoDaddy DNS API credentials (only needed when TAPSTATE_CLOUD_IAC_MODE=real)
  godaddy:
    name: tapstate-cloud-control-dns
    apiKeyKey: api-key
    apiSecretKeyKey: api-secret
  # Base64-encoded 32-byte AES master key protecting generated SSH private
  # keys at rest (only needed when TAPSTATE_CLOUD_IAC_MODE=real; blank blocks
  # provisioning)
  iacCrypto:
    name: tapstate-cloud-control-iac
    masterKeyKey: master-key
  # Optional fixed MongoDB URI for legacy Clusters without a linked MdbAllocation.
  # Leave the secret absent: new Clusters use the per-allocation Atlas URI and
  # blank falls back to the on-node MongoDB sidecar.
  runtimeAtlasUri:
    name: tapstate-cloud-control-runtime-atlas-uri
    uriKey: atlas-uri
  # AES key for JWKS private-key encryption at rest (only when
  # config.jwksEncryptionEnabled=true)
  jwksEncryptionKey:
    name: tapstate-cloud-control-jwks-encryption-key
    key: encryption-key
  sampleSources:
    name: tapstate-cloud-control-sample-sources
    passwordKey: password
  # Static bearer token guarding the Cluster version release/offline operator
  # endpoints. Optional: when the Secret is absent the endpoints stay
  # fail-closed (503), so environments that never publish versions need no key.
  clusterVersionReleaseToken:
    name: tapstate-cloud-control-cluster-version
    key: release-token
  # Invited email registration and OAuth providers (optional per feature)
  authHmacKey:
    name: tapstate-cloud-control-auth
    key: otp-hmac-key
  googleOAuth:
    name: tapstate-cloud-control-google-oauth
    clientIdKey: client-id
    clientSecretKey: client-secret
  githubOAuth:
    name: tapstate-cloud-control-github-oauth
    clientIdKey: client-id
    clientSecretKey: client-secret
  smtp:
    name: tapstate-cloud-control-smtp
    hostKey: host
    usernameKey: username
    passwordKey: password
  # Tawk callback signing secret and Feishu application-bot credentials are optional
  # until the feedback notification integration is enabled in an environment.
  tawkWebhook:
    name: tapstate-cloud-control-tawk-webhook
    secretKey: webhook-secret
  feishuBot:
    name: tapstate-cloud-control-feishu-bot
    appIdKey: app-id
    appSecretKey: app-secret
    chatIdKey: chat-id
    productionInviteSharedSecretKey: production-invite-shared-secret
  # Alert email reuses the shared SMTP Secret above (host/username/password);
  # there is no second credential source.
  # Stripe API key + webhook secret (Week 4 — Stripe Checkout)
  # Optional: when the Secret is absent the payment controller stays up but
  # stripe_product catalog refresh logs a warning and /specs excludes
  # payment-channel pricing. Created by scripts/k3s-stripe-secrets.sh.
  stripe:
    name: tapstate-cloud-control-secrets
    secretKeyKey: stripe.secret-key
    webhookSecretKey: stripe.webhook-secret
  jira:
    name: tapstate-cloud-control-jira
    clientIdKey: client-id
    clientSecretKey: client-secret
  # Customer provisioning uses a separate Jira Administrator service account.
  # The deployment references this Secret only when customer provisioning is enabled.
  jiraCustomerAdmin:
    name: tapstate-cloud-control-jira-customer-admin
    clientIdKey: client-id
    clientSecretKey: client-secret
  # Ops subscription immediate-cancel static bearer token. Optional: when the
  # Secret is absent the ops endpoint stays fail-closed (503), so environments
  # that never call the ops cancel endpoint need no key.
  opsSubscriptionToken:
    name: tapstate-cloud-control-ops
    key: subscription-token

# ========== ConfigMap (non-sensitive config) ==========
config:
  serverPort: 8080
  springProfilesActive: prod
  jwtIssuer: https://cloud.tapstate.io
  resolveJwtExpiryMinutes: "15"
  sessionExpiryDays: "7"
  defaultRegion: ap-southeast-1
  awsRegion: ap-southeast-1
  corsAllowedOrigins: "https://cloud.tapstate.io,https://*.cloud.tapstate.io"
  smtpPort: "587"
  smtpAuth: "true"
  smtpStarttls: "true"
  # Implicit TLS on 465: set smtpStarttls=false and smtpSslEnable=true.
  smtpSslEnable: "false"
  authOtpMaxAttempts: "5"
  authOtpSendsPerHour: "5"
  authOtpCooldownSeconds: "60"
  authOtpLifetimeMinutes: "10"
  authMailFrom: no-reply@tapstate.com
  authTrialCodeRequired: "true"
  feishuLongConnectionEnabled: false
  feishuProductionInviteApiUrl: ""
  trialIssuerEmail: ""
  oauthCallbackBaseUrl: https://dev.cloud.tapstate.com
  cloudConsoleUrl: https://dev.cloud.tapstate.com
  sampleSourcesHost: "47.238.126.103"

  # ----- Jira Service Management (non-sensitive routing configuration) -----
  jiraCloudId: ""
  jiraServiceDeskId: ""
  jiraRequestTypeId: ""
  jiraCustomerProvisioningEnabled: "false"
  jiraCustomerProvisioningSiteAdminRiskAcknowledged: "false"
  jiraCloseTransitionName: "Close Request"
  jiraConnectTimeoutSeconds: "3"
  jiraRequestTimeoutSeconds: "10"

  # ----- API docs -----
  swaggerUiEnabled: "true"
  knife4jEnabled: "true"

  # ----- JWKS management -----
  jwksRotationEnabled: "true"
  jwksEncryptionEnabled: "false"

  # ----- IaC layer (multi-cloud Cluster provisioning) -----
  # Safe chart default is mock: environments that run real cloud APIs override
  # these in values-awsdev.yaml / values-awsprod.yaml.
  iacProvider: aws
  iacMode: mock
  # DNS environment selector — dev provisions <clusterName>.dev.cloud.<godaddyDomain>,
  # prod provisions <clusterName>.cloud.<godaddyDomain> (apex).
  iacEnvironment: dev
  # Public URL of THIS control plane, handed to Cluster runtimes
  publicBaseUrl: https://dev.cloud.tapstate.com
  # "false" enables real Atlas Admin API calls; requires Activated AtlasConfig
  # and ACTIVE MdbCluster documents in the control-plane store.
  atlasMdbMock: "true"
  iacAwsInstanceType: t3.medium
  iacAwsDiskSizeGb: "40"

  # ----- GoDaddy DNS (non-sensitive parts; credentials come from Secrets) -----
  godaddyBaseUrl: https://api.godaddy.com
  godaddyDomain: tapstate.com
  godaddyTtl: "600"

  # ----- Logging -----
  logLevelCloud: INFO
  logLevelSecurity: WARN
  tawkPropertyId: ""
  tawkRetryIntervalMs: "30000"

  # ----- Alert email delivery -----
  # Transport (host/port/auth/TLS) is the shared spring.mail configuration fed
  # by the SMTP Secret and config.smtp* above. This block only opts the event
  # pipeline in; when disabled, deliveries fail visibly in the Console instead
  # of being reported as sent.
  notifications:
    emailEnabled: "false"
    emailFrom: "no-reply@tapstate.com"
    maxAttempts: "5"
    retryBaseSeconds: "30"
    leaseSeconds: "60"
    pollIntervalMs: "5000"

# ========== Kubernetes resources ==========
serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# Pod-level security (applies to all containers in the pod)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

# Container-level security (applies to the main app container)
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

service:
  type: NodePort
  port: 8080
  # k3s NodePort 30080 (per ADR-0120 deployment topology)
  nodePort: 30080

ingress:
  enabled: true
  className: "traefik"  # k3s default ingress controller
  annotations:
    # TLS handled by CloudFront in production; local k3s: cert-manager or self-signed
    traefik.ingress.kubernetes.io/router.entrypoints: web
  hosts:
    - host: cloud.tapstate.io
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # tls:
  #   - secretName: tapstate-cloud-tls
  #     hosts:
  #       - cloud.tapstate.io

# ========== Resource limits ==========
resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

# ========== Liveness / Readiness probes ==========
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# ========== ECR pull secret rotation ==========
# Continuously refresh the ECR pull secret token (valid for 12 hours) so
# pods created after a quiet period (rollout restart, node replacement) do
# not hit ErrImagePull on an expired token. Off by default — only ECR-backed
# envs (awsdev, awsprod) enable it; Harbor-backed (dev) and local k3s do not.
# Set image.repository to an ECR URI (ends with dkr.ecr.<region>.amazonaws.com)
# and enable this block.
ecrRotation:
  enabled: false
  # 6h = half of the 12h ECR token lifetime; 2x safety margin
  schedule: "0 */6 * * *"
  awsRegion: ap-east-1
  # Must match an already-created secret in the install namespace. ops
  # pre-creates it with a bootstrap token so helm install itself does not
  # depend on the CronJob to succeed first run.
  secretName: tapstate-ecr-pull
  # Refresher container — amazon/aws-cli:alpine + curl (curl is installed at
  # entrypoint via apk; it hits the in-cluster K8s API to patch the secret).
  image:
    repository: amazon/aws-cli
    tag: "alpine"
    pullPolicy: IfNotPresent
  # The CronJob reuses the existing AWS creds Secret the control-plane pod
  # already mounts — it only calls ecr:GetAuthorizationToken, which this key
  # already has. Replace with a pull-only key in production when you have one.
  awsCredentials:
    secretName: tapstate-cloud-control-aws-credentials
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
  # CronJob runtime policy
  concurrencyPolicy: Replace
  restartPolicy: OnFailure
  backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

# ========== Rolling update strategy ==========
# Per ADR-0120: kubectl rollout restart tapstate-cloud-api
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
