{{- if .Values.ecrRotation.enabled }}
# ---------------------------------------------------------------------------
# ECR pull secret refresher — keeps the 12h ECR authorization token fresh so
# pods created after a quiet period (rollout restart, node replacement,
# scaling) do not hit ErrImagePull on an expired token.
#
# Design notes:
#   - Dedicated SA + namespaced Role/RoleBinding — minimum possible scope:
#     only this one secret, only get+patch+update. No blanket secret access.
#   - amazon/aws-cli:alpine image — small (~128 MB), official. `curl` is
#     installed at entrypoint via apk because the base image does not ship it.
#   - CronJob hits the in-cluster K8s API directly (with the SA token that
#     every pod auto-mounts when automountServiceAccountToken=true) — no
#     kubectl binary needed, no extra download per run.
#   - ECR credentials come from the same Secret the control-plane pod already
#     mounts; this CronJob only calls `ecr:GetAuthorizationToken`, which the
#     existing key already has. Replace with a pull-only key in production
#     when you provision one — the mount shape below is identical.
#
# Prerequisite (ops pre-create before helm install):
#   A Secret named {{ .Values.ecrRotation.secretName }} of type
#   kubernetes.io/dockerconfigjson must already exist in the install namespace,
#   seeded with a bootstrap token. Helm install itself must not depend on the
#   CronJob succeeding first.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-ecr-refresher-sa
  labels:
    app: {{ .Release.Name }}
    {{- include "tapstate-cloud-control.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-ecr-refresher-role
  labels:
    app: {{ .Release.Name }}
    {{- include "tapstate-cloud-control.labels" . | nindent 4 }}
rules:
  # Very narrow scope: only get + patch + update on the specific pull secret.
  # No blanket secret access, no create/delete — the CronJob assumes ops
  # pre-seeds the secret and only ever refreshes it.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.ecrRotation.secretName | quote }}
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-ecr-refresher-rb
  labels:
    app: {{ .Release.Name }}
    {{- include "tapstate-cloud-control.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-ecr-refresher-role
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-ecr-refresher-sa
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-ecr-refresher
  labels:
    app: {{ .Release.Name }}
    {{- include "tapstate-cloud-control.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.ecrRotation.schedule | quote }}
  concurrencyPolicy: {{ .Values.ecrRotation.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.ecrRotation.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.ecrRotation.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.ecrRotation.backoffLimit }}
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}
            {{- include "tapstate-cloud-control.selectorLabels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ .Release.Name }}-ecr-refresher-sa
          automountServiceAccountToken: true
          restartPolicy: {{ .Values.ecrRotation.restartPolicy }}
          # CronJob container runs as root intentionally: amazon/aws-cli:alpine
          # ships only python/awscli and the entrypoint installs curl via apk,
          # which requires root. This is a one-shot Job (1-2 minutes, then
          # destroyed), not a long-running workload — the privilege is
          # bounded to the container lifetime and allowPrivilegeEscalation
          # stays false.
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          containers:
            - name: refresher
              image: "{{ .Values.ecrRotation.image.repository }}:{{ .Values.ecrRotation.image.tag }}"
              imagePullPolicy: {{ .Values.ecrRotation.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
              resources:
                {{- toYaml .Values.ecrRotation.resources | nindent 16 }}
              env:
                # CronJob mounts the existing AWS creds Secret. These env vars
                # are what `aws ecr get-login-password` reads.
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.ecrRotation.awsCredentials.secretName }}
                      key: {{ .Values.ecrRotation.awsCredentials.accessKeyIdKey }}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.ecrRotation.awsCredentials.secretName }}
                      key: {{ .Values.ecrRotation.awsCredentials.secretAccessKeyKey }}
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.ecrRotation.awsRegion | quote }}
                - name: AWS_REGION
                  value: {{ .Values.ecrRotation.awsRegion | quote }}
                - name: ECR_REGISTRY
                  # Derive the ECR registry host from the image.repository
                  # value (e.g. "263186327888.dkr.ecr.ap-east-1.amazonaws.com/…")
                  # by stripping everything after the first "/".
                  value: {{ regexReplaceAll "/.*" .Values.image.repository "" | quote }}
                - name: SECRET_NAME
                  value: {{ .Values.ecrRotation.secretName | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail

                  echo "[$(date -Iseconds)] ECR pull secret refresher starting... secret=$SECRET_NAME region=$AWS_REGION registry=$ECR_REGISTRY"

                  # Ensure curl is available (alpine awscli image ships only
                  # python + awscli — curl is needed to hit the in-cluster
                  # K8s API). Fail fast if the apk mirror is unreachable; the
                  # CronJob will retry on the next schedule.
                  apk add --no-cache curl >/dev/null 2>&1 || {
                    echo "FATAL: apk add curl failed — CronJob will retry on next schedule";
                    exit 1;
                  }

                  # In-cluster K8s API credentials — every pod auto-mounts
                  # these when automountServiceAccountToken=true above.
                  KUBE_TOKEN_FILE=/var/run/secrets/kubernetes.io/serviceaccount/token
                  KUBE_CA_FILE=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  KUBE_NAMESPACE_FILE=/var/run/secrets/kubernetes.io/serviceaccount/namespace
                  KUBE_TOKEN=$(cat "$KUBE_TOKEN_FILE")
                  KUBE_NAMESPACE=$(cat "$KUBE_NAMESPACE_FILE")

                  if [ -z "$KUBE_TOKEN" ] || [ -z "$KUBE_NAMESPACE" ]; then
                    echo "FATAL: SA token or namespace not found — check automountServiceAccountToken"
                    exit 1
                  fi

                  echo "[$(date -Iseconds)] namespace=$KUBE_NAMESPACE"

                  # 1. Refresh ECR authorization token. The password is the
                  #    raw value the kubelet would pass to docker login; we
                  #    embed it directly into .dockerconfigjson below.
                  TOKEN=$(aws ecr get-login-password --region "$AWS_REGION")
                  if [ -z "$TOKEN" ]; then
                    echo "FATAL: aws ecr get-login-password returned empty"
                    exit 1
                  fi
                  echo "[$(date -Iseconds)] ECR token acquired (len=${#TOKEN})"

                  # 2. Build the new .dockerconfigjson. K8s Secret.data values
                  #    are base64-encoded, and the dockerconfigjson content is
                  #    itself a base64 string wrapping JSON.
                  #    busybox base64 (alpine default) does not wrap lines —
                  #    the explicit tr -d '\n' is a guard against accidental
                  #    newlines from any source.
                  AUTH_B64=$(printf 'AWS:%s' "$TOKEN" | base64 | tr -d '\n')
                  DOCKERCONFIG_JSON=$(printf '{"auths":{"%s":{"auth":"%s"}}}' "$ECR_REGISTRY" "$AUTH_B64")
                  DOCKERCONFIG_B64=$(printf '%s' "$DOCKERCONFIG_JSON" | base64 | tr -d '\n')

                  # 3. Strategic-merge-patch the existing secret. This only
                  #    updates the .dockerconfigjson key and leaves every
                  #    other key (if any) untouched.
                  HTTP_CODE=$(curl -sk \
                    --cacert "$KUBE_CA_FILE" \
                    -o /dev/null \
                    -w '%{http_code}' \
                    -H "Authorization: Bearer $KUBE_TOKEN" \
                    -H "Content-Type: application/strategic-merge-patch+json" \
                    --data "{\"data\":{\".dockerconfigjson\":\"$DOCKERCONFIG_B64\"}}" \
                    "https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT/api/v1/namespaces/$KUBE_NAMESPACE/secrets/$SECRET_NAME")

                  case "$HTTP_CODE" in
                    200)
                      echo "[$(date -Iseconds)] OK — ECR pull secret refreshed successfully"
                      ;;
                    404)
                      echo "FATAL: secret $SECRET_NAME not found in $KUBE_NAMESPACE — ops must pre-create it"
                      exit 1
                      ;;
                    403)
                      echo "FATAL: SA denied — Role/RoleBinding missing or resourceNames too narrow"
                      exit 1
                      ;;
                    *)
                      echo "FATAL: patch failed with HTTP $HTTP_CODE"
                      exit 1
                      ;;
                  esac
{{- end }}
