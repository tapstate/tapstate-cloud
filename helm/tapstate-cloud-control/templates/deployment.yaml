apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    version: {{ .Values.image.tag | default .Chart.AppVersion }}
    {{- include "tapstate-cloud-control.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        version: {{ .Values.image.tag | default .Chart.AppVersion }}
        {{- include "tapstate-cloud-control.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.serviceAccount }}
      serviceAccountName: {{ .name | default (printf "%s-sa" $.Release.Name) }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.serverPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          env:
            # ========== Spring Boot config from ConfigMap ==========
            - name: SERVER_PORT
              value: {{ .Values.config.serverPort | quote }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.config.springProfilesActive | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.config.corsAllowedOrigins | quote }}
            - name: SMTP_PORT
              value: {{ .Values.config.smtpPort | quote }}
            - name: SMTP_AUTH
              value: {{ .Values.config.smtpAuth | quote }}
            - name: SMTP_STARTTLS
              value: {{ .Values.config.smtpStarttls | quote }}
            - name: SMTP_SSL_ENABLE
              value: {{ .Values.config.smtpSslEnable | quote }}
            - name: CLOUD_AUTH_OTP_MAX_ATTEMPTS
              value: {{ .Values.config.authOtpMaxAttempts | quote }}
            - name: CLOUD_AUTH_OTP_SENDS_PER_HOUR
              value: {{ .Values.config.authOtpSendsPerHour | quote }}
            - name: CLOUD_AUTH_OTP_COOLDOWN_SECONDS
              value: {{ .Values.config.authOtpCooldownSeconds | quote }}
            - name: CLOUD_AUTH_OTP_LIFETIME_MINUTES
              value: {{ .Values.config.authOtpLifetimeMinutes | quote }}
            - name: CLOUD_AUTH_MAIL_FROM
              value: {{ .Values.config.authMailFrom | quote }}
            - name: CLOUD_AUTH_TRIAL_CODE_REQUIRED
              value: {{ .Values.config.authTrialCodeRequired | quote }}
            - name: CLOUD_AUTH_OAUTH_CALLBACK_BASE_URL
              value: {{ .Values.config.oauthCallbackBaseUrl | quote }}
            - name: CLOUD_CONSOLE_URL
              value: {{ .Values.config.cloudConsoleUrl | quote }}
            - name: SWAGGER_UI_ENABLED
              value: {{ .Values.config.swaggerUiEnabled | quote }}
            - name: KNIFE4J_ENABLED
              value: {{ .Values.config.knife4jEnabled | quote }}

            # ========== Tapstate Cloud config from ConfigMap ==========
            - name: CLOUD_JWT_ISSUER
              value: {{ .Values.config.jwtIssuer | quote }}
            - name: CLOUD_RESOLVE_JWT_EXPIRY_MINUTES
              value: {{ .Values.config.resolveJwtExpiryMinutes | quote }}
            - name: CLOUD_SESSION_EXPIRY_DAYS
              value: {{ .Values.config.sessionExpiryDays | quote }}
            - name: CLOUD_DEFAULT_REGION
              value: {{ .Values.config.defaultRegion | quote }}
            - name: AWS_REGION
              value: {{ .Values.config.awsRegion | quote }}
            - name: TAPSTATE_SAMPLE_SOURCES_HOST
              value: {{ .Values.config.sampleSourcesHost | quote }}
            - name: TAPSTATE_CLOUD_JIRA_CLOUD_ID
              value: {{ .Values.config.jiraCloudId | quote }}
            - name: TAPSTATE_CLOUD_JIRA_SERVICE_DESK_ID
              value: {{ .Values.config.jiraServiceDeskId | quote }}
            - name: TAPSTATE_CLOUD_JIRA_REQUEST_TYPE_ID
              value: {{ .Values.config.jiraRequestTypeId | quote }}
            - name: TAPSTATE_CLOUD_JIRA_CUSTOMER_PROVISIONING_ENABLED
              value: {{ .Values.config.jiraCustomerProvisioningEnabled | quote }}
            - name: TAPSTATE_CLOUD_JIRA_CUSTOMER_PROVISIONING_SITE_ADMIN_RISK_ACKNOWLEDGED
              value: {{ .Values.config.jiraCustomerProvisioningSiteAdminRiskAcknowledged | quote }}
            - name: TAPSTATE_CLOUD_JIRA_CLOSE_TRANSITION_NAME
              value: {{ .Values.config.jiraCloseTransitionName | quote }}
            - name: TAPSTATE_CLOUD_JIRA_CONNECT_TIMEOUT_SECONDS
              value: {{ .Values.config.jiraConnectTimeoutSeconds | quote }}
            - name: TAPSTATE_CLOUD_JIRA_REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.config.jiraRequestTimeoutSeconds | quote }}

            # ========== JWKS management ==========
            - name: CLOUD_JWKS_ROTATION_ENABLED
              value: {{ .Values.config.jwksRotationEnabled | quote }}
            - name: CLOUD_JWKS_ENCRYPTION_ENABLED
              value: {{ .Values.config.jwksEncryptionEnabled | quote }}

            # ========== IaC layer — multi-cloud Cluster provisioning ==========
            # Env names carry the FULL relaxed-binding property path under the
            # tapstate.cloud.iac.* prefix; short names (IAC_MODE etc.) do not bind.
            - name: TAPSTATE_CLOUD_IAC_PROVIDER
              value: {{ .Values.config.iacProvider | quote }}
            - name: TAPSTATE_CLOUD_IAC_MODE
              value: {{ .Values.config.iacMode | quote }}
            - name: TAPSTATE_CLOUD_IAC_ENVIRONMENT
              value: {{ .Values.config.iacEnvironment | quote }}
            - name: TAPSTATE_CLOUD_IAC_PUBLIC_BASE_URL
              value: {{ .Values.config.publicBaseUrl | quote }}
            # Payment redirects (Stripe checkout success/cancel) return the
            # browser to THIS control plane, so they share the same public URL.
            - name: TAPSTATE_CLOUD_PUBLIC_BASE_URL
              value: {{ .Values.config.publicBaseUrl | quote }}
            - name: TAPSTATE_CLOUD_MDB_ATLAS_MOCK
              value: {{ .Values.config.atlasMdbMock | quote }}
            - name: TAPSTATE_CLOUD_IAC_AWS_INSTANCE_TYPE
              value: {{ .Values.config.iacAwsInstanceType | quote }}
            - name: TAPSTATE_CLOUD_IAC_AWS_DISK_SIZE_GB
              value: {{ .Values.config.iacAwsDiskSizeGb | quote }}
            - name: TAPSTATE_CLOUD_IAC_GODADDY_BASE_URL
              value: {{ .Values.config.godaddyBaseUrl | quote }}
            - name: TAPSTATE_CLOUD_IAC_GODADDY_DOMAIN
              value: {{ .Values.config.godaddyDomain | quote }}
            - name: TAPSTATE_CLOUD_IAC_GODADDY_TTL
              value: {{ .Values.config.godaddyTtl | quote }}

            # ========== Logging ==========
            - name: LOG_LEVEL_CLOUD
              value: {{ .Values.config.logLevelCloud | quote }}
            - name: LOG_LEVEL_SECURITY
              value: {{ .Values.config.logLevelSecurity | quote }}
            - name: TAPSTATE_CLOUD_TAWK_PROPERTY_ID
              value: {{ .Values.config.tawkPropertyId | quote }}
            - name: TAPSTATE_CLOUD_TAWK_RETRY_INTERVAL_MS
              value: {{ .Values.config.tawkRetryIntervalMs | quote }}

            # ========== Alert email delivery ==========
            # Opt-in switch for the event pipeline. SMTP transport and credentials
            # are the shared SMTP_* configuration above, also used by auth mail.
            - name: TAPSTATE_CLOUD_NOTIFICATIONS_EMAIL_ENABLED
              value: {{ .Values.config.notifications.emailEnabled | quote }}
            - name: TAPSTATE_CLOUD_NOTIFICATIONS_EMAIL_FROM
              value: {{ .Values.config.notifications.emailFrom | quote }}
            - name: TAPSTATE_CLOUD_NOTIFICATIONS_MAX_ATTEMPTS
              value: {{ .Values.config.notifications.maxAttempts | quote }}
            - name: TAPSTATE_CLOUD_NOTIFICATIONS_RETRY_BASE_SECONDS
              value: {{ .Values.config.notifications.retryBaseSeconds | quote }}
            - name: TAPSTATE_CLOUD_NOTIFICATIONS_LEASE_SECONDS
              value: {{ .Values.config.notifications.leaseSeconds | quote }}
            - name: TAPSTATE_CLOUD_NOTIFICATIONS_POLL_INTERVAL_MS
              value: {{ .Values.config.notifications.pollIntervalMs | quote }}

            # ========== Secrets from k3s Secret — Tawk and Feishu ==========
            - name: FEISHU_LONG_CONNECTION_ENABLED
              value: {{ .Values.config.feishuLongConnectionEnabled | quote }}
            - name: FEISHU_EVENT_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.feishuBot.name }}
                  key: event-encrypt-key
                  optional: true
            - name: FEISHU_EVENT_VERIFICATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.feishuBot.name }}
                  key: event-verification-token
                  optional: true
            - name: FEISHU_INVITE_ALLOWED_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.feishuBot.name }}
                  key: invite-allowed-chat-id
                  optional: true
            - name: TAWK_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.tawkWebhook.name }}
                  key: {{ .Values.secrets.tawkWebhook.secretKey }}
                  optional: true
            - name: FEISHU_BOT_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.feishuBot.name }}
                  key: {{ .Values.secrets.feishuBot.appIdKey }}
                  optional: true
            - name: FEISHU_BOT_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.feishuBot.name }}
                  key: {{ .Values.secrets.feishuBot.appSecretKey }}
                  optional: true
            - name: FEISHU_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.feishuBot.name }}
                  key: {{ .Values.secrets.feishuBot.chatIdKey }}
                  optional: true

            # ========== Secrets from k3s Secret — MONGODB ==========
            # SPRING_DATA_MONGODB_URI maps to spring.data.mongodb.uri via relaxed binding
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mongoUri.name }}
                  key: {{ .Values.secrets.mongoUri.key }}
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mongoUri.name }}
                  key: {{ .Values.secrets.mongoUri.key }}

            # ========== Secrets from k3s Secret — JWKS signing key ==========
            - name: CLOUD_JWKS_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jwksSigningKey.name }}
                  key: {{ .Values.secrets.jwksSigningKey.key }}
            # Optional: only consumed when CLOUD_JWKS_ENCRYPTION_ENABLED=true
            - name: CLOUD_JWKS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jwksEncryptionKey.name }}
                  key: {{ .Values.secrets.jwksEncryptionKey.key }}
                  optional: true

            # ========== Secrets from k3s Secret — AWS credentials ==========
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.awsCredentials.name }}
                  key: {{ .Values.secrets.awsCredentials.accessKeyIdKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.awsCredentials.name }}
                  key: {{ .Values.secrets.awsCredentials.secretAccessKeyKey }}

            # ========== Secrets from k3s Secret — IaC (optional, real mode only) ==========
            # Atlas credentials are NOT injected: the allocation engine reads the
            # Activated key from the atlas_configs collection. These secrets cover
            # DNS, SSH-key encryption and the legacy global runtime Atlas URI.
            - name: TAPSTATE_CLOUD_IAC_GODADDY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.godaddy.name }}
                  key: {{ .Values.secrets.godaddy.apiKeyKey }}
                  optional: true
            - name: TAPSTATE_CLOUD_IAC_GODADDY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.godaddy.name }}
                  key: {{ .Values.secrets.godaddy.apiSecretKeyKey }}
                  optional: true
            - name: TAPSTATE_CLOUD_IAC_CRYPTO_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.iacCrypto.name }}
                  key: {{ .Values.secrets.iacCrypto.masterKeyKey }}
                  optional: true
            - name: TAPSTATE_CLOUD_IAC_RUNTIME_ATLAS_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtimeAtlasUri.name }}
                  key: {{ .Values.secrets.runtimeAtlasUri.uriKey }}
                  optional: true

            # ========== Shared sample database credential — server only ==========
            - name: TAPSTATE_SAMPLE_SOURCES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.sampleSources.name }}
                  key: {{ .Values.secrets.sampleSources.passwordKey }}
                  optional: true

            # ========== Cluster version management operator token (optional) ==========
            # Static bearer token for the version release/state-change endpoints.
            # An absent key leaves the env var unset; the application treats a
            # blank token as fail-closed and rejects those endpoints with 503.
            - name: CLOUD_CLUSTER_VERSION_RELEASE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.clusterVersionReleaseToken.name }}
                  key: {{ .Values.secrets.clusterVersionReleaseToken.key }}
                  optional: true

            # ========== Ops subscription immediate-cancel operator token (optional) ==========
            # Static bearer token for the ops-triggered immediate subscription
            # cancellation endpoint. Absent = fail-closed (503).
            - name: TAPSTATE_CLOUD_OPS_SUBSCRIPTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.opsSubscriptionToken.name }}
                  key: {{ .Values.secrets.opsSubscriptionToken.key }}
                  optional: true

            # ========== Secrets for invited authentication (optional) ==========
            - name: CLOUD_AUTH_TRIAL_ISSUER_EMAIL
              value: {{ .Values.config.trialIssuerEmail | quote }}
            - name: CLOUD_AUTH_OTP_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.authHmacKey.name }}
                  key: {{ .Values.secrets.authHmacKey.key }}
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.googleOAuth.name }}
                  key: {{ .Values.secrets.googleOAuth.clientIdKey }}
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.googleOAuth.name }}
                  key: {{ .Values.secrets.googleOAuth.clientSecretKey }}
                  optional: true
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.githubOAuth.name }}
                  key: {{ .Values.secrets.githubOAuth.clientIdKey }}
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.githubOAuth.name }}
                  key: {{ .Values.secrets.githubOAuth.clientSecretKey }}
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.smtp.name }}
                  key: {{ .Values.secrets.smtp.hostKey }}
                  optional: true
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.smtp.name }}
                  key: {{ .Values.secrets.smtp.usernameKey }}
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.smtp.name }}
                  key: {{ .Values.secrets.smtp.passwordKey }}
                  optional: true

            # ========== JVM config ==========
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseContainerSupport"

            # ========== Secrets from k3s Secret — STRIPE ==========
            # Injected by scripts/k3s-stripe-secrets.sh. Absent = payment code
            # stays functional but stripe.product catalog refresh logs a warning.
            - name: TAPSTATE_CLOUD_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.stripe.name }}
                  key: {{ .Values.secrets.stripe.secretKeyKey }}
                  optional: true
            - name: TAPSTATE_CLOUD_STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.stripe.name }}
                  key: {{ .Values.secrets.stripe.webhookSecretKey }}
                  optional: true

            # Jira OAuth 2.0 service-account credentials are optional at deployment; ticket endpoints
            # return a stable not-configured error until the Secret is present.
            - name: TAPSTATE_CLOUD_JIRA_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jira.name }}
                  key: {{ .Values.secrets.jira.clientIdKey }}
                  optional: true
            - name: TAPSTATE_CLOUD_JIRA_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jira.name }}
                  key: {{ .Values.secrets.jira.clientSecretKey }}
                  optional: true
            {{ if eq .Values.config.jiraCustomerProvisioningEnabled "true" }}
            - name: TAPSTATE_CLOUD_JIRA_CUSTOMER_ADMIN_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jiraCustomerAdmin.name }}
                  key: {{ .Values.secrets.jiraCustomerAdmin.clientIdKey }}
                  optional: true
            - name: TAPSTATE_CLOUD_JIRA_CUSTOMER_ADMIN_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jiraCustomerAdmin.name }}
                  key: {{ .Values.secrets.jiraCustomerAdmin.clientSecretKey }}
                  optional: true
            {{ end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      # ADR-0124 D2: k3s namespace is separate; secrets pre-created by ops
      # This chart does NOT create the secrets — they must exist before install.
      automountServiceAccountToken: true
