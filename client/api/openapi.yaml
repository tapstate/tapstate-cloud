openapi: 3.1.0
info:
  title: Tapstate Cloud — Global Control Plane API
  description: |
    Global Control Plane backend API for Tapstate Cloud.

    ## Authentication

    Three authentication contexts (ADR-0122 D2):
    - **Session Cookie** — Cloud Console users (type ①)
    - **Static Token** — SDK status sender (type ②, `/api/sdk/*`)
    - **Resolve JWT** — issued by this service for Cluster Console access

    ## Regions

    Week 2: only `ap-southeast-1` (Singapore) available.
    Production regions to be added post-W4.

    ## Clusters

    Clusters are auto-provisioned via CloudFormation + EC2 + Docker.
    Lifecycle state machine has 6 states in Week 2.
  contact:
    name: Tapstate Team
    url: https://tapstate.io
    email: cloud@tapstate.io
  version: v1
servers:
- url: https://cloud.tapstate.io
  description: Production
- url: http://localhost:8080
  description: Local development
security:
- session-cookie: []
tags:
- name: Exchange
  description: Atomic exchange_code → resolve JWT redemption. Called by Cluster Server
    backend only — JWT never reaches the browser (ADR-0125).
- name: C2 Status Report
  description: Runtime → Global Control Plane heartbeat + health metrics (SDK Bearer
    auth)
- name: Resolve / Exchange
  description: Cloud Console → Cluster Console handoff. /resolve issues a one-time
    exchange_code; /auth/exchange (handled by ExchangeController) atomically redeems
    it for a resolve JWT. JWKS endpoint publishes public key for runtime offline JWT
    verification.
- name: Cluster Versions
  description: "Published Cluster versions — listing for console, publish/delist for\
    \ operators"
- name: C2 Cluster Events
  description: Runtime → event center event push (SDK Bearer auth)
- name: Regions
  description: Available AWS regions for Cluster provisioning
- name: Deployment Progress
  description: Subscription deployment/reclamation progress
- name: Support tickets
  description: Cloud session-owned Jira Service Management requests
- name: Health
  description: Health check endpoints
- name: Organizations
  description: Organization management — isolation boundary for Clusters
- name: Auth
  description: "Cloud Console authentication, session management and trial access"
- name: Subscription
  description: Organization subscriptions — each subscription provisions one Cluster
    + one MDB allocation
- name: Organization invitations
  description: Owner-managed single-use organization invitations
- name: Clusters
  description: Cluster read + retry — lifecycle managed via Subscription
- name: Spec Catalog
  description: Platform subscription specs with channel pricing
paths:
  /v1/api/clusters/{clusterId}/configuration-initialization/claim:
    post:
      tags: [Cluster Configuration Initialization]
      operationId: claimConfigurationInitialization
      security:
      - sdk-static-token: []
      parameters:
      - name: clusterId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-f]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationInitializationClaim'
      responses:
        '200':
          description: Original initialization result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationInitializationResponse'
        '401':
          description: Invalid Cluster service identity
        '409':
          description: Original initialization conditions are not satisfied
        '503':
          description: Initialization authority is unavailable
  /v1/api/clusters/{clusterId}/configuration-initialization/complete:
    post:
      tags: [Cluster Configuration Initialization]
      operationId: completeConfigurationInitialization
      security:
      - sdk-static-token: []
      parameters:
      - name: clusterId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-f]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationInitializationCompletion'
      responses:
        '200':
          description: Original initialization result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationInitializationResponse'
        '401':
          description: Invalid Cluster service identity
        '409':
          description: Original initialization conditions are not satisfied
        '503':
          description: Initialization authority is unavailable
  /v1/api/orgs/{orgId}/alert-policies/{policyId}:
    put:
      tags:
      - alert-policy-controller
      operationId: updateAlertPolicy
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: policyId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPolicyRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAlertPolicyResponse"
    delete:
      tags:
      - alert-policy-controller
      operationId: deleteAlertPolicy
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: policyId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /v1/api/trial-codes:
    post:
      tags:
      - Auth
      summary: Issue a single-use trial code
      operationId: createTrialCode
      responses:
        "201":
          description: Trial code created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTrialCode"
        "403":
          description: Caller is not the configured trial issuer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTrialCode"
  /v1/api/orgs:
    get:
      tags:
      - Organizations
      summary: List current user's organizations
      description: Returns all Organizations the authenticated user is a member of.
        Organizations are the isolation boundary for Clusters and subscriptions.
      operationId: listMyOrganizations
      responses:
        "200":
          description: List of Organizations (may be empty)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListOrganizationResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListOrganizationResponse"
    post:
      tags:
      - Organizations
      summary: Create new organization (user becomes owner automatically)
      description: "Creates a new Organization and adds the caller as its first member\
        \ with owner role. The Organization starts with no subscriptions — create\
        \ them explicitly via POST /v1/api/orgs/{orgId}/subscriptions. Organization\
        \ slug must be unique system-wide (lowercase, hyphenated)."
      operationId: create
      requestBody:
        description: "Organization create payload: {\"name\": \"Acme Corp\", \"slug\"\
          : \"acme-corp\"}"
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
        required: true
      responses:
        "200":
          description: Organization created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
        "400":
          description: "Invalid input (missing name/slug, slug format)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
        "409":
          description: Slug already taken or account already belongs to an organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
  /v1/api/orgs/{orgId}/subscriptions/{subscriptionId}/finalize-provisioning:
    post:
      tags:
      - Subscription
      summary: Finalize Cluster + MDB provisioning after Checkout confirmation
      description: "Called by the Console after the user confirms on the Checkout\
        \ success page. Requires a paid state (ACTIVE, or TRIAL when the spec carries\
        \ a trial). Creates Cluster + MdbAllocation and kicks off async provisioning.\
        \ An optional version pins the Cluster version; omitted resolves the latest\
        \ ACTIVE version."
      operationId: finalizeProvisioning
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeProvisioningRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
  /v1/api/orgs/{orgId}/subscriptions/{subscriptionId}/cancel-now:
    post:
      tags:
      - Subscription
      summary: Immediate subscription cancellation — no grace period
      description: "Cancels the Stripe subscription immediately and transitions to\
        \ CANCELLED, triggering cascade termination of the Cluster + reclaim of MdbAllocation."
      operationId: cancelNow
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
  /v1/api/orgs/{orgId}/subscriptions/{subscriptionId}/cancel-at-period-end:
    post:
      tags:
      - Subscription
      summary: Cancel subscription at the next billing period end
      description: "Stripe subscription is marked cancel_at_period_end=true. The subscription\
        \ stays ACTIVE (PENDING_CANCEL) until the billing cycle expires, then auto-terminates\
        \ via the PERIOD_END_REAPED scheduled reaper. No immediate Cluster termination."
      operationId: cancelAtPeriodEnd
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
  /v1/api/orgs/{orgId}/subscriptions/checkout:
    post:
      tags:
      - Subscription
      summary: Create a Stripe Checkout Session + PENDING_PAYMENT subscription shell
      description: "Validates the spec exists (platform spec_config.enabled=true)\
        \ and has Stripe pricing configured, then creates a hosted Stripe Checkout\
        \ Session. Returns the redirect URL and a PENDING_PAYMENT Subscription shell.\
        \ Cluster provisioning does NOT start until the Checkout Session completes\
        \ (webhook-driven PENDING_PAYMENT→ACTIVE transition + activateAndProvision)."
      operationId: createCheckout
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutRequest"
        required: true
      responses:
        "201":
          description: Checkout session created — shell subscription + redirect URL
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCheckoutResponse"
        "400":
          description: Invalid specKey or spec deprecated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCheckoutResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCheckoutResponse"
        "403":
          description: Not a member of this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCheckoutResponse"
        "409":
          description: Duplicate subscription (clientRequestId already used)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCheckoutResponse"
  /v1/api/orgs/{orgId}/invitations:
    get:
      tags:
      - Organization invitations
      summary: List organization invitations
      description: Returns invitation status without disclosing invitation tokens.
      operationId: listInvitations
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListInvitationView"
    post:
      tags:
      - Organization invitations
      summary: Create an organization invitation
      description: "Only the organization owner may create a seven-day, single-use\
        \ invitation. The returned token is shown once."
      operationId: createInvitation
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCreatedInvitation"
  /v1/api/orgs/{orgId}/clusters/{clusterId}/retry:
    post:
      tags:
      - Clusters
      summary: Retry provisioning_failed Cluster
      description: |-
        Retries a Cluster that previously failed provisioning (state = PROVISIONING_FAILED).

        StateMachine cleanup flow: clears residual resources from the failed attempt → re-triggers the full provisioning pipeline from PROVISIONING_PENDING.

        Returns 409 if the Cluster is not in PROVISIONING_FAILED state.
      operationId: retryCluster
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      - name: clusterId
        in: path
        description: Cluster UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "Retry initiated, state reset to PROVISIONING_PENDING"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "403":
          description: Not cluster owner
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "404":
          description: Cluster not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "409":
          description: Cluster not in PROVISIONING_FAILED state
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
  /v1/api/orgs/{orgId}/clusters/{clusterId}/retry-cleanup:
    post:
      tags:
      - Clusters
      summary: Retry cleanup failure
      description: |-
        Retries resource cleanup for a Cluster whose previous cleanup attempt failed (cleanupErrorCode is non-null). Common causes: CloudFormation stack locked by another operation, AWS API throttling, or IAM drift. Requires the user to fix the root cause before retrying.

        Idempotent: returns current Cluster state if no cleanup failure exists (cleanupErrorCode is null).

        Returns 500 if cleanup still fails — AWS error details are persisted on the Cluster document.
      operationId: retryCleanup
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      - name: clusterId
        in: path
        description: Cluster UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Cleanup attempted — check cleanupErrorCode in response; null
            means success
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "403":
          description: Not cluster owner
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "404":
          description: Cluster not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "500":
          description: Cleanup still failing — check cleanupErrorDetail
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
  /v1/api/orgs/{orgId}/clusters/{clusterId}/egress-address:stabilize:
    post:
      tags:
      - Clusters
      summary: Stabilize the Cluster egress IPv4 address
      description: Attaches a Cluster-owned Elastic IP to a live Cluster. The public
        address and DNS record change when the operation completes; the EC2 runtime
        is not replaced.
      operationId: stabilizeEgressAddress
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      - name: clusterId
        in: path
        description: Cluster UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
  /v1/api/orgs/{orgId}/alert-policies:
    get:
      tags:
      - alert-policy-controller
      operationId: listAlertPolicies
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListAlertPolicyResponse"
    post:
      tags:
      - alert-policy-controller
      operationId: createAlertPolicy
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPolicyRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAlertPolicyResponse"
  /v1/api/internal/payment/stripe/webhook:
    post:
      tags:
      - stripe-webhook-controller
      operationId: handleWebhook
      parameters:
      - name: Stripe-Signature
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
              format: byte
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /v1/api/internal/payment/stripe/products/refresh:
    post:
      tags:
      - stripe-webhook-controller
      operationId: refreshProducts
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseString"
  /v1/api/internal/events:
    post:
      tags:
      - internal-event-controller
      operationId: ingest
      parameters:
      - name: X-Event-Token
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventIngestRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEventResponse"
  /v1/api/clusters/{clusterId}/status-report:
    post:
      tags:
      - C2 Status Report
      summary: Runtime C2 status report (heartbeat + metrics)
      description: |-
        Runtime SDK posts heartbeat + infrastructure-level health metrics.

        Authentication: Bearer token in Authorization header — the Cluster's per-Cluster sdk-static-token (issued at provisioning time).

        Nonce replay protection: Every request must carry a unique nonce string. Duplicate nonce → 409 auth.nonce-replay.

        Data minimization: Only infrastructure metrics accepted (runtime version, uptime, active pipeline count, last error time). No user data, Source/Pipeline configs, or Atlas credentials flow through this endpoint.

        Effects: Updates Cluster.lastHeartbeatAt; stores full payload as Cluster.lastStatusReport embedded document; auto-transitions state DEGRADED → READY on heartbeat recovery (5min window).
      operationId: report
      parameters:
      - name: clusterId
        in: path
        description: Cluster ObjectId — must match the Bearer token's owning Cluster
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusReportRequest"
        required: true
      responses:
        "200":
          description: Status report accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStatusReportResponse"
        "401":
          description: SDK token missing or invalid (auth.sdk-token-invalid)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStatusReportResponse"
        "403":
          description: Token does not match path clusterId (auth.cluster-mismatch)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStatusReportResponse"
        "409":
          description: Nonce replay (auth.nonce-replay)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStatusReportResponse"
  /v1/api/clusters/{clusterId}/events:
    post:
      tags:
      - C2 Cluster Events
      summary: Push a runtime Cluster event into the event center
      description: |-
        Accepts task failures/interruptions, data validation results and other runtime occurrences. The event is stored, then evaluated against the organization's enabled alert policies; matching policies create alerts and notification deliveries.

        Authentication: Bearer token in Authorization header — the Cluster's per-Cluster sdk-static-token. The organization and event source are derived from that token, never from the request body.

        Idempotency: reuse the same dedupeKey when retrying the same occurrence; a duplicate reports the stored event and does not re-evaluate policies.

        Supported types (any type under the cluster. namespace): cluster.task.failed, cluster.task.interrupted, cluster.validation.failed, cluster.validation.succeeded, cluster.runtime.degraded.
      operationId: ingestClusterEvent
      parameters:
      - name: clusterId
        in: path
        description: Cluster ObjectId — must match the Bearer token's owning Cluster
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterEventRequest"
        required: true
      responses:
        "200":
          description: Event accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEventResponse"
        "400":
          description: Invalid event (event.invalid)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEventResponse"
        "401":
          description: SDK token missing or invalid (sdk.token-invalid)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEventResponse"
        "409":
          description: Cluster has no owning organization yet (cluster.invalid-state)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEventResponse"
  /v1/api/auth/register:
    post:
      tags:
      - Auth
      summary: Reject open registration
      description: Open registration is disabled. New accounts require an organization
        invitation and email verification.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "403":
          description: Open registration is disabled
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
  /v1/api/auth/oauth/{provider}/start:
    post:
      tags:
      - Auth
      summary: Start Google or GitHub sign-in
      description: Stores a hashed invitation or identity-link intent in the server
        session and returns the provider authorization path.
      operationId: startOAuth
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthStartRequest"
        required: true
      responses:
        "200":
          description: Provider authorization path returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOAuthStartResult"
        "400":
          description: Unsupported OAuth flow
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOAuthStartResult"
        "401":
          description: Recent authentication required for identity linking
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOAuthStartResult"
        "503":
          description: Provider is not configured
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOAuthStartResult"
  /v1/api/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout and invalidate session
      description: Invalidate the current Cloud session. Also fires signed revocation
        callbacks to ALL Clusters this user has active resolve JWTs for (Cloud→Cluster
        callback with RS256 signature — Cluster verifies via SDK verifyRequest). Each
        Cluster then revokes its local session for that jti.
      operationId: logout
      responses:
        "200":
          description: Session invalidated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /v1/api/auth/login:
    post:
      tags:
      - Auth
      summary: Login and create session
      description: "Authenticate with email + password. On success, session cookie\
        \ is set by Spring Session automatically. Session expires after 7 days of\
        \ inactivity."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: "Login successful, session cookie set"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseLoginResult"
        "401":
