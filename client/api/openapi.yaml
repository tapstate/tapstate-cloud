          type: integer
          format: int32
          description: Presentation/dependency order
        weight:
          type: integer
          format: int32
          description: Weight in the aggregate percentage
        status:
          type: string
          description: "Current status: PENDING / RUNNING / RETRYING / SUCCEEDED /\
