openapi: 3.1.0
info:
  title: Tapstate Cloud — Global Control Plane API
  description: |
    Global Control Plane backend API for Tapstate Cloud.

    ## Authentication

    Three authentication contexts (ADR-0122 D2):
    - **Session Cookie** — Cloud Console users (type ①)
    - **Static Token** — SDK status sender (type ②, `/api/sdk/*`)
    - **Resolve JWT** — issued by this service for Cluster Console access

    ## Regions

    Week 2: only `ap-southeast-1` (Singapore) available.
    Production regions to be added post-W4.

    ## Clusters

    Clusters are auto-provisioned via CloudFormation + EC2 + Docker.
    Lifecycle state machine has 6 states in Week 2.
  contact:
    name: Tapstate Team
    url: https://tapstate.io
    email: cloud@tapstate.io
  version: v1
servers:
- url: https://cloud.tapstate.io
  description: Production
- url: http://localhost:8080
  description: Local development
security:
- session-cookie: []
tags:
- name: Exchange
  description: Atomic exchange_code → resolve JWT redemption. Called by Cluster Server
    backend only — JWT never reaches the browser (ADR-0125).
- name: Subscription
  description: "Organization subscription — create with initial Cluster, view status\
    \ and items"
- name: Organizations
  description: Organization management — isolation boundary for Clusters
- name: C2 Status Report
  description: Runtime → Global Control Plane heartbeat + health metrics (SDK Bearer
    auth)
- name: Resolve / Exchange
  description: Cloud Console → Cluster Console handoff. /resolve issues a one-time
    exchange_code; /auth/exchange (handled by ExchangeController) atomically redeems
    it for a resolve JWT. JWKS endpoint publishes public key for runtime offline JWT
    verification.
- name: Auth
  description: "Cloud Console authentication — register, login, session management"
- name: Clusters
  description: Cluster read + retry — lifecycle managed via Subscription
- name: Regions
  description: Available AWS regions for Cluster provisioning
- name: Health
  description: Health check endpoints
paths:
  /v1/api/orgs:
    get:
      tags:
      - Organizations
      summary: List current user's organizations
      description: Returns all Organizations the authenticated user is a member of.
        Organizations are the isolation boundary for Clusters and subscriptions.
      operationId: listMyOrganizations
      responses:
        "200":
          description: List of Organizations (may be empty)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListOrganizationResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListOrganizationResponse"
    post:
      tags:
      - Organizations
      summary: Create new organization (user becomes owner automatically)
      description: "Creates a new Organization and adds the caller as its first member\
        \ with owner role. A default TRIAL subscription is automatically created for\
        \ the new Org. Organization slug must be unique system-wide (lowercase, hyphenated)."
      operationId: create
      requestBody:
        description: "Organization create payload: {\"name\": \"Acme Corp\", \"slug\"\
          : \"acme-corp\"}"
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
        required: true
      responses:
        "200":
          description: Organization created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
        "400":
          description: "Invalid input (missing name/slug, slug format)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
        "409":
          description: Slug already taken
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
  /v1/api/orgs/{orgId}/subscription:
    get:
      tags:
      - Subscription
      summary: View organization subscription
      description: |-
        Returns the Organization's current subscription status, billing period, and item breakdown.

        Subscription states: TRIAL (free trial) / ACTIVE (paid) / PAST_DUE (grace period) / CANCELLED (terminated).

        Poll this endpoint to track async Cluster + MDB provisioning progress.
      operationId: getSubscription
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Subscription details
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "403":
          description: Not a member of this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "404":
          description: Subscription not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
    post:
      tags:
      - Subscription
      summary: Create subscription with initial Cluster + MDB allocation
      description: |-
        Creates a new subscription (TRIAL, 30-day period) with the two default billable items, then synchronously provisions an initial Cluster record and Atlas MDB allocation.

        Async provisioning (fired by state machines):
          - Cluster state machine: START_PROVISION → CloudFormation simulation → READY/PROVISIONING_FAILED
          - MDB state machine: START_PROVISION → Atlas createDatabase + createDatabaseUser → READY/PROVISIONING_FAILED

        Both flows run in parallel. Poll GET /subscription to track overall progress.

        Idempotency: if the org already has a subscription shell, reuses it and adds one Cluster.
      operationId: createSubscription
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
        required: true
      responses:
        "201":
          description: "Subscription created, Cluster + MDB allocation provisioning\
            \ pending"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "400":
          description: Invalid input (missing region/name/spec)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "403":
          description: Not a member of this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "409":
          description: Duplicate cluster name in org + region
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "503":
          description: No Atlas capacity for the requested region
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
  /v1/api/orgs/{orgId}/subscription/status:
    post:
      tags:
      - Subscription
      summary: Update subscription status (admin/internal)
      description: |-
        Internal admin endpoint for subscription state transition.

        Used in Week 2 to simulate PAST_DUE / CANCELLED states for testing. Production version (Week 12) will be driven by Marketplace billing callbacks.

        Accepted status values: TRIAL / ACTIVE / PAST_DUE / CANCELLED.
      operationId: transitionStatus
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
        required: true
      responses:
        "200":
          description: Status updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "400":
          description: Invalid status value or missing field
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "404":
          description: Subscription not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
  /v1/api/orgs/{orgId}/subscription/cancel:
    post:
      tags:
      - Subscription
      summary: Cancel subscription — auto-terminate all org clusters + reclaim MDB
      description: |-
        Cancels this Organization's subscription (state → CANCELLED) and triggers cascade termination of every non-terminated Cluster + MDB allocation owned by this org.

        Cascade runs asynchronously via Cluster state-machine INITIATE_TERMINATION events and MDB state-machine INITIATE_RECLAIM events. This endpoint returns immediately.

        Safe to call on an already-cancelled subscription (idempotent).
      operationId: cancelSubscription
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "Subscription cancelled, cascade termination scheduled"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "403":
          description: Not Org owner
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "404":
          description: Subscription not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
  /v1/api/orgs/{orgId}/clusters/{clusterId}/retry:
    post:
      tags:
      - Clusters
      summary: Retry provisioning_failed Cluster
      description: |-
        Retries a Cluster that previously failed provisioning (state = PROVISIONING_FAILED).

        StateMachine cleanup flow: clears residual resources from the failed attempt → re-triggers the full provisioning pipeline from PROVISIONING_PENDING.

        Returns 409 if the Cluster is not in PROVISIONING_FAILED state.
      operationId: retryCluster
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      - name: clusterId
        in: path
        description: Cluster UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "Retry initiated, state reset to PROVISIONING_PENDING"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "403":
          description: Not cluster owner
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "404":
          description: Cluster not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "409":
          description: Cluster not in PROVISIONING_FAILED state
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
  /v1/api/clusters/{clusterId}/status-report:
    post:
      tags:
      - C2 Status Report
      summary: Runtime C2 status report (heartbeat + metrics)
      description: |-
        Runtime SDK posts heartbeat + infrastructure-level health metrics.

        Authentication: Bearer token in Authorization header — the Cluster's per-Cluster sdk-static-token (issued at provisioning time).

        Nonce replay protection: Every request must carry a unique nonce string. Duplicate nonce → 409 auth.nonce-replay.

        Data minimization: Only infrastructure metrics accepted (runtime version, uptime, active pipeline count, last error time). No user data, Source/Pipeline configs, or Atlas credentials flow through this endpoint.

        Effects: Updates Cluster.lastHeartbeatAt; auto-transitions state DEGRADED → READY on heartbeat recovery (5min window).
      operationId: report
      parameters:
      - name: clusterId
        in: path
        description: Cluster UUID — must match the Bearer token's owning Cluster
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusReportRequest"
        required: true
      responses:
        "200":
          description: Status report accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStatusReportResponse"
        "401":
          description: SDK token missing or invalid (auth.sdk-token-invalid)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStatusReportResponse"
        "403":
          description: Token does not match path clusterId (auth.cluster-mismatch)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStatusReportResponse"
        "409":
          description: Nonce replay (auth.nonce-replay)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStatusReportResponse"
  /v1/api/auth/register:
    post:
      tags:
      - Auth
      summary: Register new user
      description: "Create a new Cloud Console account with email + password. In Week\
        \ 2 preview, email is auto-verified (magic link deferred)."
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: User created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
        "400":
          description: Invalid input or email already registered
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
  /v1/api/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout and invalidate session
      description: Invalidate the current Cloud session. Also fires signed revocation
        callbacks to ALL Clusters this user has active resolve JWTs for (Cloud→Cluster
        callback with RS256 signature — Cluster verifies via SDK verifyRequest). Each
        Cluster then revokes its local session for that jti.
      operationId: logout
      responses:
        "200":
          description: Session invalidated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /v1/api/auth/login:
    post:
      tags:
      - Auth
      summary: Login and create session
      description: "Authenticate with email + password. On success, session cookie\
        \ is set by Spring Session automatically. Session expires after 7 days of\
        \ inactivity."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: "Login successful, session cookie set"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseLoginResult"
        "401":
          description: Invalid credentials
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseLoginResult"
  /v1/api/auth/exchange:
    post:
      tags:
      - Exchange
      summary: Exchange exchange_code for resolve JWT (back-channel)
      description: |-
        Step 2 of the Cloud Console → Cluster Console session handoff (ADR-0125).

        Caller: Cluster Server backend SDK (NOT browser).

        Auth: Cluster must present its per-Cluster sdkStaticToken via
          - Header X-Cluster-Identity-Secret (preferred), OR
          - Header Authorization: Bearer <sdkStaticToken>

        Atomic conditional write in one DB round-trip:
          UPDATE exchange_codes SET consumed_at = NOW()
          WHERE code_hash = sha256(exchange_code)
          AND consumed_at IS NULL
          AND expires_at > NOW()
          AND cluster_id = ?

        On success: signs resolve JWT (RS256, 15min) with claims: sub=user_email, org_id, cluster_id, scope=workload.
        On failure: returns 401 with domain error code.
      operationId: exchange
      parameters:
      - name: X-Cluster-Identity-Secret
        in: header
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRequest"
        required: true
      responses:
        "200":
          description: "exchange_code redeemed, JWT issued"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseExchangeResponse"
        "401":
          description: |-
            Exchange failed:
              - exchange.cluster-identity-mismatch: service secret missing/doesn't match
              - exchange.code-invalid: code not found / already consumed / expired
              - exchange.cluster-bound-mismatch: code issued for different cluster
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseExchangeResponse"
  /v1/api/regions:
    get:
      tags:
      - Regions
      summary: List open regions
      description: "Returns all AWS regions currently open for Cluster provisioning.\
        \ Week 2: only one region (e.g. ap-southeast-1) is open. Region selection\
        \ is done at Cluster creation time and is IMMUTABLE — changing Region requires\
        \ cancel + resubscribe (Week 4+)."
      operationId: listOpenRegions
      responses:
        "200":
          description: List of open regions
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListRegionResponse"
  /v1/api/regions/{code}:
    get:
      tags:
      - Regions
      summary: Get region by code
      description: Returns details for a specific AWS region by its standard code
        (e.g. 'ap-southeast-1').
      operationId: getRegion
      parameters:
      - name: code
        in: path
        description: AWS region code
        required: true
        schema:
          type: string
        example: ap-southeast-1
      responses:
        "200":
          description: Region details
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseRegionResponse"
        "404":
          description: Region not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseRegionResponse"
  /v1/api/orgs/{orgId}:
    get:
      tags:
      - Organizations
      summary: Get organization by ID
      description: Returns Organization details including owner and status. Caller
        must be a member of this Organization.
      operationId: getOrg
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Organization details
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
        "403":
          description: Not a member of this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
        "404":
          description: Organization not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
  /v1/api/orgs/{orgId}/clusters:
    get:
      tags:
      - Clusters
      summary: List clusters in organization
      description: Returns all Clusters owned by this Organization that the current
        user has access to. Requires a valid Cloud Console session.
      operationId: listClusters
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: List of Clusters
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListClusterResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListClusterResponse"
        "403":
          description: Not a member of this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListClusterResponse"
  /v1/api/orgs/{orgId}/clusters/{clusterId}:
    get:
      tags:
      - Clusters
      summary: Get Cluster by ID
      description: "Returns detailed Cluster info including state, provisioning error\
        \ code (if failed), runtime metadata (public DNS, Elastic IP, runtime ID),\
        \ and heartbeat timestamps. Requires Cloud session + Organization membership\
        \ + Cluster ownership."
      operationId: getCluster
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      - name: clusterId
        in: path
        description: Cluster UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Cluster details
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "403":
          description: Not a member of this Organization or not cluster owner
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "404":
          description: Cluster not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
  /v1/api/jwks.json:
    get:
      tags:
      - Resolve / Exchange
      summary: JWKS public key set (RFC 7517)
      description: |-
        Publishes RSA public keys for verifying resolve JWT signatures.

        Runtime SDK caches this JWKS and performs offline verification (ADR-0122 D5 / ADR-0125 D6) — GC never called on per-request workload auth.

        Key rotation: 24h interval with 1h overlap period.

        Returns raw JWKS JSON (RFC 7517 format) — NOT wrapped in ApiResponse.
      operationId: jwks
      responses:
        "200":
          description: JWKS JSON document
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /v1/api/clusters/{clusterId}/resolve:
    get:
      tags:
      - Resolve / Exchange
      summary: Issue exchange_code for Cluster Console handoff
      description: |-
        Part 1 of the Cloud Console → Cluster Console session handoff (ADR-0125).

        Caller must have a valid Cloud Console session (cookie).

        Four conditions enforced:
          1. Cloud session is valid
          2. User is a member of the Org
          3. Cluster exists and belongs to Org
          4. Cluster is NOT in PROVISIONING_FAILED or TERMINATED state

        Returns a one-time exchange_code (60s TTL, base64url 256-bit random) plus the Cluster origin base_uri.

        The browser then does NOT get a JWT here — it GETs `{base_uri}/auth/exchange?code={exchange_code}` on the Cluster Server. The Cluster Server's GC SDK back-channel-calls POST /v1/api/auth/exchange (ExchangeController) where the resolve JWT is atomically signed.
      operationId: resolveCluster
      parameters:
      - name: clusterId
        in: path
        description: Cluster UUID to resolve
        required: true
        schema:
          type: string
      - name: orgId
        in: query
        description: Organization UUID (recommended — validates Org ownership)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: exchange_code issued
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseResolveResponse"
        "401":
          description: No valid Cloud session
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseResolveResponse"
        "403":
          description: User not Org member or Cluster not accessible
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseResolveResponse"
        "404":
          description: Cluster not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseResolveResponse"
        "409":
          description: Cluster in PROVISIONING_FAILED / TERMINATED — cannot resolve
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseResolveResponse"
  /v1/api/auth/me:
    get:
      tags:
      - Auth
      summary: Get current user info
      description: Return the authenticated user's profile. Session cookie required.
      operationId: me
      responses:
        "200":
          description: User profile
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseLoginResult"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseLoginResult"
  /health:
    get:
      tags:
      - Health
      summary: Liveness probe (always 200 when process is running)
      description: Simple liveness check — returns 200 as long as the process is up.
        Kubernetes pod-level probe (not used for dependency checks).
      operationId: liveness
      responses:
        "200":
          description: Service is live
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /health/readiness:
    get:
      tags:
      - Health
      summary: Readiness probe — basic dependency check
      description: Readiness check — verifies database connectivity and returns service
        metadata. Kubernetes probe; Actuator also exposes full readiness at /actuator/health.
      operationId: readiness
      responses:
        "200":
          description: Service is ready
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
components:
  schemas:
    ApiResponseOrganizationResponse:
      type: object
      description: Global API response envelope
      properties:
        opId:
          type: string
          description: Request correlation ID — unique per request
          example: 3f2a1b4c-5d6e-7f8a-9b0c-1d2e3f4a5b6c
        code:
          type: string
          description: "Business result code — 'ok' on success, error code on failure"
          example: ok
        msg:
          type: string
          description: Detailed message — success info or failure reason
        data:
          $ref: "#/components/schemas/OrganizationResponse"
          description: "Response payload — object or array, null on void responses"
    OrganizationResponse:
      type: object
      properties:
        id:
          type: string
          description: Organization UUID
        name:
          type: string
