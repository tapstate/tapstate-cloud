openapi: 3.1.0
info:
  title: Tapstate Cloud — Global Control Plane API
  description: |
    Global Control Plane backend API for Tapstate Cloud.

    ## Authentication

    Three authentication contexts (ADR-0122 D2):
    - **Session Cookie** — Cloud Console users (type ①)
    - **Static Token** — SDK status sender (type ②, `/api/sdk/*`)
    - **Resolve JWT** — issued by this service for Cluster Console access

    ## Regions

    Week 2: only `ap-southeast-1` (Singapore) available.
    Production regions to be added post-W4.

    ## Clusters

    Clusters are auto-provisioned via CloudFormation + EC2 + Docker.
    Lifecycle state machine has 6 states in Week 2.
  contact:
    name: Tapstate Team
    url: https://tapstate.io
    email: cloud@tapstate.io
  version: v1
servers:
- url: https://cloud.tapstate.io
  description: Production
- url: http://localhost:8080
  description: Local development
security:
- session-cookie: []
tags:
- name: Exchange
  description: Atomic exchange_code → resolve JWT redemption. Called by Cluster Server
    backend only — JWT never reaches the browser (ADR-0125).
- name: Organizations
  description: Organization management — isolation boundary for Clusters
- name: C2 Status Report
  description: Runtime → Global Control Plane heartbeat + health metrics (SDK Bearer
    auth)
- name: Resolve / Exchange
  description: Cloud Console → Cluster Console handoff. /resolve issues a one-time
    exchange_code; /auth/exchange (handled by ExchangeController) atomically redeems
    it for a resolve JWT. JWKS endpoint publishes public key for runtime offline JWT
    verification.
- name: Auth
  description: "Cloud Console authentication — register, login, session management"
- name: Subscription
  description: Organization subscriptions — each subscription provisions one Cluster
    + one MDB allocation
- name: Clusters
  description: Cluster read, retry, and egress address management — lifecycle managed via Subscription
- name: Regions
  description: Available AWS regions for Cluster provisioning
- name: Deployment Progress
  description: Subscription deployment/reclamation progress
- name: Support tickets
  description: Cloud session-owned Jira Service Management requests
- name: Health
  description: Health check endpoints
paths:
  /v1/api/orgs:
    get:
      tags:
      - Organizations
      summary: List current user's organizations
      description: Returns all Organizations the authenticated user is a member of.
        Organizations are the isolation boundary for Clusters and subscriptions.
      operationId: listMyOrganizations
      responses:
        "200":
          description: List of Organizations (may be empty)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListOrganizationResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListOrganizationResponse"
    post:
      tags:
      - Organizations
      summary: Create new organization (user becomes owner automatically)
      description: "Creates a new Organization and adds the caller as its first member\
        \ with owner role. The Organization starts with no subscriptions — create\
        \ them explicitly via POST /v1/api/orgs/{orgId}/subscriptions. Organization\
        \ slug must be unique system-wide (lowercase, hyphenated)."
      operationId: create
      requestBody:
        description: "Organization create payload: {\"name\": \"Acme Corp\", \"slug\"\
          : \"acme-corp\"}"
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
        required: true
      responses:
        "200":
          description: Organization created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
        "400":
          description: "Invalid input (missing name/slug, slug format)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
        "409":
          description: Slug already taken
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
  /v1/api/specs:
    get:
      tags:
      - Subscription
      summary: List subscription specs with their payment-channel pricing
      description: |-
        Public catalog endpoint — no session required, because the Console renders
        pricing before the user signs in.

        JOINs the platform spec catalog (`spec_config`, enabled only) with the active
        Stripe prices (`stripe_products`, enabled Product + enabled Price). A spec with
        no active price on any enabled Product is omitted: it cannot be purchased.
      operationId: listSpecs
      security: []
      responses:
        "200":
          description: Enabled specs that have active pricing
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListSpecWithPricingResponse"
  /v1/api/orgs/{orgId}/subscriptions:
    get:
      tags:
      - Subscription
      summary: List organization subscriptions
      description: "Returns every Subscription owned by the Organization, newest first.\
        \ The list may be empty — creating an Organization no longer creates a subscription."
      operationId: listSubscriptions
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: List of subscriptions (may be empty)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListSubscriptionResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListSubscriptionResponse"
        "403":
          description: Not a member of this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListSubscriptionResponse"
  /v1/api/orgs/{orgId}/subscriptions/checkout:
    post:
      tags:
      - Subscription
      summary: Start a Stripe Checkout session for a spec
      description: |-
        Validates the spec against the platform catalog and its payment-channel
        pricing, creates a Stripe Checkout Session, and persists a
        `PENDING_PAYMENT` Subscription shell.

        No Cluster and no MdbAllocation are created here. Provisioning starts only
        after Stripe confirms payment via the `checkout.session.completed` webhook,
        which drives `PENDING_PAYMENT → ACTIVE` and sets `provisionInitiated`.
      operationId: createCheckoutSession
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutRequest"
        required: true
      responses:
        "201":
          description: Checkout session created — shell subscription plus redirect URL
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCheckoutResponse"
        "400":
          description: Unknown spec key, or no active pricing configured for it
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCheckoutResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCheckoutResponse"
        "403":
          description: Not a member of this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCheckoutResponse"
        "409":
          description: Duplicate request (clientRequestId already used)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCheckoutResponse"
  /v1/api/orgs/{orgId}/subscriptions/{subscriptionId}/cancel-at-period-end:
    post:
      tags:
      - Subscription
      summary: Cancel at the end of the current billing period
      description: |-
        Sets `cancel_at_period_end=true` on the payment channel's subscription and
        moves the Subscription to `PENDING_CANCEL`. Resources stay usable until the
        period ends; a scheduled reaper then transitions to `CANCELLED` and cascades
        Cluster termination.

        Only valid from `ACTIVE`. Idempotent from `PENDING_CANCEL` / `CANCELLED`.
      operationId: cancelAtPeriodEnd
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      - name: subscriptionId
        in: path
        description: Subscription UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Subscription moved to PENDING_CANCEL
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "400":
          description: Invalid state for this operation
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "403":
          description: Not a member of this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "404":
          description: Subscription not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
  /v1/api/orgs/{orgId}/subscriptions/{subscriptionId}/cancel-now:
    post:
      tags:
      - Subscription
      summary: Cancel immediately, with no grace period
      description: |-
        Cancels the payment channel's subscription right away and moves the
        Subscription to `CANCELLED`, cascading Cluster termination and MdbAllocation
        reclaim. Unlike `/cancel-at-period-end` there is no remaining service period.
      operationId: cancelNow
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      - name: subscriptionId
        in: path
        description: Subscription UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Subscription cancelled immediately
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "403":
          description: Not a member of this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "404":
          description: Subscription not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
  /v1/api/orgs/{orgId}/subscriptions/{subscriptionId}/finalize-provisioning:
    post:
      tags:
      - Subscription
      summary: Provision Cluster + MDB after a confirmed checkout
      description: |-
        Called by the Console once the user returns from Stripe Checkout. Requires a
        Subscription already activated by the webhook (`ACTIVE` + `provisionInitiated`).
        Creates the Cluster and MdbAllocation from the spec snapshot taken at checkout
        time and starts asynchronous provisioning.
      operationId: finalizeProvisioning
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      - name: subscriptionId
        in: path
        description: Subscription UUID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeProvisioningRequest"
        required: true
      responses:
        "201":
          description: Resources created, provisioning started
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "400":
          description: Subscription not activated, or spec snapshot missing
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "403":
          description: Not a member of this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "404":
          description: Subscription not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
  /v1/api/orgs/{orgId}/clusters/{clusterId}/retry:
    post:
      tags:
      - Clusters
      summary: Retry provisioning_failed Cluster
      description: |-
        Retries a Cluster that previously failed provisioning (state = PROVISIONING_FAILED).

        StateMachine cleanup flow: clears residual resources from the failed attempt → re-triggers the full provisioning pipeline from PROVISIONING_PENDING.

        Returns 409 if the Cluster is not in PROVISIONING_FAILED state.
      operationId: retryCluster
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      - name: clusterId
        in: path
        description: Cluster UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "Retry initiated, state reset to PROVISIONING_PENDING"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "403":
          description: Not cluster owner
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "404":
          description: Cluster not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "409":
          description: Cluster not in PROVISIONING_FAILED state
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
  /v1/api/orgs/{orgId}/clusters/{clusterId}/egress-address:stabilize:
    post:
      tags:
      - Clusters
      summary: Stabilize the Cluster egress IPv4 address
      description: Attaches a Cluster-owned Elastic IP to a live Cluster. The public address and DNS record change when the operation completes; the EC2 runtime is not replaced.
      operationId: stabilizeClusterEgressAddress
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: clusterId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Egress address stabilization started or is already in progress
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseClusterResponse"
        "401":
          description: Not authenticated
        "403":
          description: Not a member of this Organization or not cluster owner
        "404":
          description: Cluster not found
        "409":
          description: Cluster is not live
  /v1/api/clusters/{clusterId}/egress-address:
    get:
      tags: [C2 Status Report]
      summary: Read the runtime Cluster's current outbound address
      operationId: currentEgressAddress
      description: Uses the per-Cluster SDK Bearer token and returns no credentials. The token must own the requested Cluster.
      security: []
      parameters:
      - name: clusterId
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Current Cluster address; response is not cacheable
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  data:
                    type: object
                    properties:
                      organizationId:
                        type: string
                      clusterId:
                        type: string
                      ec2PublicIp:
                        type: [string, "null"]
                      egressAddressStatus:
                        type: string
        "401":
          description: SDK token missing, invalid, or owned by another Cluster
  /v1/api/clusters/{clusterId}/status-report:
    post:
      tags:
      - C2 Status Report
      summary: Runtime C2 status report (heartbeat + metrics)
      description: |-
        Runtime SDK posts heartbeat + infrastructure-level health metrics.

        Authentication: Bearer token in Authorization header — the Cluster's per-Cluster sdk-static-token (issued at provisioning time).

        Nonce replay protection: Every request must carry a unique nonce string. Duplicate nonce → 409 auth.nonce-replay.

        Data minimization: Only infrastructure metrics accepted (runtime version, uptime, active pipeline count, last error time). No user data, Source/Pipeline configs, or Atlas credentials flow through this endpoint.

        Effects: Updates Cluster.lastHeartbeatAt; stores full payload as Cluster.lastStatusReport embedded document; auto-transitions state DEGRADED → READY on heartbeat recovery (5min window).
      operationId: report
      parameters:
      - name: clusterId
        in: path
        description: Cluster ObjectId — must match the Bearer token's owning Cluster
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusReportRequest"
        required: true
      responses:
        "200":
          description: Status report accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStatusReportResponse"
        "401":
          description: SDK token missing or invalid (auth.sdk-token-invalid)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStatusReportResponse"
        "403":
          description: Token does not match path clusterId (auth.cluster-mismatch)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStatusReportResponse"
        "409":
          description: Nonce replay (auth.nonce-replay)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseStatusReportResponse"
  /v1/api/auth/register:
    post:
      tags:
      - Auth
      summary: Register new user
      description: "Create a new Cloud Console account with email + password. In Week\
        \ 2 preview, email is auto-verified (magic link deferred)."
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: User created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
        "400":
          description: Invalid input or email already registered
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
  /v1/api/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout and invalidate session
      description: Invalidate the current Cloud session. Also fires signed revocation
        callbacks to ALL Clusters this user has active resolve JWTs for (Cloud→Cluster
        callback with RS256 signature — Cluster verifies via SDK verifyRequest). Each
        Cluster then revokes its local session for that jti.
      operationId: logout
      responses:
        "200":
          description: Session invalidated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /v1/api/auth/login:
    post:
      tags:
      - Auth
      summary: Login and create session
      description: "Authenticate with email + password. On success, session cookie\
        \ is set by Spring Session automatically. Session expires after 7 days of\
        \ inactivity."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: "Login successful, session cookie set"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseLoginResult"
        "401":
          description: Invalid credentials
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseLoginResult"
  /v1/api/auth/exchange:
    post:
      tags:
      - Exchange
      summary: Exchange exchange_code for resolve JWT (back-channel)
      description: |-
        Step 2 of the Cloud Console → Cluster Console session handoff (ADR-0125).

        Caller: Cluster Server backend SDK (NOT browser).

        Auth: Cluster must present its per-Cluster sdkStaticToken via
          - Header X-Cluster-Identity-Secret (preferred), OR
          - Header Authorization: Bearer <sdkStaticToken>

        Atomic conditional write in one DB round-trip:
          UPDATE exchange_codes SET consumed_at = NOW()
          WHERE code_hash = sha256(exchange_code)
          AND consumed_at IS NULL
          AND expires_at > NOW()
          AND cluster_id = ?

        On success: signs resolve JWT (RS256, 15min) with claims: sub=user_email, org_id, cluster_id, scope=workload.
        On failure: returns 401 with domain error code.
      operationId: exchange
      parameters:
      - name: X-Cluster-Identity-Secret
        in: header
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRequest"
        required: true
      responses:
        "200":
          description: "exchange_code redeemed, JWT issued"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseExchangeResponse"
        "401":
          description: |-
            Exchange failed:
              - exchange.cluster-identity-mismatch: service secret missing/doesn't match
              - exchange.code-invalid: code not found / already consumed / expired
              - exchange.cluster-bound-mismatch: code issued for different cluster
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseExchangeResponse"
  /v1/api/regions:
    get:
      tags:
      - Regions
      summary: List open regions
      description: "Returns all AWS regions currently open for Cluster provisioning.\
        \ Week 2: only one region (e.g. ap-southeast-1) is open. Region selection\
        \ is done at Cluster creation time and is IMMUTABLE — changing Region requires\
        \ cancel + resubscribe (Week 4+)."
      operationId: listOpenRegions
      responses:
        "200":
          description: List of open regions
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListRegionResponse"
  /v1/api/regions/{code}:
    get:
      tags:
      - Regions
      summary: Get region by code
      description: Returns details for a specific AWS region by its standard code
        (e.g. 'ap-southeast-1').
      operationId: getRegion
      parameters:
      - name: code
        in: path
        description: AWS region code
        required: true
        schema:
          type: string
        example: ap-southeast-1
      responses:
        "200":
          description: Region details
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseRegionResponse"
        "404":
          description: Region not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseRegionResponse"
  /v1/api/orgs/{orgId}:
    get:
      tags:
      - Organizations
      summary: Get organization by ID
      description: Returns Organization details including owner and status. Caller
        must be a member of this Organization.
      operationId: getOrg
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Organization details
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
        "403":
          description: Not a member of this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
        "404":
          description: Organization not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseOrganizationResponse"
  /v1/api/orgs/{orgId}/subscriptions/{subscriptionId}:
    get:
      tags:
      - Subscription
      summary: Get one subscription
      description: |-
        Returns the subscription's status, billing period, provisioned resources and item breakdown.

        Subscription states: TRIAL (free trial) / ACTIVE (paid) / PAST_DUE (grace period) / CANCELLED (terminated).

        Poll this endpoint to track async Cluster + MDB provisioning progress.
      operationId: getSubscription
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      - name: subscriptionId
        in: path
        description: Subscription UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Subscription details
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "403":
          description: Not a member of this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
        "404":
          description: Subscription not found in this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseSubscriptionResponse"
  /v1/api/orgs/{orgId}/subscriptions/{subscriptionId}/progress:
    get:
      tags:
      - Deployment Progress
      summary: Get the deployment progress of one subscription
      description: Returns the aggregate completion percentage and overall status
        plus the detail of every operation. Use opType=INSTALL for the initial deployment
        (default) and opType=UNINSTALL for the release/reclamation after cancellation.
        Operations not started yet are returned as PENDING.
      operationId: getProgress
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      - name: subscriptionId
        in: path
        description: Subscription UUID
        required: true
        schema:
          type: string
      - name: opType
        in: query
        description: "Operation category: INSTALL (default) / UNINSTALL"
        required: false
        schema:
          type: string
          default: INSTALL
      responses:
        "200":
          description: Aggregated deployment progress
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseDeploymentProgressResponse"
        "400":
          description: Invalid opType
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseDeploymentProgressResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseDeploymentProgressResponse"
        "403":
          description: Not a member of this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseDeploymentProgressResponse"
        "404":
          description: Subscription not found in this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseDeploymentProgressResponse"
  /v1/api/orgs/{orgId}/clusters:
    get:
      tags:
      - Clusters
      summary: List clusters in organization
      description: Returns all Clusters owned by this Organization that the current
        user has access to. Requires a valid Cloud Console session.
      operationId: listClusters
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: List of Clusters
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListClusterResponse"
        "401":
          description: Not authenticated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListClusterResponse"
        "403":
          description: Not a member of this Organization
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListClusterResponse"
  /v1/api/orgs/{orgId}/clusters/{clusterId}:
    get:
      tags:
      - Clusters
      summary: Get Cluster by ID
      description: "Returns detailed Cluster info including state, provisioning error\
        \ code (if failed), runtime metadata (public DNS, Elastic IP, runtime ID),\
        \ and heartbeat timestamps. Requires Cloud session + Organization membership\
        \ + Cluster ownership."
      operationId: getCluster
      parameters:
      - name: orgId
        in: path
        description: Organization UUID
        required: true
        schema:
          type: string
      - name: clusterId
        in: path
        description: Cluster UUID
        required: true
