          description: Jira Service Management is unavailable
        "503":
          description: Jira configuration is missing or submission result is uncertain
  /v1/api/tickets/{cloudTicketId}:
    get:
      tags:
      - Support tickets
      summary: Read one of the current user's support tickets
      operationId: getMyTicket
      parameters:
      - name: cloudTicketId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Ticket details with live Jira status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTicket"
        "401":
          description: Not authenticated
        "404":
          description: Ticket does not exist or is not owned by the caller
        "503":
          description: Jira Service Management is not configured
        "502":
          description: Jira Service Management is unavailable
  /v1/api/tickets/{cloudTicketId}/close:
    post:
      tags:
      - Support tickets
      summary: Close one of the current user's tickets when the Jira workflow permits it
      operationId: closeMyTicket
      parameters:
      - name: cloudTicketId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Ticket closed and Jira status re-read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTicket"
        "401":
          description: Not authenticated
        "404":
          description: Ticket does not exist or is not owned by the caller
        "409":
          description: Configured close transition is not available
        "502":
          description: Jira Service Management is unavailable
        "503":
          description: Jira Service Management is not configured
  /v1/api/auth/identities:
    get:
      tags:
      - identity-controller
      operationId: listIdentities
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListIdentityView"
  /health:
    get:
      tags:
      - Health
      summary: Liveness probe (always 200 when process is running)
      description: Simple liveness check — returns 200 as long as the process is up.
        Kubernetes pod-level probe (not used for dependency checks).
      operationId: liveness
      responses:
        "200":
          description: Service is live
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /health/readiness:
    get:
      tags:
      - Health
      summary: Readiness probe — basic dependency check
      description: Readiness check — verifies database connectivity and returns service
        metadata. Kubernetes probe; Actuator also exposes full readiness at /actuator/health.
      operationId: readiness
      responses:
        "200":
          description: Service is ready
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /v1/api/orgs/{orgId}/invitations/{invitationId}:
    delete:
      tags:
      - Organization invitations
      summary: Revoke an organization invitation
      description: Revokes an unused invitation owned by the specified organization.
      operationId: revokeInvitation
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseInvitationView"
