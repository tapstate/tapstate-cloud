        summary:
          type: string
        description:
          type: string
        status:
          type: string
        statusCategory:
          type: string
        createdAt:
          type: string
          format: date-time
        canClose:
          type: boolean
          description: Whether the current Jira workflow allows the caller to close this ticket
    LoginResult:
      type: object
      properties:
        email:
          type: string
          description: Authenticated user email
        displayName:
          type: string
          description: User display name
    ExchangeRequest:
      type: object
      properties:
        exchangeCode:
          type: string
          minLength: 1
        clusterId:
          type: string
          minLength: 1
      required:
      - clusterId
      - exchangeCode
    ApiResponseExchangeResponse:
      type: object
      description: Global API response envelope
      properties:
        opId:
          type: string
          description: Request correlation ID — unique per request
          example: 3f2a1b4c-5d6e-7f8a-9b0c-1d2e3f4a5b6c
        code:
          type: string
          description: "Business result code — 'ok' on success, error code on failure"
          example: ok
        msg:
          type: string
          description: Detailed message — success info or failure reason
        data:
          $ref: "#/components/schemas/ExchangeResponse"
          description: "Response payload — object or array, null on void responses"
    ExchangeResponse:
      type: object
      properties:
        jwt:
          type: string
          description: "Resolve JWT (RS256, 15min) — carry to Cluster Console workload\
            \ requests"
        expiresAt:
          type: string
          description: JWT expiration timestamp (ISO-8601 UTC)
        jti:
          type: string
          description: JWT jti (unique token ID — for audit + Cloud-side revocation)
        userEmail:
          type: string
          description: User email bound to this session
        userId:
          type: string
          description: "Stable user UUID (Issue #5 item 1)"
        orgId:
          type: string
          description: Organization UUID bound to this session
        clusterId:
          type: string
          description: Cluster UUID bound to this session
        organizationName:
          type: string
          description: Organization display name from the Organization bound to the redeemed exchange code
        clusterName:
          type: string
          description: Cluster display name from the Cluster bound to the redeemed exchange code
        region:
          type: string
          description: AWS region from the Cluster bound to the redeemed exchange code
        ec2PublicIp:
          type: string
          nullable: true
