  /v1/api/tickets:
    get:
      tags:
      - Support tickets
      summary: List the current user's support tickets
      operationId: listMyTickets
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        "200":
          description: Page of the caller's tickets with live Jira status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTicketPage"
        "401":
          description: Not authenticated
        "503":
          description: Jira Service Management is not configured
        "502":
          description: Jira Service Management is unavailable
    post:
      tags:
      - Support tickets
      summary: Create a support request for the current Cloud user
      operationId: createMyTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Jira request created and linked to the current Cloud user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTicket"
        "400":
          description: Request title or description is invalid or rejected by Jira
        "401":
          description: Not authenticated
        "403":
          description: Cloud account email is not verified
        "409":
          description: Current Cloud email could not be resolved to one Jira customer
        "502":
          description: Jira Service Management is unavailable
        "503":
          description: Jira configuration is missing or submission result is uncertain
  /v1/api/tickets/{cloudTicketId}:
    get:
      tags:
      - Support tickets
      summary: Read one of the current user's support tickets
      operationId: getMyTicket
      parameters:
      - name: cloudTicketId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Ticket details with live Jira status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTicket"
        "401":
          description: Not authenticated
        "404":
          description: Ticket does not exist or is not owned by the caller
        "503":
          description: Jira Service Management is not configured
        "502":
          description: Jira Service Management is unavailable
  /v1/api/tickets/{cloudTicketId}/close:
    post:
      tags:
      - Support tickets
      summary: Close one of the current user's tickets when the Jira workflow permits it
      operationId: closeMyTicket
      parameters:
      - name: cloudTicketId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Ticket closed and Jira status re-read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTicket"
        "401":
          description: Not authenticated
        "404":
          description: Ticket does not exist or is not owned by the caller
        "409":
          description: Configured close transition is not available
        "502":
          description: Jira Service Management is unavailable
        "503":
          description: Jira Service Management is not configured
  /health:
    get:
      tags:
      - Health
      summary: Liveness probe (always 200 when process is running)
      description: Simple liveness check — returns 200 as long as the process is up.
        Kubernetes pod-level probe (not used for dependency checks).
      operationId: liveness
      responses:
        "200":
          description: Service is live
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /health/readiness:
    get:
      tags:
      - Health
      summary: Readiness probe — basic dependency check
      description: Readiness check — verifies database connectivity and returns service
        metadata. Kubernetes probe; Actuator also exposes full readiness at /actuator/health.
      operationId: readiness
      responses:
        "200":
          description: Service is ready
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
