# ============================================================
# CI — PR baseline (lint → compile → test)
# Per ADR-0124 D6: PRs only run lint/compile/test/arch-tests
#     — NO ECR push, NO k3s kubectl, NO CloudFormation
# ============================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    # Every branch, main included. The main run is a required gate for
    # deploy.yaml: its CD waits for this workflow to pass on the exact
    # pushed SHA before deploying to awsdev.
    branches: ['**']

jobs:
  # ---------- Job 1: Lint + Compile ----------
  build:
    name: Build & Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Validate Maven wrapper
        run: mvn -v

      - name: Compile
        run: mvn clean compile -B -q

      - name: Package (skip tests for speed)
        run: mvn package -B -DskipTests -q

  # ---------- Job 2: Unit Tests ----------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        # The health command must be ONE quoted token: a folded scalar joins
        # these lines with spaces, so an unquoted `mongosh --eval ...` makes
        # --health-cmd swallow only `mongosh` and hands `--eval` to
        # `docker create`, which rejects it (exit 125) and the container never
        # starts.
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit tests
        run: mvn test -B -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/*.xml
          retention-days: 7

  # ---------- Job 3: OpenAPI Spec Validation ----------
  openapi:
    name: OpenAPI Spec Validation
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate OpenAPI spec (if present)
        run: |
          if [ -f src/main/resources/openapi.yaml ]; then
            echo "openapi.yaml found — validation will run at runtime via SpringDoc"
          else
            echo "openapi.yaml not found — SpringDoc generates dynamically from annotations"
          fi

  # ---------- Job 4: Docker Build (no push in CI) ----------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tapstate-cloud:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Job 5: Helm Chart Lint ----------
  helm-lint:
    name: Helm Chart Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Lint Helm chart
        run: helm lint helm/tapstate-cloud-control

      - name: Template render check (local values)
        run: helm template tapstate-cloud-control helm/tapstate-cloud-control -f helm/tapstate-cloud-control/values-local.yaml > /dev/null

      - name: Template render check (AWS prod values)
        run: helm template tapstate-cloud-control helm/tapstate-cloud-control -f helm/tapstate-cloud-control/values-awsprod.yaml > /dev/null

  # ---------- Job 6: Repository hygiene ----------
  # Governance baseline: CODEOWNERS ownership/module structure and a scan for
  # accidentally committed secrets. Needs only a checkout — no JDK, no Maven.
  repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository structure (modules + CODEOWNERS)
        run: bash scripts/check-repo-structure.sh

      - name: Check for committed secrets
        run: bash scripts/check-no-secrets.sh

  # Publish the feature branch SDK for pre-merge consumers. After merge,
  # deploy.yaml owns Nexus publishing on main and release-v* branches.
  publish-workstream-sdk-snapshot:
    name: Publish feature branch SDK snapshot to Nexus
    if: github.event_name == 'push' && github.ref == 'refs/heads/ws/cloud-week4-cluster-address-visibility'
    needs: [build, test, openapi, docker-build, helm-lint, repo-hygiene]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Configure Maven settings for Nexus
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>nexus-tapdata-net</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Compute commit-specific snapshot version
        id: version
        run: |
          TAG=$(git describe --tags --abbrev=0 --match "v*" --match "[0-9]*" 2>/dev/null \
            || git describe --tags --abbrev=0 --match "[0-9]*" 2>/dev/null \
            || echo "0.1.1")
          TAG="${TAG#v}"
          TAG=$(echo "$TAG" | sed -E 's/[-_.](SNAPSHOT|rc|alpha|beta)[-_.0-9]*$//i')
          VERSION="${TAG}-${GITHUB_SHA:0:8}-SNAPSHOT"
          echo "sdk_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Published SDK coordinate: io.tapstate:cloud-control-plane-sdk:$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy parent POM and SDK to Nexus snapshots
        run: |
          mvn versions:set \
            -DnewVersion=${{ steps.version.outputs.sdk_version }} \
            -DgenerateBackupPoms=false \
            -q
          mvn -N deploy \
            -Dmaven.test.skip=true \
            -Dmaven.javadoc.skip=true \
            -DskipSdkGeneration=true \
            -B
          mvn -pl client/java deploy \
            -Dmaven.test.skip=true \
            -DskipSdkGeneration=true \
            -Dmaven.javadoc.skip=true \
            -B
