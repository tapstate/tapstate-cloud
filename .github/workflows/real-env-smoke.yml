# ============================================================
# Real-env smoke test — runs integration tests against a PRE-DEPLOYED
# Control Plane. Unlike Full Integration, this workflow does NOT fork
# a Spring Boot application; it connects to whatever Control Plane the
# caller specifies via workflow_dispatch inputs.
#
# Trigger — MANUAL ONLY (no auto-trigger):
#   gh workflow run real-env-smoke.yml \
#     --repo tapstate/tapstate-cloud \
#     --raw-field cp_url=https://dev.cloud.tapstate.com \
#     --raw-field cp_email_secret=AWSDEV_TEST_EMAIL \
#     --raw-field cp_password_secret=AWSDEV_TEST_PASSWORD \
#     --raw-field mongo_uri_secret=AWSDEV_MONGO_URI
#
# Two-phase Maven:
#   1. mvn install -pl cloud-control-plane -am — reactor build so
#      cloud-control-plane-sdk / tapstate-cloud-common resolve locally.
#   2. failsafe:integration-test failsafe:verify with -Dspring-boot.*.skip
#      to bypass spring-boot-maven-plugin pre/post-integration-test
#      (which forks a local jar → connects to localhost:27017 Mongo).
#      We connect to CP_BASE_URL, never fork our own app.
# ============================================================

name: Real-Env Smoke Test

on:
  workflow_dispatch:
    inputs:
      cp_url:
        description: 'Control Plane base URL (no trailing slash)'
        required: true
        type: string
      cp_email_secret:
        description: 'GitHub secret name holding Control Plane user email'
        required: false
        type: string
      cp_password_secret:
        description: 'GitHub secret name holding Control Plane user password'
        required: false
        type: string
      mongo_uri_secret:
        description: 'GitHub secret name holding MongoDB connection string (optional)'
        required: false
        type: string
      jdk:
        description: 'JDK version'
        required: false
        default: '21'
        type: string

jobs:
  real-env-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk }}
          cache: maven

      - name: Install mongosh
        run: |
          set -euo pipefail
          . /etc/os-release
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates curl
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | \
            sudo gpg -o /usr/share/keyrings/mongodb-server-8.0.gpg --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu ${VERSION_CODENAME}/mongodb-org/8.0 multiverse" | \
            sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh

      - name: Build + run RealEnv tests (skip boot fork)
        env:
          CP_BASE_URL: ${{ inputs.cp_url }}
          CP_EMAIL: ${{ secrets[inputs.cp_email_secret] }}
          CP_PASSWORD: ${{ secrets[inputs.cp_password_secret] }}
          MONGO_URI: ${{ secrets[inputs.mongo_uri_secret] }}
        run: |
          # Phase 1: reactor install — dependencies are tapstate-internal.
          mvn -B -ntp -DskipTests -DskipSdkGeneration=true \
            -pl cloud-control-plane -am install
          # Phase 2: run RealEnv*IT directly.
          # -Dspring-boot.start.skip/stop.skip bypass the pom's
          # pre/post-integration-test fork (which tries localhost:27017).
          mvn -B -ntp -DskipSdkGeneration=true \
            -pl cloud-control-plane \
            -Dspring-boot.start.skip=true -Dspring-boot.stop.skip=true \
            failsafe:integration-test failsafe:verify \
            "-Dit.test=RealEnv*IT" \
            -DfailIfNoSpecifiedTests=false \
            -DtrimStackTrace=false

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-env-smoke-reports
          path: cloud-control-plane/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7
