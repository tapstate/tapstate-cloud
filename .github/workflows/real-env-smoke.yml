# ============================================================
# Real-env smoke test — runs integration tests against a PRE-DEPLOYED
# Control Plane. Unlike Full Integration, this workflow does NOT fork
# a Spring Boot application; it connects to whatever Control Plane the
# caller specifies via workflow_dispatch inputs. Same tests, zero
# assumptions about localhost or failsafe pre-integration-test apps.
#
# Trigger — MANUAL ONLY:
#   GitHub Actions UI — Actions → "Real-Env Smoke Test" → Run workflow
#   gh CLI — gh workflow run real-env-smoke.yml \
#              --raw-field cp_url=https://dev.cloud.tapstate.com \
#              --raw-field cp_email_secret=AWSDEV_TEST_EMAIL \
#              ...
#   No automatic trigger — we never want a push to accidentally run
#   billable Cluster provisioning against a shared env.
#
# Test selection:
#   Run ONLY the io.tapstate.cloud.it.RealEnv*IT classes. These are
#   parameterized via CP_BASE_URL / CP_EMAIL / CP_PASSWORD / MONGO_URI
#   env vars and assume nothing about localhost. Missing CP creds →
#   assumeTrue → SKIP all tests cleanly (not FAIL).
#
# Inputs map 1:1 to RealEnvIT static fields:
#   CP_BASE_URL   ← inputs.cp_url
#   CP_EMAIL      ← secrets[inputs.cp_email_secret]
#   CP_PASSWORD   ← secrets[inputs.cp_password_secret]
#   MONGO_URI     ← secrets[inputs.mongo_uri_secret]  (optional —
#                  store-visibility assertions SKIP when absent)
# ============================================================

name: Real-Env Smoke Test

on:
  workflow_dispatch:
    inputs:
      cp_url:
        description: 'Control Plane base URL (no trailing slash), e.g. https://dev.cloud.tapstate.com'
        required: true
        type: string
      cp_email_secret:
        description: 'Name of the GitHub secret holding the Control Plane user email'
        required: false
        type: string
      cp_password_secret:
        description: 'Name of the GitHub secret holding the Control Plane user password'
        required: false
        type: string
      mongo_uri_secret:
        description: 'Name of the GitHub secret holding the MongoDB connection string (optional)'
        required: false
        type: string
      jdk:
        description: 'JDK version'
        required: false
        default: '21'
        type: string

jobs:
  real-env-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk }}
          cache: maven

      - name: Install mongosh
        run: |
          set -euo pipefail
          . /etc/os-release
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates curl
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | \
            sudo gpg -o /usr/share/keyrings/mongodb-server-8.0.gpg --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu ${VERSION_CODENAME}/mongodb-org/8.0 multiverse" | \
            sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh
          mongosh --version

      - name: Build + run RealEnv tests (skip boot fork — connect to pre-deployed Control Plane)
        env:
          CP_BASE_URL: ${{ inputs.cp_url }}
          CP_EMAIL: ${{ secrets[inputs.cp_email_secret] }}
          CP_PASSWORD: ${{ secrets[inputs.cp_password_secret] }}
          MONGO_URI: ${{ secrets[inputs.mongo_uri_secret] }}
        run: |
          # Two-phase: reactor build first (so cloud-control-plane-sdk and
          # tapstate-cloud-common resolve from local reactor), then directly
          # invoke failsafe goals. We deliberately avoid `mvn verify` because
          # the cloud-control-plane pom binds spring-boot-maven-plugin start
          # to pre-integration-test — that forks a local jar which tries to
          # connect to localhost:27017 Mongo, but we DO NOT fork any app.
          # RealEnv*IT connects to whatever CP_BASE_URL the inputs specify.
          mvn -B -ntp -DskipTests -DskipSdkGeneration=true \
            -pl cloud-control-plane -am install \
            2>&1 | tee cloud-control-plane/target/real-env-smoke-build.log

          mvn -B -ntp -DskipSdkGeneration=true \
            -pl cloud-control-plane \
            failsafe:integration-test failsafe:verify \
            "-Dit.test=RealEnv*IT" \
            -DfailIfNoSpecifiedTests=false \
            -DtrimStackTrace=false \
            2>&1 | tee cloud-control-plane/target/real-env-smoke.log

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-env-smoke-reports
          path: |
            cloud-control-plane/target/failsafe-reports/
            cloud-control-plane/target/real-env-smoke.log
          if-no-files-found: warn
          retention-days: 7
