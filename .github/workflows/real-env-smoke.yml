# ============================================================
# Real-env smoke test — runs integration tests against a PRE-DEPLOYED
# Control Plane. Unlike Full Integration, this workflow does NOT use
# the locally-forked Spring Boot app as the test target. The boot fork
# exists only because cloud-control-plane pom binds spring-boot-maven-
# plugin start/stop to pre/post-integration-test — we run a local
# mongodb service so it can start cleanly, then the tests themselves
# connect to CP_BASE_URL (external, pre-deployed).
#
# Trigger — MANUAL ONLY (no auto-trigger):
#   gh workflow run real-env-smoke.yml \
#     --repo tapstate/tapstate-cloud \
#     --raw-field cp_url=https://dev.cloud.tapstate.com \
#     --raw-field cp_email_secret=AWSDEV_TEST_EMAIL \
#     --raw-field cp_password_secret=AWSDEV_TEST_PASSWORD \
#     --raw-field mongo_uri_secret=AWSDEV_MONGO_URI
# ============================================================

name: Real-Env Smoke Test

on:
  workflow_dispatch:
    inputs:
      cp_url:
        description: 'Control Plane base URL (no trailing slash)'
        required: true
        type: string
      cp_email_secret:
        description: 'GitHub secret name holding Control Plane user email'
        required: false
        type: string
      cp_password_secret:
        description: 'GitHub secret name holding Control Plane user password'
        required: false
        type: string
      mongo_uri_secret:
        description: 'GitHub secret name holding MongoDB connection string (optional)'
        required: false
        type: string
      jdk:
        description: 'JDK version'
        required: false
        default: '21'
        type: string

jobs:
  real-env-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Local mongo so spring-boot-maven-plugin pre-integration-test fork
    # can connect to localhost:27017. The fork is not our test target —
    # RealEnv*IT connects to CP_BASE_URL, never to the local fork.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk }}
          cache: maven

      - name: Install mongosh (for store-visibility assertions)
        run: |
          set -euo pipefail
          . /etc/os-release
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates curl
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | \
            sudo gpg -o /usr/share/keyrings/mongodb-server-8.0.gpg --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu ${VERSION_CODENAME}/mongodb-org/8.0 multiverse" | \
            sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh

      - name: Build + run RealEnv tests
        env:
          CP_BASE_URL: ${{ inputs.cp_url }}
          CP_EMAIL: ${{ secrets[inputs.cp_email_secret] }}
          CP_PASSWORD: ${{ secrets[inputs.cp_password_secret] }}
          MONGO_URI: ${{ secrets[inputs.mongo_uri_secret] }}
        run: |
          mvn -B -ntp -DskipSdkGeneration=true \
            -pl cloud-control-plane -am verify \
            "-Dit.test=RealEnv*IT" \
            -DfailIfNoSpecifiedTests=false \
            -DtrimStackTrace=false

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-env-smoke-reports
          path: cloud-control-plane/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7
