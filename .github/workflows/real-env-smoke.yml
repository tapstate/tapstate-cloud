# ============================================================
# Real-env smoke test — runs integration tests against a PRE-DEPLOYED
# Control Plane. Unlike Full Integration, this workflow does NOT fork
# a Spring Boot application; it connects to whatever Control Plane the
# caller specifies via workflow_dispatch inputs. Same tests, zero
# assumptions about localhost or failsafe pre-integration-test apps.
#
# Trigger — MANUAL ONLY:
#   GitHub Actions UI — Actions → "Real-Env Smoke Test" → Run workflow
#   gh CLI — gh workflow run real-env-smoke.yml \
#              --raw-field cp_url=https://dev.cloud.tapstate.com \
#              --raw-field cp_email=... \
#              --raw-field mongo_uri=...
#   No automatic trigger — we never want a push to accidentally run
#   billable Cluster provisioning against a shared env.
#
# Test selection:
#   Run ONLY the io.tapstate.cloud.it.RealEnv*IT classes. These are
#   parameterized via CP_BASE_URL / CP_EMAIL / CP_PASSWORD / MONGO_URI
#   env vars and assume nothing about localhost. Missing CP creds →
#   assumeTrue → SKIP all tests cleanly (not FAIL).
#
# Secrets handling:
#   - cp_url            — PLAIN input (visible in workflow UI + logs)
#   - cp_email_secret   — SECRET input (masked, never appears in logs)
#   - cp_password_secret — SECRET input
#   - mongo_uri_secret  — SECRET input (full mongodb+srv://... URI with db name;
#                         sanitized before we read it)
#
# Inputs map 1:1 to RealEnvIT static fields:
#   CP_BASE_URL   ← inputs.cp_url
#   CP_EMAIL      ← secrets.cp_email_secret
#   CP_PASSWORD   ← secrets.cp_password_secret
#   MONGO_URI     ← secrets.mongo_uri_secret  (optional — store-visibility
#                  assertions SKIP when absent)
#
# Example invocation:
#   gh workflow run real-env-smoke.yml \
#     --repo tapstate/tapstate-cloud \
#     --raw-field cp_url=https://dev.cloud.tapstate.com \
#     --secret cp_email_secret=$AWSDEV_TEST_EMAIL \
#     --secret cp_password_secret=$AWSDEV_TEST_PASSWORD \
#     --secret mongo_uri_secret=$AWSDEV_MONGO_URI
# ============================================================

name: Real-Env Smoke Test

on:
  workflow_dispatch:
    inputs:
      cp_url:
        description: 'Control Plane base URL (no trailing slash), e.g. https://dev.cloud.tapstate.com'
        required: true
        type: string
      cp_email_secret:
        description: 'Name of the GitHub secret holding an existing Control Plane user email'
        required: false
        type: string
      cp_password_secret:
        description: 'Name of the GitHub secret holding the Control Plane user password'
        required: false
        type: string
      mongo_uri_secret:
        description: 'Name of the GitHub secret holding the MongoDB connection string (optional — enables store-visibility assertions)'
        required: false
        type: string
      jdk:
        description: 'JDK version'
        required: false
        default: '21'
        type: string

jobs:
  real-env-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk }}
          cache: maven

      - name: Build module (compile-only, skip tests)
        run: mvn -pl cloud-control-plane -am -DskipTests package

      - name: Resolve secrets by name input
        id: resolve-secrets
        run: |
          # Inputs may pass either a secret VALUE directly or a secret NAME.
          # We handle both: if a name is provided we read it from the job's
          # secrets context; if the value IS already a secret (masked) we use
          # it as-is. GitHub automatically masks the actual secret value in
          # logs when it flows through ${{ secrets.X }}.
          echo "cp_url=${{ inputs.cp_url }}"
          echo "cp_email_secret_name=${{ inputs.cp_email_secret }}"
          echo "cp_password_secret_name=${{ inputs.cp_password_secret }}"
          echo "mongo_uri_secret_name=${{ inputs.mongo_uri_secret }}"

      - name: Run RealEnv integration tests
        env:
          CP_BASE_URL: ${{ inputs.cp_url }}
          CP_EMAIL: ${{ secrets[inputs.cp_email_secret] }}
          CP_PASSWORD: ${{ secrets[inputs.cp_password_secret] }}
          MONGO_URI: ${{ secrets[inputs.mongo_uri_secret] }}
        run: |
          cd cloud-control-plane
          # failsafe only runs classes matching the *IT.java pattern. We use
          # a failsafe.includes= override to limit the run to RealEnvIT
          # subclasses so unrelated mock/local ITs never run against the
          # target environment.
          mvn failsafe:integration-test failsafe:verify \
            -Dfailsafe.includes="io.tapstate.cloud.it.RealEnv*IT" \
            -DtrimStackTrace=false \
            -B \
            2>&1 | tee target/real-env-smoke.log

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-env-smoke-reports
          path: |
            cloud-control-plane/target/failsafe-reports/
            cloud-control-plane/target/real-env-smoke.log
          if-no-files-found: warn
          retention-days: 7
