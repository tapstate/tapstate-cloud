name: Publish Cloud Control image for awsdev

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish this commit to the awsdev ECR repository.
        type: boolean
        required: true
        default: false
  push:
    branches:
      - ws/cloud-week4-cluster-address-visibility
    paths:
      - .github/workflows/publish-awsdev-image.yml

permissions:
  contents: read

concurrency:
  group: awsdev-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || inputs.confirm_publish
    runs-on: ubuntu-latest
    environment:
      name: awsdev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push this Cloud Control commit
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.ECR_REPO_URI }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.4

      - name: Refresh the awsdev ECR pull secret
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPO_URI: ${{ secrets.ECR_REPO_URI }}
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KUBECONFIG_BASE64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl -n tapstate get secret tapstate-ecr-pull >/dev/null
          token="$(aws ecr get-login-password --region "$AWS_REGION")"
          registry="${ECR_REPO_URI%%/*}"
          kubectl create secret docker-registry tapstate-ecr-pull \
            --namespace tapstate \
            --docker-server="$registry" \
            --docker-username=AWS \
            --docker-password="$token" \
            --dry-run=client -o yaml | kubectl apply -f -
          unset token

      - name: Report the image tag and digest
        env:
          ECR_REPO_URI: ${{ secrets.ECR_REPO_URI }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          repository="${ECR_REPO_URI#*/}"
          digest="$(aws ecr describe-images \
            --repository-name "$repository" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --region "$AWS_REGION" \
            --query "imageDetails[0].imageDigest" --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            printf "Cloud Control image: \`%s:%s\`\n\n" "$ECR_REPO_URI" "$GITHUB_SHA"
            printf "Digest: \`%s\`\n\n" "$digest"
          } >> "$GITHUB_STEP_SUMMARY"
