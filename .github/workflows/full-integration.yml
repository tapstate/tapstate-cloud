# ============================================================
# Full integration suite (maven-failsafe *IT.java)
#
# Triggered only by changes that can affect integration behavior
# — product sources, integration-test sources, or key build/runtime
# configuration (see the `paths` filters below) — on pushes and
# pull requests targeting main or develop, plus manual dispatch.
#
# Enablement switch (GitHub Actions repository VARIABLE, not secret):
#   FULL_INTEGRATION_ENABLED — every job in this workflow runs only while
#   this variable is the exact string "true". Unset, empty, or any other
#   value skips the whole suite for every trigger (push, pull_request,
#   workflow_dispatch). Configure it under:
#   Settings -> Secrets and variables -> Actions -> Variables.
#   The main-branch CD gate honors the same variable and only waits for
#   this workflow while the switch is on (see deploy.yaml and
#   await-green.sh), so switching it off never blocks an awsdev deploy.
#
# The target ref selects the lane:
#
#   main (full)
#     integration-mock — every cloud-free IT (IaC + Atlas in mock
#                        mode), locally backed by the mongo service.
#     integration-real — ONLY the cloud-touching classes:
#                        AwsClusterDeployIT / AwsAtlasFullLifecycleIT
#                        against real AWS + real Atlas and
#                        atlas/AtlasAllocationIT against the real
#                        Atlas Admin API. The cloud-free classes are
#                        not re-run here: the mock job already runs
#                        them on the same commit (historically that
#                        duplication added ~8 minutes of billable-job
#                        time). Creates billable resources, therefore
#                        runs globally serialized (queued, never
#                        cancelled) and self-skips when any cloud
#                        secret is missing.
#
#   develop (full-flow)
#     integration-mock — only the end-to-end pipeline cases:
#                        SubscriptionFlowIT,
#                        SubscriptionClusterLifecycleIT,
#                        CancelCascadeIT. Fast and free of cloud
#                        costs; point-wise ITs (auth/JWKS/OAuth/...)
#                        run on main.
#     integration-real — skipped.
#
#   workflow_dispatch — lane follows the selected ref by default;
#                        the `suite` input can force `full` or
#                        `full-flow` on any branch.
#
# Secrets (repository or environment):
#   TAPSTATE_CLOUD_MONGO_URI      full mongodb+srv URI incl. db name
#   AWS_ACCESS_KEY_ID             CloudFormation/EC2 permissions
#   AWS_SECRET_ACCESS_KEY
#   GODADDY_API_KEY               gd_pat_ PAT (Bearer) or classic key
#   GODADDY_API_SECRET            only needed for classic sso-key
#   TAPSTATE_ATLAS_PUBLIC_KEY     Atlas Admin API key
#   TAPSTATE_ATLAS_PRIVATE_KEY
#   TAPSTATE_ATLAS_PROJECT_ID
#   TAPSTATE_ATLAS_CLUSTER_NAME
#   TAPSTATE_ATLAS_CONNECTION_STRING  Atlas mongodb+srv URI; a full URI
#                                     embedding admin credentials is accepted
#                                     and sanitized to host-only by the IT
#   TAPSTATE_CLOUD_SSH_KEY        private key authorized as ubuntu on
#                                 the fixed-IP allowlist bastion
#
# GitHub runners use ephemeral egress IPs. Atlas gates both the
# mongodb+srv driver plane (project network access list) and, in
# this organization, the Admin REST API (per-key API access list),
# and the registering call is itself gated. Both jobs therefore
# SSH to a fixed-IP bastion, whose own address is permanently
# allowlisted, and run curl there to register the runner IP
# automatically. Project entries carry a deleteAfterDate safety net; the
# per-key list does not accept it, so key entries are removed explicitly in
# cleanup. All removals go through the same bastion.
# ============================================================

name: Full Integration

on:
  pull_request:
    branches: [main, develop]
    # "edited" re-evaluates the lane when a PR is retargeted between
    # main and develop after opening.
    types: [opened, synchronize, reopened, edited]
    paths: &it_paths
      # Product sources (also covers application*.yml and the
      # CloudFormation node template under src/main/resources).
      - "**/src/main/**"
      # Integration-test cases and their shared harness.
      - "**/src/it/**"
      # Build / runtime configuration that changes how ITs run.
      - "**/pom.xml"
      - "client/api/openapi.yaml"
      - "client/java/src/**"
      # Any workflow change can move this lane or the gates around it.
      - ".github/workflows/**"
  push:
    branches: [main, develop]
    paths: *it_paths
  workflow_dispatch:
    inputs:
      suite:
        description: "Force a suite regardless of the target ref"
        type: choice
        options: [auto, full, full-flow]
        default: auto

permissions:
  contents: read

jobs:
  # ---------- Lane resolution: full (main) vs full-flow (develop) ----------
  lane:
    name: Resolve integration lane
    runs-on: ubuntu-latest
    # Repository kill switch: unless FULL_INTEGRATION_ENABLED is the exact
    # string "true", this job and every job needing it are skipped.
    if: vars.FULL_INTEGRATION_ENABLED == 'true'
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - id: resolve
        name: Resolve suite mode from target ref
        run: |
          set -euo pipefail
          forced="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.suite || 'auto' }}"
          if [ "$forced" != "auto" ]; then
            mode="$forced"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            case "${{ github.base_ref }}" in
              main) mode=full ;;
              develop) mode=full-flow ;;
              *) mode=full ;;
            esac
          else
            case "${{ github.ref_name }}" in
              main) mode=full ;;
              develop) mode=full-flow ;;
              *) mode=full ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Integration lane: $mode (event=${{ github.event_name }})"

  # ---------- Fast, cloud-free integration tests ----------
  integration-mock:
    name: Integration (mock)
    runs-on: ubuntu-latest
    needs: lane
    if: vars.FULL_INTEGRATION_ENABLED == 'true'
    timeout-minutes: 50
    concurrency:
      group: integration-mock-${{ github.ref }}
      cancel-in-progress: true

    env:
      ATLAS_BASTION_HOST: 18.166.228.163
      ATLAS_BASTION_USER: ubuntu

    services:
      # Local mongod backs both the surefire unit tests and the cloud-free
      # ITs (the mvn step gets no TAPSTATE_CLOUD_MONGO_URI, so the forked
      # application and BaseIT fall back to mongodb://localhost:27017).
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Verify required secrets
        env:
          TAPSTATE_CLOUD_MONGO_URI: ${{ secrets.TAPSTATE_CLOUD_MONGO_URI }}
          TAPSTATE_CLOUD_SSH_KEY: ${{ secrets.TAPSTATE_CLOUD_SSH_KEY }}
        run: |
          if [ -z "${TAPSTATE_CLOUD_MONGO_URI}" ]; then
            echo "::error::repository secret TAPSTATE_CLOUD_MONGO_URI is not configured (full Atlas URI incl. database name)"
            exit 1
          fi
          if [ -z "${TAPSTATE_CLOUD_SSH_KEY}" ]; then
            echo "::error::repository secret TAPSTATE_CLOUD_SSH_KEY is not configured (private key authorized on the Atlas allowlist bastion)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install mongosh
        run: |
          set -euo pipefail
          . /etc/os-release
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates curl
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | \
            sudo gpg -o /usr/share/keyrings/mongodb-server-8.0.gpg --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu ${VERSION_CODENAME}/mongodb-org/8.0 multiverse" | \
            sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh
          mongosh --version

      - name: Determine runner egress IP
        id: runner-ip
        run: |
          set -euo pipefail
          ip=""
          for svc in https://api.ipify.org https://checkip.amazonaws.com https://ifconfig.me/ip; do
            ip="$(curl -fsS --max-time 10 "$svc" 2>/dev/null | tr -d '[:space:]' || true)"
            if [ -n "$ip" ]; then break; fi
          done
          if [ -z "$ip" ]; then
            echo "::error::Could not determine runner egress IPv4"
            exit 1
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "Runner egress IP: $ip"

      # The Admin API call that registers the runner IP is itself gated
      # by the per-key API access list, so it cannot be made from the
      # ephemeral runner. SSH to the fixed-IP bastion instead; its own
      # address is permanently on the API key access list.
      - name: Set up SSH key for Atlas allowlist bastion
        env:
          TAPSTATE_CLOUD_SSH_KEY: ${{ secrets.TAPSTATE_CLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TAPSTATE_CLOUD_SSH_KEY" > ~/.ssh/atlas_bastion_key
          chmod 600 ~/.ssh/atlas_bastion_key
          touch ~/.ssh/known_hosts
          ssh-keyscan -H -T 10 "$ATLAS_BASTION_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Register runner IP in Atlas project access list via bastion
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.TAPSTATE_ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.TAPSTATE_ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.TAPSTATE_ATLAS_PROJECT_ID }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/atlas_bastion_key -o BatchMode=yes -o ConnectTimeout=10 \
            "$ATLAS_BASTION_USER@$ATLAS_BASTION_HOST" \
            bash -s -- "$RUNNER_IP" "$ATLAS_PUBLIC_KEY" "$ATLAS_PRIVATE_KEY" "$ATLAS_PROJECT_ID" "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          ip="$1"; pub="$2"; priv="$3"; proj="$4"; runid="$5"
          comment="github-actions mock runner ${runid}"
          expiry="$(date -u -d '+120 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          body="$(printf '[{"ipAddress":"%s","comment":"%s","deleteAfterDate":"%s"}]' "$ip" "$comment" "$expiry")"
          code="$(curl -sS --max-time 30 --digest -u "$pub:$priv" \
            -H 'Accept: application/vnd.atlas.2025-03-12+json' \
            -H 'Content-Type: application/json' \
            -X POST "https://cloud.mongodb.com/api/atlas/v2/groups/${proj}/accessList" \
            --data "$body" -o /tmp/atlas-mock-add.json -w '%{http_code}')"
          echo "POST project accessList ${ip} -> HTTP ${code} (auto-expire ${expiry})"
          case "$code" in
            2??) echo "Registered; Atlas propagation takes a few seconds" ;;
            *)
              cat /tmp/atlas-mock-add.json || true
              echo "::error::Failed to register ${ip} in project access list via bastion"
              exit 1
              ;;
          esac
          REMOTE
          {
            echo "### Runner IP registered in Atlas project access list"
            echo
            echo "- IP: \`${RUNNER_IP}/32\` (via bastion ${ATLAS_BASTION_HOST})"
            echo "- Auto-expires within 2 hours; removed explicitly in cleanup"
          } >> "$GITHUB_STEP_SUMMARY"

      # Verify from the RUNNER, not the bastion: the ITs open driver
      # connections from here. No human is involved anymore, so the
      # wait is short.
      - name: Wait for Atlas driver connectivity
        timeout-minutes: 5
        env:
          TAPSTATE_CLOUD_MONGO_URI: ${{ secrets.TAPSTATE_CLOUD_MONGO_URI }}
        run: |
          set -euo pipefail
          ip="${{ steps.runner-ip.outputs.ip }}"
          deadline=$((SECONDS + 240))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if mongosh "$TAPSTATE_CLOUD_MONGO_URI" --quiet --norc \
                --eval 'assert(db.adminCommand({ping:1}).ok === 1)' >/dev/null 2>&1; then
              echo "Atlas driver connectivity OK for $ip - continuing"
              exit 0
            fi
            echo "[$(date -u +%H:%M:%S)] Atlas project entry for $ip not active yet - retrying"
            sleep 10
          done
          echo "::error::Timed out waiting for Atlas driver connectivity for $ip"
          exit 1

      - name: Run cloud-free ITs
        env:
          SUITE_MODE: ${{ needs.lane.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$SUITE_MODE" = full ]; then
            # main: every cloud-free IT; real-cloud classes belong to
            # integration-real and the atlas package needs real credentials.
            it_pattern='!AwsAtlasFullLifecycleIT,!AwsClusterDeployIT,!**/atlas/*IT.java'
          else
            # develop: end-to-end pipeline cases only
            # (subscribe -> provision -> cancel -> reclaim).
            it_pattern='SubscriptionFlowIT,SubscriptionClusterLifecycleIT,CancelCascadeIT'
          fi
          echo "Running failsafe pattern: $it_pattern"
          mvn -B -ntp -DskipSdkGeneration=true \
            -pl cloud-control-plane -am verify \
            "-Dit.test=$it_pattern" \
            -DfailIfNoSpecifiedTests=false

      - name: Remove runner IP from Atlas project access list
        if: always()
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.TAPSTATE_ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.TAPSTATE_ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.TAPSTATE_ATLAS_PROJECT_ID }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          set -u
          if [ -z "${RUNNER_IP:-}" ]; then
            echo "No runner IP was registered; nothing to clean"
            exit 0
          fi
          if [ ! -f ~/.ssh/atlas_bastion_key ]; then
            echo "SSH bastion was never configured; skip (entries auto-expire within 2 hours)"
            exit 0
          fi
          ssh -i ~/.ssh/atlas_bastion_key -o BatchMode=yes -o ConnectTimeout=10 \
            "$ATLAS_BASTION_USER@$ATLAS_BASTION_HOST" \
            bash -s -- "$RUNNER_IP" "$ATLAS_PUBLIC_KEY" "$ATLAS_PRIVATE_KEY" "$ATLAS_PROJECT_ID" <<'REMOTE'
          set -u
          ip="$1"; pub="$2"; priv="$3"; proj="$4"
          if [ -z "${pub:-}" ]; then
            echo "No Atlas Admin credentials; skip access-list cleanup (entries auto-expire within 2 hours)"
            exit 0
          fi
          api="https://cloud.mongodb.com/api/atlas/v2/groups/${proj}/accessList/${ip}"
          code="$(curl -sS --max-time 30 --digest -u "$pub:$priv" \
            -H 'Accept: application/vnd.atlas.2025-03-12+json' \
            -X DELETE "$api" -o /tmp/atlas-mock-del.json -w '%{http_code}')"
          echo "DELETE project accessList ${ip} -> HTTP $code"
          case "$code" in
            2??|404) echo "Cleanup done" ;;
            *)
              echo "::warning::Project list cleanup returned $code (entry auto-expires within 2 hours)"
              cat /tmp/atlas-mock-del.json || true
              ;;
          esac
          REMOTE

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-mock
          path: cloud-control-plane/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ---------- Real-cloud classes against real AWS + real Atlas ----------
  integration-real:
    name: Integration (real AWS + Atlas)
    runs-on: ubuntu-latest
    timeout-minutes: 85
    # Full lane (main) only; on develop this job stays skipped. Requires the
    # cloud-free job green on the same commit, and the same repository
    # enablement switch as the upstream jobs.
    needs: [lane, integration-mock]
    if: ${{ vars.FULL_INTEGRATION_ENABLED == 'true' && needs.lane.outputs.mode == 'full' && needs.integration-mock.result == 'success' }}
    # Global group without the ref: cloud runs are mutually exclusive
    # across refs because they share the Atlas seed documents and create
    # billable resources. Never cancel a run mid-flight.
    concurrency:
      group: integration-real-aws-atlas
      cancel-in-progress: false

    env:
      ATLAS_BASTION_HOST: 18.166.228.163
      ATLAS_BASTION_USER: ubuntu

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check cloud credentials
        id: creds
        env:
          MONGO_URI: ${{ secrets.TAPSTATE_CLOUD_MONGO_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
          ATLAS_PUBLIC_KEY: ${{ secrets.TAPSTATE_ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.TAPSTATE_ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.TAPSTATE_ATLAS_PROJECT_ID }}
          ATLAS_CLUSTER_NAME: ${{ secrets.TAPSTATE_ATLAS_CLUSTER_NAME }}
          ATLAS_CONNECTION_STRING: ${{ secrets.TAPSTATE_ATLAS_CONNECTION_STRING }}
          SSH_BASTION_KEY: ${{ secrets.TAPSTATE_CLOUD_SSH_KEY }}
        run: |
          missing=()
          for name in MONGO_URI AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY GODADDY_API_KEY \
                      ATLAS_PUBLIC_KEY ATLAS_PRIVATE_KEY ATLAS_PROJECT_ID \
                      ATLAS_CLUSTER_NAME ATLAS_CONNECTION_STRING SSH_BASTION_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Real cloud ITs skipped"
              echo
              echo "Missing secrets: ${missing[*]}"
              echo
              echo "The real AWS + Atlas lifecycle ITs need every secret listed"
              echo "in .github/workflows/full-integration.yml."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: steps.creds.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install mongosh and DNS tooling
        if: steps.creds.outputs.present == 'true'
        run: |
          set -euo pipefail
          . /etc/os-release
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates curl dnsutils
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | \
            sudo gpg -o /usr/share/keyrings/mongodb-server-8.0.gpg --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu ${VERSION_CODENAME}/mongodb-org/8.0 multiverse" | \
            sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh
          mongosh --version
          dig -v

      - name: Configure AWS credentials
        if: steps.creds.outputs.present == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Determine runner egress IP
        id: runner-ip
        if: steps.creds.outputs.present == 'true'
        run: |
          set -euo pipefail
          ip=""
          for svc in https://api.ipify.org https://checkip.amazonaws.com https://ifconfig.me/ip; do
            ip="$(curl -fsS --max-time 10 "$svc" 2>/dev/null | tr -d '[:space:]' || true)"
            if [ -n "$ip" ]; then break; fi
          done
          if [ -z "$ip" ]; then
            echo "::error::Could not determine runner egress IPv4"
            exit 1
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "Runner egress IP: $ip"

      # Atlas has TWO independent allowlists and the registering calls
      # are themselves gated:
      #   1. Project network list -> mongodb+srv driver connections
      #   2. Per-key API access list -> gates the Admin REST API
      # The fixed-IP bastion is permanently allowed on the API key and
      # registers the ephemeral runner IP on both lists with curl.
      - name: Set up SSH key for Atlas allowlist bastion
        if: steps.creds.outputs.present == 'true'
        env:
          TAPSTATE_CLOUD_SSH_KEY: ${{ secrets.TAPSTATE_CLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TAPSTATE_CLOUD_SSH_KEY" > ~/.ssh/atlas_bastion_key
          chmod 600 ~/.ssh/atlas_bastion_key
          touch ~/.ssh/known_hosts
          ssh-keyscan -H -T 10 "$ATLAS_BASTION_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Register runner IP in Atlas access lists via bastion
        if: steps.creds.outputs.present == 'true'
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.TAPSTATE_ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.TAPSTATE_ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.TAPSTATE_ATLAS_PROJECT_ID }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/atlas_bastion_key -o BatchMode=yes -o ConnectTimeout=10 \
            "$ATLAS_BASTION_USER@$ATLAS_BASTION_HOST" \
            bash -s -- "$RUNNER_IP" "$ATLAS_PUBLIC_KEY" "$ATLAS_PRIVATE_KEY" "$ATLAS_PROJECT_ID" "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          ip="$1"; pub="$2"; priv="$3"; proj="$4"; runid="$5"
          comment="github-actions real runner ${runid}"
          expiry="$(date -u -d '+120 minutes' +%Y-%m-%dT%H:%M:%SZ)"

          # 1) Project network access list (driver plane)
          pbody="$(printf '[{"ipAddress":"%s","comment":"%s","deleteAfterDate":"%s"}]' "$ip" "$comment" "$expiry")"
          pcode="$(curl -sS --max-time 30 --digest -u "$pub:$priv" \
            -H 'Accept: application/vnd.atlas.2025-03-12+json' \
            -H 'Content-Type: application/json' \
            -X POST "https://cloud.mongodb.com/api/atlas/v2/groups/${proj}/accessList" \
            --data "$pbody" -o /tmp/atlas-al-padd.json -w '%{http_code}')"
          echo "POST project accessList ${ip} -> HTTP ${pcode} (auto-expire ${expiry})"
          case "$pcode" in
            2??) ;;
            *)
              cat /tmp/atlas-al-padd.json || true
              echo "::error::Failed to register ${ip} in project access list via bastion"
              exit 1
              ;;
          esac

          # 2) Per-key API access list (Admin REST API edge plane), so
          # the runner's own IT code can call the Admin API during tests.
          # It is an ORG-level resource keyed by the key's 24-hex id, so
          # read orgId from the project and the key id from the org.
          # Best effort: a project-scoped key cannot self-register; the
          # runner-side verification below is the authoritative gate
          # (403 there means the edge is enforced but still closed).
          edge="skipped"
          if command -v python3 >/dev/null 2>&1; then
            base="https://cloud.mongodb.com/api/atlas/v2"
            orgid="$(curl -sS --max-time 30 --digest -u "$pub:$priv" \
              -H 'Accept: application/vnd.atlas.2025-03-12+json' \
              "$base/groups/${proj}" | \
              python3 -c 'import json,sys; print(json.load(sys.stdin).get("orgId", ""))' 2>/dev/null || true)"
            keyid=""
            if [ -n "$orgid" ]; then
              keyid="$(curl -sS --max-time 30 --digest -u "$pub:$priv" \
                -H 'Accept: application/vnd.atlas.2025-03-12+json' \
                "$base/orgs/${orgid}/apiKeys?itemsPerPage=500" | \
                python3 -c 'import json,sys; pub=sys.argv[1]; d=json.load(sys.stdin); print(next((k.get("id","") for k in d.get("results",[]) if k.get("publicKey")==pub), ""))' "$pub" 2>/dev/null || true)"
            fi
            if [ -n "$keyid" ]; then
              # This endpoint accepts ONLY ipAddress/cidrBlock per the API
              # schema: it rejects 'comment' and 'deleteAfterDate'. Removed
              # explicitly in cleanup - the runner IP is ephemeral, so a
              # leftover entry is harmless.
              kbody="$(printf '[{"ipAddress":"%s"}]' "$ip")"
              kcode="$(curl -sS --max-time 30 --digest -u "$pub:$priv" \
                -H 'Accept: application/vnd.atlas.2025-03-12+json' \
                -H 'Content-Type: application/json' \
                -X POST "$base/orgs/${orgid}/apiKeys/${keyid}/accessList" \
                --data "$kbody" -o /tmp/atlas-al-kadd.json -w '%{http_code}' || true)"
              echo "POST API-key accessList ${ip} -> HTTP ${kcode}"
              case "$kcode" in
                2??) edge="registered" ;;
                *)
                  cat /tmp/atlas-al-kadd.json || true
                  edge="failed"
                  ;;
              esac
            else
              echo "Could not resolve this key's org id (key may be project-scoped); edge self-registration skipped"
            fi
          else
            echo "python3 unavailable on bastion; edge self-registration skipped"
          fi
          echo "Edge plane: ${edge}"
          REMOTE
          {
            echo "### Runner IP registered in Atlas (via bastion)"
            echo
            echo "- IP: \`${RUNNER_IP}/32\` (via bastion ${ATLAS_BASTION_HOST})"
            echo "- Project network list: required and added (auto-expires within 2 hours)"
            echo "- Per-key API list: added when the key has org rights; removed explicitly in cleanup"
          } >> "$GITHUB_STEP_SUMMARY"

      # Verify from the RUNNER: Admin API GET must return 200 (edge
      # gate open) AND list the runner IP (project entry active).
      - name: Wait for Atlas access list entries to become active
        if: steps.creds.outputs.present == 'true'
        timeout-minutes: 5
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.TAPSTATE_ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.TAPSTATE_ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.TAPSTATE_ATLAS_PROJECT_ID }}
        run: |
          set -euo pipefail
          ip="${{ steps.runner-ip.outputs.ip }}"
          api="https://cloud.mongodb.com/api/atlas/v2/groups/${ATLAS_PROJECT_ID}/accessList"
          accept="Accept: application/vnd.atlas.2025-03-12+json"

          deadline=$((SECONDS + 240))
          edge_seen=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            body="$(mktemp)"
            code="$(curl -sS --max-time 30 --digest -u "$ATLAS_PUBLIC_KEY:$ATLAS_PRIVATE_KEY" \
              -H "$accept" "$api?itemsPerPage=500" -o "$body" -w '%{http_code}' || true)"
            if [ "$code" = "403" ]; then
              echo "[$(date -u +%H:%M:%S)] Admin API edge entry for $ip not active yet"
            elif [ "$code" = "200" ]; then
              edge_seen=1
              if grep -q "\"ipAddress\":\"$ip\"" "$body"; then
                echo "Both Atlas gates open for $ip - continuing"
                rm -f "$body"
                exit 0
              fi
              echo "[$(date -u +%H:%M:%S)] Edge open; project entry for $ip not active yet"
            else
              echo "[$(date -u +%H:%M:%S)] Unexpected GET accessList HTTP $code (ignoring, retrying)"
            fi
            rm -f "$body"
            sleep 10
          done
          if [ "$edge_seen" = "0" ]; then
            echo "::error::Timed out: the org enforces the per-key Admin API access list and this key cannot self-register ${ip}. Turn off 'Require IP Access List for the Atlas Administration API' for the org, add ${ip} to the key, or use an Organization Owner key."
          else
            echo "::error::Timed out: edge is open but the project network entry for ${ip} never became active"
          fi
          exit 1

      - name: Run real-cloud ITs (real AWS + real Atlas)
        if: steps.creds.outputs.present == 'true'
        env:
          TAPSTATE_CLOUD_MONGO_URI: ${{ secrets.TAPSTATE_CLOUD_MONGO_URI }}
          GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
          GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}
          TAPSTATE_ATLAS_PUBLIC_KEY: ${{ secrets.TAPSTATE_ATLAS_PUBLIC_KEY }}
          TAPSTATE_ATLAS_PRIVATE_KEY: ${{ secrets.TAPSTATE_ATLAS_PRIVATE_KEY }}
          TAPSTATE_ATLAS_PROJECT_ID: ${{ secrets.TAPSTATE_ATLAS_PROJECT_ID }}
          TAPSTATE_ATLAS_CLUSTER_NAME: ${{ secrets.TAPSTATE_ATLAS_CLUSTER_NAME }}
          TAPSTATE_ATLAS_CONNECTION_STRING: ${{ secrets.TAPSTATE_ATLAS_CONNECTION_STRING }}
        # Only the cloud-touching classes run here; the cloud-free suite is
        # integration-mock's job on the same commit. Both AWS classes launch
        # their own forked real-mode application and only BaseIT's mongosh
        # wipe uses TAPSTATE_CLOUD_MONGO_URI. GitHub runners have direct
        # egress — disable the local-forwarder proxy defaults the real ITs
        # ship with for dev machines.
        run: >
          mvn -B -ntp -DskipSdkGeneration=true
          -pl cloud-control-plane -am verify
          -Diac.proxyHost=none -Diac.proxyPort=0
          -Dit.test=AwsAtlasFullLifecycleIT,AwsClusterDeployIT,AtlasAllocationIT
          -DfailIfNoSpecifiedTests=false

      - name: Remove runner IP from Atlas access lists
        if: always() && steps.creds.outputs.present == 'true'
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.TAPSTATE_ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.TAPSTATE_ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.TAPSTATE_ATLAS_PROJECT_ID }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          set -u
          if [ -z "${RUNNER_IP:-}" ]; then
            echo "No access-list entry was registered; nothing to clean up"
            exit 0
          fi
          if [ ! -f ~/.ssh/atlas_bastion_key ]; then
            echo "SSH bastion was never configured; skip (entries auto-expire within 2 hours)"
            exit 0
          fi
          ssh -i ~/.ssh/atlas_bastion_key -o BatchMode=yes -o ConnectTimeout=10 \
            "$ATLAS_BASTION_USER@$ATLAS_BASTION_HOST" \
            bash -s -- "$RUNNER_IP" "$ATLAS_PUBLIC_KEY" "$ATLAS_PRIVATE_KEY" "$ATLAS_PROJECT_ID" <<'REMOTE'
          set -u
          ip="$1"; pub="$2"; priv="$3"; proj="$4"
          accept='Accept: application/vnd.atlas.2025-03-12+json'

          # 1) Project network access list (driver plane)
          papi="https://cloud.mongodb.com/api/atlas/v2/groups/${proj}/accessList/${ip}"
          pcode="$(curl -sS --max-time 30 --digest -u "$pub:$priv" \
            -H "$accept" -X DELETE "$papi" -o /tmp/atlas-al-pdel.json -w '%{http_code}')"
          echo "DELETE project accessList ${ip} -> HTTP $pcode"
          case "$pcode" in
            2??|404) echo "Project list cleanup done" ;;
            *)
              echo "::warning::Project list cleanup returned $pcode (entry auto-expires within 2 hours)"
              cat /tmp/atlas-al-pdel.json || true
              ;;
          esac

          # 2) Per-key API access list (edge plane), removed last. It is
          # an org-level resource keyed by the key's 24-hex id, so read
          # orgId from the project and the key id from the org. Best
          # effort - entries auto-expire within 2 hours regardless.
          base="https://cloud.mongodb.com/api/atlas/v2"
          orgid=""
          keyid=""
          if command -v python3 >/dev/null 2>&1; then
            orgid="$(curl -sS --max-time 30 --digest -u "$pub:$priv" -H "$accept" \
              "$base/groups/${proj}" | \
              python3 -c 'import json,sys; print(json.load(sys.stdin).get("orgId", ""))' 2>/dev/null || true)"
            if [ -n "$orgid" ]; then
              keyid="$(curl -sS --max-time 30 --digest -u "$pub:$priv" -H "$accept" \
                "$base/orgs/${orgid}/apiKeys?itemsPerPage=500" | \
                python3 -c 'import json,sys; pub=sys.argv[1]; d=json.load(sys.stdin); print(next((k.get("id","") for k in d.get("results",[]) if k.get("publicKey")==pub), ""))' "$pub" 2>/dev/null || true)"
            fi
          fi
          if [ -n "$orgid" ] && [ -n "$keyid" ]; then
            kapi="$base/orgs/${orgid}/apiKeys/${keyid}/accessList/${ip}"
            kcode="$(curl -sS --max-time 30 --digest -u "$pub:$priv" \
              -H "$accept" -X DELETE "$kapi" -o /tmp/atlas-al-kdel.json -w '%{http_code}' || true)"
            echo "DELETE API-key accessList ${ip} -> HTTP $kcode"
            case "$kcode" in
              2??|404) echo "Key list cleanup done" ;;
              *)
                echo "::warning::API-key list cleanup returned $kcode (entry auto-expires within 2 hours)"
                cat /tmp/atlas-al-kdel.json || true
                ;;
            esac
          else
            echo "Edge ids not resolvable; skip key-list cleanup (entries auto-expire within 2 hours)"
          fi
          REMOTE

      - name: Upload failsafe reports and app logs
        if: always() && steps.creds.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-real
          path: |
            cloud-control-plane/target/failsafe-reports/
            cloud-control-plane/target/real-app-atlas.log
            cloud-control-plane/target/real-app.log
          if-no-files-found: ignore
          retention-days: 14
