# ============================================================
# Full integration suite (maven-failsafe *IT.java)
#
# Triggered by pull requests against main/develop and by pushes
# to develop. Two jobs:
#
#   integration-mock  — fast, cloud-free ITs. The control-plane
#                       store is an Atlas cluster supplied through
#                       the TAPSTATE_CLOUD_MONGO_URI secret; IaC and
#                       Atlas run in mock mode.
#   integration-real  — the FULL suite, including AwsClusterDeployIT
#                       and AwsAtlasFullLifecycleIT against real AWS
#                       and real Atlas. Creates billable resources
#                       for 15-30 minutes, therefore runs globally
#                       serialized (queued, never cancelled) and
#                       self-skips when any cloud secret is missing.
#
# Secrets (repository or environment):
#   TAPSTATE_CLOUD_MONGO_URI      full mongodb+srv URI incl. db name
#   AWS_ACCESS_KEY_ID             CloudFormation/EC2 permissions
#   AWS_SECRET_ACCESS_KEY
#   GODADDY_API_KEY               gd_pat_ PAT (Bearer) or classic key
#   GODADDY_API_SECRET            only needed for classic sso-key
#   TAPSTATE_ATLAS_PUBLIC_KEY     Atlas Admin API key
#   TAPSTATE_ATLAS_PRIVATE_KEY
#   TAPSTATE_ATLAS_PROJECT_ID
#   TAPSTATE_ATLAS_CLUSTER_NAME
#   TAPSTATE_ATLAS_CONNECTION_STRING  clean mongodb+srv seed URI
#   TAPSTATE_CLOUD_SSH_KEY        private key authorized as ubuntu on
#                                 the fixed-IP allowlist bastion
#
# GitHub runners use ephemeral egress IPs. Atlas gates both the
# mongodb+srv driver plane (project network access list) and, in
# this organization, the Admin REST API (per-key API access list),
# and the registering call is itself gated. Both jobs therefore
# SSH to a fixed-IP bastion, whose own address is permanently
# allowlisted, and run curl there to register the runner IP
# automatically. Every temporary entry carries a deleteAfterDate
# safety net and is removed through the same bastion in cleanup.
# ============================================================

name: Full Integration

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ---------- Fast, cloud-free integration tests ----------
  integration-mock:
    name: Integration (mock)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: integration-mock-${{ github.ref }}
      cancel-in-progress: true

    env:
      ATLAS_BASTION_HOST: 18.166.228.163
      ATLAS_BASTION_USER: ubuntu

    services:
      # Local mongod backs the surefire unit tests (same as ci.yaml);
      # the ITs themselves use TAPSTATE_CLOUD_MONGO_URI.
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Verify required secrets
        env:
          TAPSTATE_CLOUD_MONGO_URI: ${{ secrets.TAPSTATE_CLOUD_MONGO_URI }}
          TAPSTATE_CLOUD_SSH_KEY: ${{ secrets.TAPSTATE_CLOUD_SSH_KEY }}
        run: |
          if [ -z "${TAPSTATE_CLOUD_MONGO_URI}" ]; then
            echo "::error::repository secret TAPSTATE_CLOUD_MONGO_URI is not configured (full Atlas URI incl. database name)"
            exit 1
          fi
          if [ -z "${TAPSTATE_CLOUD_SSH_KEY}" ]; then
            echo "::error::repository secret TAPSTATE_CLOUD_SSH_KEY is not configured (private key authorized on the Atlas allowlist bastion)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install mongosh
        run: |
          set -euo pipefail
          . /etc/os-release
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates curl
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | \
            sudo gpg -o /usr/share/keyrings/mongodb-server-8.0.gpg --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu ${VERSION_CODENAME}/mongodb-org/8.0 multiverse" | \
            sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh
          mongosh --version

      - name: Determine runner egress IP
        id: runner-ip
        run: |
          set -euo pipefail
          ip=""
          for svc in https://api.ipify.org https://checkip.amazonaws.com https://ifconfig.me/ip; do
            ip="$(curl -fsS --max-time 10 "$svc" 2>/dev/null | tr -d '[:space:]' || true)"
            if [ -n "$ip" ]; then break; fi
          done
          if [ -z "$ip" ]; then
            echo "::error::Could not determine runner egress IPv4"
            exit 1
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "Runner egress IP: $ip"

      # The Admin API call that registers the runner IP is itself gated
      # by the per-key API access list, so it cannot be made from the
      # ephemeral runner. SSH to the fixed-IP bastion instead; its own
      # address is permanently on the API key access list.
      - name: Set up SSH key for Atlas allowlist bastion
        env:
          TAPSTATE_CLOUD_SSH_KEY: ${{ secrets.TAPSTATE_CLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TAPSTATE_CLOUD_SSH_KEY" > ~/.ssh/atlas_bastion_key
          chmod 600 ~/.ssh/atlas_bastion_key
          touch ~/.ssh/known_hosts
          ssh-keyscan -H -T 10 "$ATLAS_BASTION_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Register runner IP in Atlas project access list via bastion
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.TAPSTATE_ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.TAPSTATE_ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.TAPSTATE_ATLAS_PROJECT_ID }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/atlas_bastion_key -o BatchMode=yes -o ConnectTimeout=10 \
            "$ATLAS_BASTION_USER@$ATLAS_BASTION_HOST" \
            bash -s -- "$RUNNER_IP" "$ATLAS_PUBLIC_KEY" "$ATLAS_PRIVATE_KEY" "$ATLAS_PROJECT_ID" "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          ip="$1"; pub="$2"; priv="$3"; proj="$4"; runid="$5"
          comment="github-actions mock runner ${runid}"
          expiry="$(date -u -d '+120 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          body="$(printf '[{"ipAddress":"%s","comment":"%s","deleteAfterDate":"%s"}]' "$ip" "$comment" "$expiry")"
          code="$(curl -sS --max-time 30 --digest -u "$pub:$priv" \
            -H 'Accept: application/vnd.atlas.2025-03-12+json' \
            -H 'Content-Type: application/json' \
            -X POST "https://cloud.mongodb.com/api/atlas/v2/groups/${proj}/accessList" \
            --data "$body" -o /tmp/atlas-mock-add.json -w '%{http_code}')"
          echo "POST project accessList ${ip} -> HTTP ${code} (auto-expire ${expiry})"
          case "$code" in
            2??) echo "Registered; Atlas propagation takes a few seconds" ;;
            *)
              cat /tmp/atlas-mock-add.json || true
              echo "::error::Failed to register ${ip} in project access list via bastion"
              exit 1
              ;;
          esac
          REMOTE
          {
            echo "### Runner IP registered in Atlas project access list"
            echo
            echo "- IP: \`${RUNNER_IP}/32\` (via bastion ${ATLAS_BASTION_HOST})"
            echo "- Auto-expires within 2 hours; removed explicitly in cleanup"
          } >> "$GITHUB_STEP_SUMMARY"

      # Verify from the RUNNER, not the bastion: the ITs open driver
      # connections from here. No human is involved anymore, so the
      # wait is short.
      - name: Wait for Atlas driver connectivity
        timeout-minutes: 5
        env:
          TAPSTATE_CLOUD_MONGO_URI: ${{ secrets.TAPSTATE_CLOUD_MONGO_URI }}
        run: |
          set -euo pipefail
          ip="${{ steps.runner-ip.outputs.ip }}"
          deadline=$((SECONDS + 240))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if mongosh "$TAPSTATE_CLOUD_MONGO_URI" --quiet --norc \
                --eval 'assert(db.adminCommand({ping:1}).ok === 1)' >/dev/null 2>&1; then
              echo "Atlas driver connectivity OK for $ip - continuing"
              exit 0
            fi
            echo "[$(date -u +%H:%M:%S)] Atlas project entry for $ip not active yet - retrying"
            sleep 10
          done
          echo "::error::Timed out waiting for Atlas driver connectivity for $ip"
          exit 1

      - name: Run cloud-free ITs
        run: >
          mvn -B -ntp -DskipSdkGeneration=true
          -pl cloud-control-plane -am verify
          -Dit.test=!AwsAtlasFullLifecycleIT,!AwsClusterDeployIT,!**/atlas/*IT.java
          -DfailIfNoSpecifiedTests=false

      - name: Remove runner IP from Atlas project access list
        if: always()
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.TAPSTATE_ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.TAPSTATE_ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.TAPSTATE_ATLAS_PROJECT_ID }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          set -u
          if [ -z "${RUNNER_IP:-}" ]; then
            echo "No runner IP was registered; nothing to clean"
            exit 0
          fi
          if [ ! -f ~/.ssh/atlas_bastion_key ]; then
            echo "SSH bastion was never configured; skip (entries auto-expire within 2 hours)"
            exit 0
          fi
          ssh -i ~/.ssh/atlas_bastion_key -o BatchMode=yes -o ConnectTimeout=10 \
            "$ATLAS_BASTION_USER@$ATLAS_BASTION_HOST" \
            bash -s -- "$RUNNER_IP" "$ATLAS_PUBLIC_KEY" "$ATLAS_PRIVATE_KEY" "$ATLAS_PROJECT_ID" <<'REMOTE'
          set -u
          ip="$1"; pub="$2"; priv="$3"; proj="$4"
          if [ -z "${pub:-}" ]; then
            echo "No Atlas Admin credentials; skip access-list cleanup (entries auto-expire within 2 hours)"
            exit 0
          fi
          api="https://cloud.mongodb.com/api/atlas/v2/groups/${proj}/accessList/${ip}"
          code="$(curl -sS --max-time 30 --digest -u "$pub:$priv" \
            -H 'Accept: application/vnd.atlas.2025-03-12+json' \
            -X DELETE "$api" -o /tmp/atlas-mock-del.json -w '%{http_code}')"
          echo "DELETE project accessList ${ip} -> HTTP $code"
          case "$code" in
            2??|404) echo "Cleanup done" ;;
            *)
              echo "::warning::Project list cleanup returned $code (entry auto-expires within 2 hours)"
              cat /tmp/atlas-mock-del.json || true
              ;;
          esac
          REMOTE

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-mock
          path: cloud-control-plane/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ---------- Full suite against real AWS + real Atlas ----------
  integration-real:
    name: Integration (real AWS + Atlas)
    runs-on: ubuntu-latest
    timeout-minutes: 85
    needs: integration-mock
    # Global group without the ref: cloud runs are mutually exclusive
    # across refs because they share the Atlas seed documents and create
    # billable resources. Never cancel a run mid-flight.
    concurrency:
      group: integration-real-aws-atlas
      cancel-in-progress: false

    env:
      ATLAS_BASTION_HOST: 18.166.228.163
      ATLAS_BASTION_USER: ubuntu

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check cloud credentials
        id: creds
        env:
          MONGO_URI: ${{ secrets.TAPSTATE_CLOUD_MONGO_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
          ATLAS_PUBLIC_KEY: ${{ secrets.TAPSTATE_ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.TAPSTATE_ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.TAPSTATE_ATLAS_PROJECT_ID }}
          ATLAS_CLUSTER_NAME: ${{ secrets.TAPSTATE_ATLAS_CLUSTER_NAME }}
          ATLAS_CONNECTION_STRING: ${{ secrets.TAPSTATE_ATLAS_CONNECTION_STRING }}
          SSH_BASTION_KEY: ${{ secrets.TAPSTATE_CLOUD_SSH_KEY }}
        run: |
          missing=()
          for name in MONGO_URI AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY GODADDY_API_KEY \
                      ATLAS_PUBLIC_KEY ATLAS_PRIVATE_KEY ATLAS_PROJECT_ID \
                      ATLAS_CLUSTER_NAME ATLAS_CONNECTION_STRING SSH_BASTION_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Real cloud ITs skipped"
              echo
              echo "Missing secrets: ${missing[*]}"
              echo
              echo "The real AWS + Atlas lifecycle ITs need every secret listed"
              echo "in .github/workflows/full-integration.yml."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 21
        if: steps.creds.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install mongosh and DNS tooling
        if: steps.creds.outputs.present == 'true'
        run: |
          set -euo pipefail
          . /etc/os-release
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates curl dnsutils
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | \
            sudo gpg -o /usr/share/keyrings/mongodb-server-8.0.gpg --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu ${VERSION_CODENAME}/mongodb-org/8.0 multiverse" | \
            sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh
          mongosh --version
          dig -v

      - name: Configure AWS credentials
        if: steps.creds.outputs.present == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Determine runner egress IP
        id: runner-ip
        if: steps.creds.outputs.present == 'true'
        run: |
          set -euo pipefail
          ip=""
          for svc in https://api.ipify.org https://checkip.amazonaws.com https://ifconfig.me/ip; do
            ip="$(curl -fsS --max-time 10 "$svc" 2>/dev/null | tr -d '[:space:]' || true)"
            if [ -n "$ip" ]; then break; fi
          done
          if [ -z "$ip" ]; then
            echo "::error::Could not determine runner egress IPv4"
            exit 1
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "Runner egress IP: $ip"

      # Atlas has TWO independent allowlists and the registering calls
      # are themselves gated:
      #   1. Project network list -> mongodb+srv driver connections
      #   2. Per-key API access list -> gates the Admin REST API
      # The fixed-IP bastion is permanently allowed on the API key and
      # registers the ephemeral runner IP on both lists with curl.
      - name: Set up SSH key for Atlas allowlist bastion
        if: steps.creds.outputs.present == 'true'
        env:
          TAPSTATE_CLOUD_SSH_KEY: ${{ secrets.TAPSTATE_CLOUD_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TAPSTATE_CLOUD_SSH_KEY" > ~/.ssh/atlas_bastion_key
          chmod 600 ~/.ssh/atlas_bastion_key
          touch ~/.ssh/known_hosts
          ssh-keyscan -H -T 10 "$ATLAS_BASTION_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Register runner IP in Atlas access lists via bastion
        if: steps.creds.outputs.present == 'true'
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.TAPSTATE_ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.TAPSTATE_ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.TAPSTATE_ATLAS_PROJECT_ID }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/atlas_bastion_key -o BatchMode=yes -o ConnectTimeout=10 \
            "$ATLAS_BASTION_USER@$ATLAS_BASTION_HOST" \
            bash -s -- "$RUNNER_IP" "$ATLAS_PUBLIC_KEY" "$ATLAS_PRIVATE_KEY" "$ATLAS_PROJECT_ID" "$GITHUB_RUN_ID" <<'REMOTE'
          set -euo pipefail
          ip="$1"; pub="$2"; priv="$3"; proj="$4"; runid="$5"
          comment="github-actions real runner ${runid}"
          expiry="$(date -u -d '+120 minutes' +%Y-%m-%dT%H:%M:%SZ)"

          # 1) Project network access list (driver plane)
          pbody="$(printf '[{"ipAddress":"%s","comment":"%s","deleteAfterDate":"%s"}]' "$ip" "$comment" "$expiry")"
          pcode="$(curl -sS --max-time 30 --digest -u "$pub:$priv" \
            -H 'Accept: application/vnd.atlas.2025-03-12+json' \
            -H 'Content-Type: application/json' \
            -X POST "https://cloud.mongodb.com/api/atlas/v2/groups/${proj}/accessList" \
            --data "$pbody" -o /tmp/atlas-al-padd.json -w '%{http_code}')"
          echo "POST project accessList ${ip} -> HTTP ${pcode} (auto-expire ${expiry})"
          case "$pcode" in
            2??) ;;
            *)
              cat /tmp/atlas-al-padd.json || true
              echo "::error::Failed to register ${ip} in project access list via bastion"
              exit 1
              ;;
          esac

          # 2) Per-key API access list (Admin REST API edge plane), so
          # the runner's own IT code can call the Admin API during tests.
          kbody="$(printf '[{"ipAddress":"%s","comment":"%s","deleteAfterDate":"%s"}]' "$ip" "$comment" "$expiry")"
          kcode="$(curl -sS --max-time 30 --digest -u "$pub:$priv" \
            -H 'Accept: application/vnd.atlas.2025-03-12+json' \
            -H 'Content-Type: application/json' \
            -X POST "https://cloud.mongodb.com/api/atlas/v2/apiAccessList" \
            --data "$kbody" -o /tmp/atlas-al-kadd.json -w '%{http_code}')"
          echo "POST API-key accessList ${ip} -> HTTP ${kcode}"
          case "$kcode" in
            2??) echo "Registered on both Atlas access lists; propagation takes a few seconds" ;;
            *)
              cat /tmp/atlas-al-kadd.json || true
              echo "::error::Failed to register ${ip} in API key access list via bastion"
              exit 1
              ;;
          esac
          REMOTE
          {
            echo "### Runner IP registered on both Atlas access lists"
            echo
            echo "- IP: \`${RUNNER_IP}/32\` (via bastion ${ATLAS_BASTION_HOST})"
            echo "- Project network list and per-key API list"
            echo "- Auto-expires within 2 hours; removed explicitly in cleanup"
          } >> "$GITHUB_STEP_SUMMARY"

      # Verify from the RUNNER: Admin API GET must return 200 (edge
      # gate open) AND list the runner IP (project entry active).
      - name: Wait for Atlas access list entries to become active
        if: steps.creds.outputs.present == 'true'
        timeout-minutes: 5
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.TAPSTATE_ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.TAPSTATE_ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.TAPSTATE_ATLAS_PROJECT_ID }}
        run: |
          set -euo pipefail
          ip="${{ steps.runner-ip.outputs.ip }}"
          api="https://cloud.mongodb.com/api/atlas/v2/groups/${ATLAS_PROJECT_ID}/accessList"
          accept="Accept: application/vnd.atlas.2025-03-12+json"

          deadline=$((SECONDS + 240))
          edge_seen=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            body="$(mktemp)"
            code="$(curl -sS --max-time 30 --digest -u "$ATLAS_PUBLIC_KEY:$ATLAS_PRIVATE_KEY" \
              -H "$accept" "$api?itemsPerPage=500" -o "$body" -w '%{http_code}' || true)"
            if [ "$code" = "403" ]; then
              echo "[$(date -u +%H:%M:%S)] Admin API edge entry for $ip not active yet"
            elif [ "$code" = "200" ]; then
              edge_seen=1
              if grep -q "\"ipAddress\":\"$ip\"" "$body"; then
                echo "Both Atlas gates open for $ip - continuing"
                rm -f "$body"
                exit 0
              fi
              echo "[$(date -u +%H:%M:%S)] Edge open; project entry for $ip not active yet"
            else
              echo "[$(date -u +%H:%M:%S)] Unexpected GET accessList HTTP $code (ignoring, retrying)"
            fi
            rm -f "$body"
            sleep 10
          done
          echo "::error::Timed out waiting for Atlas access list entries for $ip (edge_seen=$edge_seen)"
          exit 1

      - name: Run full IT suite (real AWS + real Atlas)
        if: steps.creds.outputs.present == 'true'
        env:
          TAPSTATE_CLOUD_MONGO_URI: ${{ secrets.TAPSTATE_CLOUD_MONGO_URI }}
          GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
          GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}
          TAPSTATE_ATLAS_PUBLIC_KEY: ${{ secrets.TAPSTATE_ATLAS_PUBLIC_KEY }}
          TAPSTATE_ATLAS_PRIVATE_KEY: ${{ secrets.TAPSTATE_ATLAS_PRIVATE_KEY }}
          TAPSTATE_ATLAS_PROJECT_ID: ${{ secrets.TAPSTATE_ATLAS_PROJECT_ID }}
          TAPSTATE_ATLAS_CLUSTER_NAME: ${{ secrets.TAPSTATE_ATLAS_CLUSTER_NAME }}
          TAPSTATE_ATLAS_CONNECTION_STRING: ${{ secrets.TAPSTATE_ATLAS_CONNECTION_STRING }}
        # GitHub runners have direct egress — disable the local-forwarder
        # proxy defaults that the real ITs ship with for dev machines.
        run: >
          mvn -B -ntp -DskipSdkGeneration=true
          -pl cloud-control-plane -am verify
          -Diac.proxyHost=none -Diac.proxyPort=0

      - name: Remove runner IP from Atlas access lists
        if: always() && steps.creds.outputs.present == 'true'
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.TAPSTATE_ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.TAPSTATE_ATLAS_PRIVATE_KEY }}
          ATLAS_PROJECT_ID: ${{ secrets.TAPSTATE_ATLAS_PROJECT_ID }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          set -u
          if [ -z "${RUNNER_IP:-}" ]; then
            echo "No access-list entry was registered; nothing to clean up"
            exit 0
          fi
          if [ ! -f ~/.ssh/atlas_bastion_key ]; then
            echo "SSH bastion was never configured; skip (entries auto-expire within 2 hours)"
            exit 0
          fi
          ssh -i ~/.ssh/atlas_bastion_key -o BatchMode=yes -o ConnectTimeout=10 \
            "$ATLAS_BASTION_USER@$ATLAS_BASTION_HOST" \
            bash -s -- "$RUNNER_IP" "$ATLAS_PUBLIC_KEY" "$ATLAS_PRIVATE_KEY" "$ATLAS_PROJECT_ID" <<'REMOTE'
          set -u
          ip="$1"; pub="$2"; priv="$3"; proj="$4"
          accept='Accept: application/vnd.atlas.2025-03-12+json'

          # 1) Project network access list (driver plane)
          papi="https://cloud.mongodb.com/api/atlas/v2/groups/${proj}/accessList/${ip}"
          pcode="$(curl -sS --max-time 30 --digest -u "$pub:$priv" \
            -H "$accept" -X DELETE "$papi" -o /tmp/atlas-al-pdel.json -w '%{http_code}')"
          echo "DELETE project accessList ${ip} -> HTTP $pcode"
          case "$pcode" in
            2??|404) echo "Project list cleanup done" ;;
            *)
              echo "::warning::Project list cleanup returned $pcode (entry auto-expires within 2 hours)"
              cat /tmp/atlas-al-pdel.json || true
              ;;
          esac

          # 2) Per-key API access list (edge plane) - removed last. 404
          # means it was never added - not expected here, but harmless.
          kapi="https://cloud.mongodb.com/api/atlas/v2/apiAccessList/${ip}"
          kcode="$(curl -sS --max-time 30 --digest -u "$pub:$priv" \
            -H "$accept" -X DELETE "$kapi" -o /tmp/atlas-al-kdel.json -w '%{http_code}')"
          echo "DELETE API-key accessList ${ip} -> HTTP $kcode"
          case "$kcode" in
            2??|404) echo "Key list cleanup done" ;;
            *)
              echo "::warning::API-key list cleanup returned $kcode (entry auto-expires within 2 hours)"
              cat /tmp/atlas-al-kdel.json || true
              ;;
          esac
          REMOTE

      - name: Upload failsafe reports and app logs
        if: always() && steps.creds.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-real
          path: |
            cloud-control-plane/target/failsafe-reports/
            cloud-control-plane/target/real-app-atlas.log
            cloud-control-plane/target/real-app.log
          if-no-files-found: ignore
          retention-days: 14
