# ============================================================
# CD — Dual-Environment Deployment
# Per ADR-0124 D6: helm is the single deployment tool
#
#   main branch          → awsdev environment  (values-awsdev.yaml,  namespace: tapstate)
#   release-v*.x.x       → production environment (values-aws.yaml, namespace: tapstate-cloud-control)
# ============================================================
# Prerequisites (GitHub Repository Secrets):
#   AWS_ACCESS_KEY_ID       — AWS credentials for ECR push
#   AWS_SECRET_ACCESS_KEY   — AWS credentials for ECR push
#   AWS_REGION              — ap-east-1 (both envs)
#   ECR_REPO_URI            — e.g. 263186327888.dkr.ecr.ap-east-1.amazonaws.com/tapstate-cloud/tapstate-cloud-control
#   KUBECONFIG_BASE64       — k3s kubeconfig (same cluster for both namespaces)
# ============================================================

name: CD — Deploy to k3s

on:
  push:
    branches:
      - main
      - 'release-v*.x.x'

jobs:
  # ============================================================
  # SDK Publish — Nexus maven repository (common + sdk modules)
  # Runs on both main and release branches. Dynamic version is
  # computed per-deploy via git tag + commit SHA; pom.xml is
  # reverted after deploy so the checked-in baseline stays 0.1.0.
  # ============================================================
  deploy-sdk:
    name: Publish SDK to Nexus
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Configure Maven settings for Nexus
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>nexus-tapdata-net</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Compute dynamic version
        id: version
        run: |
          TAG=$(git describe --tags --always --abbrev=0 2>/dev/null || echo "0.1.0")
          COMMIT="${GITHUB_SHA::0:8}"
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            VERSION="${TAG}-${COMMIT}-SNAPSHOT"
          else
            VERSION="${TAG}-${COMMIT}"
          fi
          echo "Computed SDK version: ${VERSION}"
          echo "sdk_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set dynamic version and deploy to Nexus
        run: |
          mvn versions:set \
            -DnewVersion=${{ steps.version.outputs.sdk_version }} \
            -DgenerateBackupPoms=false \
            -q
          mvn deploy \
            -Dmaven.test.skip=true \
            -DskipSdkGeneration=true \
            -Dmaven.javadoc.skip=true \
            -B

      - name: Revert pom.xml version changes
        if: always()
        run: |
          git checkout -- $(git ls-files '**/pom.xml') pom.xml
          echo "pom.xml reverted to checked-in baseline 0.1.0"

  # ============================================================
  # Environment 1: awsdev (main branch)
  # ============================================================
  deploy-awsdev:
    name: Deploy to awsdev
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: awsdev

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build fat jar
        run: mvn clean package -B -DskipTests -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr-dev
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (awsdev)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.ECR_REPO_URI }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Decode kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info

      - name: Ensure namespace exists
        run: |
          kubectl create namespace tapstate --dry-run=client -o yaml | kubectl apply -f -

      - name: Refresh ECR imagePullSecret (awsdev)
        run: |
          TOKEN=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})
          kubectl create secret docker-registry tapstate-ecr-pull \
            --namespace tapstate \
            --docker-server=$(echo ${{ secrets.ECR_REPO_URI }} | sed 's|/.*||') \
            --docker-username=AWS \
            --docker-password="$TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: helm upgrade — awsdev
        run: |
          helm upgrade --install tapstate-cloud-control helm/tapstate-cloud-control \
            --namespace tapstate \
            --set image.repository=${{ secrets.ECR_REPO_URI }} \
            --set image.tag=${{ github.sha }} \
            --values helm/tapstate-cloud-control/values-awsdev.yaml \
            --timeout 5m \
            --wait

  # ============================================================
  # Environment 2: production (release-v* branch)
  # ============================================================
  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release-v')
    environment:
      name: production
      url: https://cloud.tapstate.io/health

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build fat jar
        run: mvn clean package -B -DskipTests -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr-prod
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.ECR_REPO_URI }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Decode kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info

      - name: Ensure namespace exists
        run: |
          kubectl create namespace tapstate-cloud-control --dry-run=client -o yaml | kubectl apply -f -

      - name: Refresh ECR imagePullSecret (production)
        run: |
          TOKEN=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})
          kubectl create secret docker-registry tapstate-ecr-pull \
            --namespace tapstate-cloud-control \
            --docker-server=$(echo ${{ secrets.ECR_REPO_URI }} | sed 's|/.*||') \
            --docker-username=AWS \
            --docker-password="$TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: helm upgrade — production
        run: |
          helm upgrade --install tapstate-cloud-control helm/tapstate-cloud-control \
            --namespace tapstate-cloud-control \
            --set image.repository=${{ secrets.ECR_REPO_URI }} \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Always \
            --values helm/tapstate-cloud-control/values-aws.yaml \
            --timeout 5m \
            --wait

      - name: Verify deployment health
        run: |
          kubectl --namespace tapstate-cloud-control get pods -l app.kubernetes.io/name=tapstate-cloud-control
          kubectl --namespace tapstate-cloud-control port-forward \
            deployment/tapstate-cloud-control 8080:8080 &
          sleep 5
          curl -f http://localhost:8080/health || {
            echo "Health check FAILED!"
            exit 1
          }
          kill %1
