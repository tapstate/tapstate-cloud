# ============================================================
# CD — Dual-Environment Deployment
# Per ADR-0124 D6: helm is the single deployment tool
#
#   main branch          → awsdev environment  (values-awsdev.yaml,  namespace: tapstate)
#                           gated: the deploy waits for the CI run of
#                           the same pushed SHA, and for the Full
#                           Integration run only while the repository
#                           variable FULL_INTEGRATION_ENABLED is "true"
#                           and the push touches Full Integration trigger
#                           paths (see the await-main-gate job below)
#   release-v<version>    → production environment (values-awsprod.yaml, namespace: tapstate-cloud-control)
#                           e.g. release-v0.2.0; '*' matches any version suffix
# ============================================================
# Prerequisites (GitHub Repository Secrets):
#   AWS_ACCESS_KEY_ID       — AWS credentials for ECR push
#   AWS_SECRET_ACCESS_KEY   — AWS credentials for ECR push
#   AWS_REGION              — ap-east-1 (both envs share one ECR)
#   ECR_REPO_URI            — e.g. 263186327888.dkr.ecr.ap-east-1.amazonaws.com/tapstate-cloud/tapstate-cloud-control
#   KUBECONFIG_BASE64       — awsdev k3s kubeconfig (repo level); the
#                             production environment overrides this name
#                             with the production k3s kubeconfig
# ============================================================

name: CD — Deploy to k3s

on:
  push:
    branches:
      - main
      # Matches release-v followed by any version suffix, e.g.
      # release-v0.2.0. The deploy-prod / deploy-sdk job conditions use
      # the same startsWith('refs/heads/release-v') prefix.
      - 'release-v*'

permissions:
  contents: read
  # The gate job reads workflow-run state for the pushed SHA.
  actions: read

# One deploy per ref at a time: a push while another deploy is running
# queues behind it instead of two helm upgrades racing on the cluster.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # main gate — nothing deploys until the CI workflow has passed on
  # THIS commit; the Full Integration workflow is additionally
  # required only while the repository variable
  # FULL_INTEGRATION_ENABLED is "true" AND this push touches its
  # trigger paths — the same two conditions under which that
  # workflow actually runs. GitHub Actions has no cross-workflow
  # needs, so the script polls the runs for the pushed SHA.
  # release-v* pushes skip this job and deploy directly, exactly
  # as before.
  # ============================================================
  await-main-gate:
    name: Gate — CI and Full Integration green
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Merge commits need their first parent for the gate's
          # path-filter check.
          fetch-depth: 2
      - name: Wait for CI and Full Integration on this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same repository variable that gates full-integration.yml;
          # anything but the exact string "true" waives the Full IT wait.
          FULL_INTEGRATION_ENABLED: ${{ vars.FULL_INTEGRATION_ENABLED }}
        run: bash .github/workflows/scripts/await-green.sh

  # ============================================================
  # SDK Publish — Nexus maven repository (client/java only)
  # Runs on both main and release branches. Dynamic version is
  # computed per-deploy via git tag + commit SHA; pom.xml is
  # reverted after deploy so the checked-in baseline stays 0.1.0.
  # ============================================================
  deploy-sdk:
    name: Publish SDK to Nexus
    runs-on: ubuntu-latest
    needs: [await-main-gate]
    # release-v* never runs the gate (it is skipped there); on main the
    # SDK publish is allowed only when the gate succeeded.
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/heads/release-v') ||
       (github.ref == 'refs/heads/main' &&
        needs.await-main-gate.result == 'success'))

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Configure Maven settings for Nexus
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>nexus-tapdata-net</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Compute dynamic version
        id: version
        run: |
          # Base version from the nearest version tag (v0.1.0, 0.1.0, 0.1.x — flexible).
          # --tags matches lightweight + annotated, --match restricts to version-shaped tags,
          # --abbrev=0 returns tag name only (no dirty/commit suffix). If no matching tag
          # exists yet, fall back to 0.1.1 — first release version.
          TAG=$(git describe --tags --abbrev=0 --match "v*" --match "[0-9]*" 2>/dev/null \
            || git describe --tags --abbrev=0 --match "[0-9]*" 2>/dev/null \
            || echo "0.1.1")
          # Strip optional "v" prefix
          TAG="${TAG#v}"
          # Strip -SNAPSHOT / -rc / -alpha etc. pre-release suffix — baseline is always .N
          TAG=$(echo "${TAG}" | sed -E 's/[-_.](SNAPSHOT|rc|alpha|beta)[-_.0-9]*$//i')
          COMMIT="${GITHUB_SHA:0:8}"
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            VERSION="${TAG}-${COMMIT}-SNAPSHOT"
          else
            VERSION="${TAG}-${COMMIT}"
          fi
          echo "Baseline tag: ${TAG}"
          echo "Commit short:  ${COMMIT}"
          echo "Computed ver:  ${VERSION}"
          echo "sdk_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Deploy parent POM + SDK to Nexus
        run: |
          # 1. Bump version on ALL pom.xml at once (parent + children).
          #    Parent pom must ship to Nexus too — SDK declares <parent>tapstate-cloud-parent</parent>,
          #    consumers resolving io.tapstate:cloud-control-plane-sdk would fail without it.
          mvn versions:set \
            -DnewVersion=${{ steps.version.outputs.sdk_version }} \
            -DgenerateBackupPoms=false \
            -q
          # 2. Parent POM only (-N = non-recursive, skips children).
          #    Parent is pom packaging with dependencyManagement + pluginManagement only —
          #    NO <dependencies> — so it adds zero runtime transitive deps for SDK consumers.
          mvn -N deploy \
            -Dmaven.test.skip=true \
            -Dmaven.javadoc.skip=true \
            -DskipSdkGeneration=true \
            -B
          # 3. SDK jar
          mvn -pl client/java deploy \
            -Dmaven.test.skip=true \
            -DskipSdkGeneration=true \
            -Dmaven.javadoc.skip=true \
            -B

      - name: Revert pom.xml version changes
        if: always()
        run: |
          git checkout -- $(git ls-files '**/pom.xml') pom.xml
          echo "pom.xml reverted to checked-in baseline 0.1.0"

  # ============================================================
  # Environment 1: awsdev (main branch)
  # ============================================================
  deploy-awsdev:
    name: Deploy to awsdev
    runs-on: ubuntu-latest
    needs: [await-main-gate]
    if: ${{ github.ref == 'refs/heads/main' && needs.await-main-gate.result == 'success' }}
    environment:
      name: awsdev

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build fat jar
        run: mvn clean package -B -DskipTests -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr-dev
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (awsdev)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.ECR_REPO_URI }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Decode kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info

      - name: Ensure namespace exists
        run: |
          kubectl create namespace tapstate --dry-run=client -o yaml | kubectl apply -f -

      - name: Refresh ECR imagePullSecret (awsdev)
        run: |
          TOKEN=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})
          kubectl create secret docker-registry tapstate-ecr-pull \
            --namespace tapstate \
            --docker-server=$(echo ${{ secrets.ECR_REPO_URI }} | sed 's|/.*||') \
            --docker-username=AWS \
            --docker-password="$TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: helm upgrade — awsdev
        run: |
          helm upgrade --install tapstate-cloud-control helm/tapstate-cloud-control \
            --namespace tapstate \
            --set image.repository=${{ secrets.ECR_REPO_URI }} \
            --set image.tag=${{ github.sha }} \
            --values helm/tapstate-cloud-control/values-awsdev.yaml \
            --timeout 5m \
            --wait

  # ============================================================
  # Environment 2: production (release-v* branch)
  # ============================================================
  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release-v')
    environment:
      name: production
      url: https://cloud.tapstate.com/health

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build fat jar
        run: mvn clean package -B -DskipTests -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr-prod
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.ECR_REPO_URI }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Decode kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info

      - name: Ensure namespace exists
        run: |
          kubectl create namespace tapstate-cloud-control --dry-run=client -o yaml | kubectl apply -f -

      - name: Refresh ECR imagePullSecret (production)
        run: |
          TOKEN=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})
          kubectl create secret docker-registry tapstate-ecr-pull \
            --namespace tapstate-cloud-control \
            --docker-server=$(echo ${{ secrets.ECR_REPO_URI }} | sed 's|/.*||') \
            --docker-username=AWS \
            --docker-password="$TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: helm upgrade — production
        run: |
          helm upgrade --install tapstate-cloud-control helm/tapstate-cloud-control \
            --namespace tapstate-cloud-control \
            --set image.repository=${{ secrets.ECR_REPO_URI }} \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Always \
            --values helm/tapstate-cloud-control/values-awsprod.yaml \
            --timeout 5m \
            --wait

      - name: Verify deployment health
        run: |
          kubectl --namespace tapstate-cloud-control get pods -l app.kubernetes.io/name=tapstate-cloud-control
          kubectl --namespace tapstate-cloud-control port-forward \
            deployment/tapstate-cloud-control 8080:8080 &
          sleep 5
          curl -f http://localhost:8080/health || {
            echo "Health check FAILED!"
            exit 1
          }
          kill %1
