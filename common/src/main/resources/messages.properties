# Tapstate Cloud — English error messages
#
# Default ResourceBundle (Locale.ENGLISH). Keys match AppErrorCode.getCode().
# Format: key=MessageFormat with {0}, {1}... placeholders for positional params.

# ---------- Auth ----------
auth.email-already-registered=Email {0} is already registered
auth.invalid-credentials=Invalid email or password
auth.session-not-found=Session not found or expired
auth.unauthorized=Authentication required to access this resource
auth.user-not-found=User {0} not found
auth.nonce-replay=Duplicate C2 nonce — request rejected

# ---------- Org ----------
org.not-found=Organization {0} not found
org.not-member=User is not a member of organization {0}
org.already-exists=Organization with slug {0} already exists

# ---------- Cluster ----------
cluster.not-found=Cluster {0} not found
cluster.already-exists=Cluster ''{0}'' already exists in org {1}, region {2}
cluster.name-dns-invalid=Cluster name ''{0}'' yields invalid DNS label ''{1}'': use letters or digits (at most {2} characters after normalization)
cluster.dns-label-conflict=DNS name ''{0}'' derived from the cluster name is already used by another active cluster
cluster.invalid-state=Operation not allowed in cluster state {0}
cluster.org-mismatch=Cluster {0} does not belong to organization {1}
cluster.cancel-not-allowed=Cluster cannot be cancelled while in state {0}

# ---------- Infrastructure as Code ----------
iac.compute-provision-failed=Compute provisioning failed: {0}
iac.compute-terminate-failed=Compute termination failed: {0}
iac.dns-provider-failed=DNS operation failed: {0}
iac.dns-provider-unauthorized=DNS provider credentials missing or rejected: {0}
iac.ssh-command-failed=SSH operation failed: {0}
iac.health-check-failed=Cluster endpoint health check failed: {0}
iac.crypto-key-missing=SSH private-key master key is missing or invalid: {0}
iac.mdb-not-ready=Allocated MongoDB database is not ready: {0}
iac.tls-certificate-unavailable=No usable TLS certificate covering the Cluster domain: {0}
iac.tls-certificate-install-failed=TLS certificate installation on the Cluster node failed: {0}

# ---------- Region ----------
region.not-found=Region {0} is not available

# ---------- Exchange (ADR-0125) ----------
exchange.code-consumed=Exchange code already consumed
exchange.code-expired=Exchange code has expired
exchange.code-cluster-mismatch=Exchange code does not belong to this cluster
exchange.cluster-identity-mismatch=Cluster service identity secret is invalid

# ---------- Subscription ----------
subscription.not-found=Subscription {0} not found
subscription.cancelled=Subscription is cancelled — provisioning is blocked
subscription.past-due=Subscription is past due — provisioning is blocked until payment is made

