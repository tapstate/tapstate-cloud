# ============================================================
# Integration test profile — src/it/java failsafe tests
# Dedicated IT configuration. The control-plane store is a MongoDB that
# defaults to a local instance; CI injects an Atlas connection string via
# TAPSTATE_CLOUD_MONGO_URI (full URI, database name included).
# Use: mvn verify -Dit.server.port=8081
# ============================================================

spring:
  application:
    name: tapstate-cloud-control-it
  data:
    mongodb:
      uri: ${TAPSTATE_CLOUD_MONGO_URI:mongodb://localhost:27017/tapstate_cloud_it}
      # Empty by default so the database embedded in the URI path is used —
      # an explicit TAPSTATE_CLOUD_MONGO_DB must never silently redirect the
      # application to a different store than the one the URI (and the IT
      # mongosh helpers) connect to.
      database: ${TAPSTATE_CLOUD_MONGO_DB:}
  security:
    user:
      name: it-dev
      password: it-dev

server:
  port: ${it.server.port:8081}
  servlet:
    session:
      timeout: 7d
      cookie:
        name: TAPSTATE_CLOUD_SESSION
        http-only: true
        secure: false
        same-site: lax

tapstate:
  cloud:
    issuer: https://cloud.tapstate.io
    resolve-jwt-expiry-minutes: 15
    session-expiry-days: 7
    default-region: ap-southeast-1
    mdb:
      atlas:
        # Mock by default keeps the fast IT suite cloud-free; the real
        # AWS+Atlas lifecycle IT launches its own application process with
        # this switched off.
        mock: ${TAPSTATE_CLOUD_MDB_ATLAS_MOCK:true}
    cluster:
      provision:
        # Mock provisioning must always succeed in the fast IT suite.
        success-rate: 100
    iac:
      provider: aws
      # Mock by default keeps the existing fast IT suite cloud-free; the real
      # deployment IT launches its own application process with mode=real.
      mode: ${IAC_MODE:mock}
      environment: dev
      aws:
        instance-type: t3.medium
        disk-size-gb: 40
      godaddy:
        # api-key accepts a Personal Access Token (gd_pat_…) sent as Bearer, or
        # a classic key paired with api-secret. The deploy IT fails the DNS step
        # when credentials are missing.
        api-key: ${GODADDY_API_KEY:}
        api-secret: ${GODADDY_API_SECRET:}
        ttl: 600
      crypto:
        # Fixed DEVELOPMENT key for the it profile: base64 of bytes 0x00..0x1f.
        # Never use in production; production injects TAPSTATE_IAC_CRYPTO_KEY.
        master-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=

# Faster IT startup — less logging noise
logging:
  level:
    io.tapstate.cloud: INFO
    org.springframework.security: WARN
