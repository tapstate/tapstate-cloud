# ============================================================
# Tapstate Cloud Cluster node — single EC2 instance + security group.
# One stack is created per Cluster; deleting the stack reclaims every
# resource (instance, firewall rules, root disk) together.
# ============================================================
AWSTemplateFormatVersion: '2010-09-09'
Description: Tapstate Cloud Cluster node with Nginx and Docker

Parameters:
  ClusterId:
    Type: String
    Description: Cluster id hex — identifies and tags every resource
    AllowedPattern: '[0-9a-f]{24}'
    MinLength: 24
    MaxLength: 24
  InstanceType:
    Type: String
    Default: t3.medium
    Description: EC2 instance type
  DiskSize:
    Type: Number
    Default: 40
    Description: Root disk size in GB
  SshPublicKey:
    Type: String
    Description: OpenSSH public key injected into the ubuntu user authorized_keys
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Ubuntu 24.04 LTS amd64 EBS-gp3 AMI, resolved per region
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC containing the node; security groups cannot declare egress without it
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet to launch the node in (a public subnet with an internet route)

Resources:

  ClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Tapstate Cluster node firewall
      VpcId: !Ref VpcId
      # Port-22 ingress rules are attached after stack creation through the EC2
      # API, since their count and values vary with the control-plane egress.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub tapstate-cluster-${ClusterId}
        - Key: io.tapstate/cluster-id
          Value: !Ref ClusterId

  ClusterInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref ClusterSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref DiskSize
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -ex
          # Machine-level bootstrap only: package installation and the SSH key.
          # Service configuration and TLS certificate installation run over the
          # SSH session opened by the control plane, never from this script.
          #
          # Design rule: SSH key injection MUST run before any network-dependent step.
          # Cloud-init scripts run with `set -e`; a transient mirror failure on
          # apt-get must not leave the control plane locked out of the node.
          export DEBIAN_FRONTEND=noninteractive

          # --- SSH key injection (local filesystem, no network) ---
          mkdir -p /home/ubuntu/.ssh
          install -m 0600 -o ubuntu -g ubuntu /dev/null /home/ubuntu/.ssh/authorized_keys
          echo '${SshPublicKey}' >> /home/ubuntu/.ssh/authorized_keys
          chown -R ubuntu:ubuntu /home/ubuntu/.ssh
          chmod 700 /home/ubuntu/.ssh
          chmod 600 /home/ubuntu/.ssh/authorized_keys

          # --- retry helper for apt-get install ---
          pkg_retry() {
            local max=3 attempt=1
            while [ $attempt -le $max ]; do
              if apt-get install -y "$@"; then return 0; fi
              echo "apt-get install failed (attempt $attempt/$max): $*" >&2
              apt-get update || true
              sleep 15
              attempt=$((attempt + 1))
            done
            return 1
          }

          # --- phase 1: base packages ---
          apt-get update
          pkg_retry ca-certificates curl gnupg lsb-release

          # --- Docker GPG key + repo ---
          install -m 0755 -d /etc/apt/keyrings
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --max-time 30 https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc; then
              break
            fi
            echo "docker gpg fetch failed (attempt $attempt/5)" >&2
            sleep 10
          done
          # verify key was actually downloaded; if not, fail loud
          test -s /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc

          . /etc/os-release
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list

          # --- phase 2: docker + nginx ---
          apt-get update
          pkg_retry docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin nginx

          systemctl enable docker nginx
          systemctl start docker nginx
      Tags:
        - Key: Name
          Value: !Sub tapstate-cluster-${ClusterId}
        - Key: io.tapstate/cluster-id
          Value: !Ref ClusterId

Outputs:
  InstanceId:
    Description: EC2 instance identifier
    Value: !Ref ClusterInstance
  PublicIp:
    Description: Instance public IPv4 address
    Value: !GetAtt ClusterInstance.PublicIp
  PrivateIp:
    Description: Instance private IPv4 address
    Value: !GetAtt ClusterInstance.PrivateIp
  SecurityGroupId:
    Description: Security group identifier
    Value: !Ref ClusterSecurityGroup
