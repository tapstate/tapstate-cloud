# ============================================================
# Dev profile — local development overrides
# ============================================================
# NOTE: JWKS signing key uses in-memory RSA keypair for dev
# (auto-generated by ResolveController static initializer).
# In production, set CLOUD_JWKS_SIGNING_KEY from k3s Secret.

spring:
  data:
    mongodb:
      # Local dev: Docker Compose MongoDB if available; otherwise testcontainers
      # In k3s deployments, MONGODB_URI env var from Helm Secret overrides this
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DATABASE:tapstate_cloud}

tapstate:
  cloud:
    # Dev: issuer points to the dev control plane
    issuer: https://dev.cloud.tapstate.com
    # Dev Clusters are provisioned under the dev subdomain.
    resolve-jwt-audience-suffix: .dev.cloud.tapstate.com
    # JWKS signing key — leave empty for dev (auto-generated in-memory)
    jwks-signing-key: ""
    # Local dev defaults to mock; deployed environments override via the
    # full-path env vars (a short IAC_MODE does NOT bind to this prefix).
    mdb:
      atlas:
        mock: ${TAPSTATE_CLOUD_MDB_ATLAS_MOCK:true}
    iac:
      # Local dev simulates Cluster provisioning — no AWS / GoDaddy calls.
      # Deployed environments override via TAPSTATE_CLOUD_IAC_MODE=real.
      mode: ${TAPSTATE_CLOUD_IAC_MODE:mock}
      environment: ${TAPSTATE_CLOUD_IAC_ENVIRONMENT:dev}
      public-base-url: ${TAPSTATE_CLOUD_IAC_PUBLIC_BASE_URL:https://dev.cloud.tapstate.com}

logging:
  level:
    io.tapstate.cloud: DEBUG
    org.springframework.security: DEBUG
