# ============================================================
# Dev profile — local development overrides
# ============================================================
# NOTE: JWKS signing key uses in-memory RSA keypair for dev
# (auto-generated by ResolveController static initializer).
# In production, set CLOUD_JWKS_SIGNING_KEY from k3s Secret.

spring:
  data:
    mongodb:
      # Local dev: Docker Compose MongoDB if available; otherwise testcontainers
      # In k3s deployments, MONGODB_URI env var from Helm Secret overrides this
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DATABASE:tapstate_cloud}

tapstate:
  cloud:
    # Dev: issuer points to localhost
    issuer: https://dev.cloud.tapstate.com
    # JWKS signing key — leave empty for dev (auto-generated in-memory)
    jwks-signing-key: ""

logging:
  level:
    io.tapstate.cloud: DEBUG
    org.springframework.security: DEBUG
