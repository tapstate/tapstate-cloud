# ============================================================
# Tapstate Cloud — Global Control Plane application config
# ============================================================
# Credentials and sensitive values MUST come from environment variables
# (k3s Secret envFrom.secretRef). This file contains only defaults and
# non-sensitive configuration per ADR-0121 D4 (3-tier priority:
# env vars > external application.yml > classpath application.yml).
# ============================================================

spring:
  application:
    name: tapstate-cloud-control
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ========== MongoDB Atlas — Control Plane metadata (ADR-0121 D2) ==========
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DATABASE:tapstate_cloud}
      # Control Plane metadata DB (User/Org/Cluster/CloudFormation templates)
      # Separate Atlas project from per-Cluster runtime DBs (ADR-0123 D2)

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          ssl:
            enable: ${SMTP_SSL_ENABLE:false}

  # ========== Session ==========
  # HTTP sessions are backed by the control-plane MongoDB (collection
  # "sessions") via Spring Session MongoDB, so all replicas share sessions.
  # The cookie contract below (server.servlet.session.cookie.*) is applied by
  # SessionConfig; idle expiry is tapstate.cloud.session-expiry-days.
  # server.servlet.session.timeout does NOT apply under Spring Session.

  # ========== Spring Security ==========
  security:
    user:
      name: ${CLOUD_DEV_USERNAME:admin}
      password: ${CLOUD_DEV_PASSWORD:admin}

  # ========== Jackson (Spring Boot 4.x uses Jackson 3.x) ==========
  jackson:
    deserialization:
      fail-on-unknown-properties: false

# ========== Server ==========
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}
    session:
      # Cookie contract consumed by SessionConfig's CookieSerializer.
      cookie:
        name: TAPSTATE_CLOUD_SESSION
        http-only: true
        secure: false    # dev; production may override via env
        same-site: lax

# ========== Actuator — health endpoints (ADR-0120 acceptance) ==========
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,openapi
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# ========== OpenAPI / SpringDoc ==========
springdoc:
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_1
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_UI_ENABLED:true}
  packages-to-scan: io.tapstate.cloud
  default-flat-param-object: true

# ========== Knife4j — enhanced Swagger UI ==========
knife4j:
  enable: ${KNIFE4J_ENABLED:true}
  setting:
    language: en
    swagger-model-name: Model Examples

# ========== Tapstate Cloud custom config ==========
tapstate:
  cloud:
    auth:
      trial-code-required: ${CLOUD_AUTH_TRIAL_CODE_REQUIRED:true}
      trial-issuer-email: ${CLOUD_AUTH_TRIAL_ISSUER_EMAIL:}
      otp-hmac-key: ${CLOUD_AUTH_OTP_HMAC_KEY:}
      otp:
        max-attempts: ${CLOUD_AUTH_OTP_MAX_ATTEMPTS:5}
        sends-per-hour: ${CLOUD_AUTH_OTP_SENDS_PER_HOUR:5}
        cooldown-seconds: ${CLOUD_AUTH_OTP_COOLDOWN_SECONDS:60}
        lifetime-minutes: ${CLOUD_AUTH_OTP_LIFETIME_MINUTES:10}
      mail-from: ${CLOUD_AUTH_MAIL_FROM:no-reply@tapstate.io}
      google-client-id: ${GOOGLE_CLIENT_ID:}
      google-client-secret: ${GOOGLE_CLIENT_SECRET:}
      github-client-id: ${GITHUB_CLIENT_ID:}
      github-client-secret: ${GITHUB_CLIENT_SECRET:}
      oauth-callback-base-url: ${CLOUD_AUTH_OAUTH_CALLBACK_BASE_URL:http://localhost:8080}
      console-url: ${CLOUD_CONSOLE_URL:http://localhost:5173}
    # Global Control Plane issuer for resolve JWT (ADR-0122 D4)
    issuer: ${CLOUD_JWT_ISSUER:http://localhost:8080}
    # Resolve JWT expiry in minutes
    resolve-jwt-expiry-minutes: ${CLOUD_RESOLVE_JWT_EXPIRY_MINUTES:15}
    # JWKS signing key — MUST come from k3s Secret (ADR-0121 D4)
    jwks-signing-key: ${CLOUD_JWKS_SIGNING_KEY:}
    # JWKS key rotation configuration
    jwks:
      # Enable automatic key rotation (default: true)
      rotation-enabled: ${CLOUD_JWKS_ROTATION_ENABLED:true}
      # Enable private key encryption at rest (default: false)
      encryption-enabled: ${CLOUD_JWKS_ENCRYPTION_ENABLED:false}
      # Encryption key for AES-256 (required if encryption-enabled=true)
      encryption-key: ${CLOUD_JWKS_ENCRYPTION_KEY:}
    # Session expiry — 7 days idle (ADR-0122 D1)
    session-expiry-days: ${CLOUD_SESSION_EXPIRY_DAYS:7}
    # Credentialed browser requests are limited to Cloud Console and Cluster origins.
    cors:
      allowed-origin-patterns: "${CORS_ALLOWED_ORIGINS:https://cloud.tapstate.io,https://*.cloud.tapstate.io}"
    # Default region for Week 2 (ADR-0124 D1)
    default-region: ${CLOUD_DEFAULT_REGION:ap-southeast-1}
    # AWS credentials from k3s Secret (ADR-0121 D4)
    aws:
      access-key-id: ${AWS_ACCESS_KEY_ID:}
      secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
      region: ${AWS_REGION:ap-southeast-1}
    # Atlas Admin API key from k3s Secret (ADR-0121 D2)
    atlas:
      admin-api-key: ${ATLAS_ADMIN_API_KEY:}
      admin-api-key-secret: ${ATLAS_ADMIN_API_KEY_SECRET:}
    sample-sources:
      host: ${TAPSTATE_SAMPLE_SOURCES_HOST:47.238.126.103}
      password: ${TAPSTATE_SAMPLE_SOURCES_PASSWORD:}
    # Cluster version management. The static release token protects the operator
    # publish/delist endpoints; a blank value disables those endpoints (fail closed).
    cluster-version:
      release-token: ${CLOUD_CLUSTER_VERSION_RELEASE_TOKEN:}
    # Jira Service Management integration. OAuth service-account credentials are
    # secrets; an unset value leaves support ticket endpoints fail-closed.
    jira:
      cloud-id: ${TAPSTATE_CLOUD_JIRA_CLOUD_ID:}
      service-desk-id: ${TAPSTATE_CLOUD_JIRA_SERVICE_DESK_ID:}
      request-type-id: ${TAPSTATE_CLOUD_JIRA_REQUEST_TYPE_ID:}
      oauth:
        client-id: ${TAPSTATE_CLOUD_JIRA_OAUTH_CLIENT_ID:}
        client-secret: ${TAPSTATE_CLOUD_JIRA_OAUTH_CLIENT_SECRET:}
      customer-provisioning:
        # Requires explicit acknowledgement of Jira site-wide administrator access.
        enabled: ${TAPSTATE_CLOUD_JIRA_CUSTOMER_PROVISIONING_ENABLED:false}
        site-admin-risk-acknowledged: ${TAPSTATE_CLOUD_JIRA_CUSTOMER_PROVISIONING_SITE_ADMIN_RISK_ACKNOWLEDGED:false}
        oauth:
          client-id: ${TAPSTATE_CLOUD_JIRA_CUSTOMER_ADMIN_OAUTH_CLIENT_ID:}
          client-secret: ${TAPSTATE_CLOUD_JIRA_CUSTOMER_ADMIN_OAUTH_CLIENT_SECRET:}
      close-transition-name: ${TAPSTATE_CLOUD_JIRA_CLOSE_TRANSITION_NAME:Close Request}
      connect-timeout-seconds: ${TAPSTATE_CLOUD_JIRA_CONNECT_TIMEOUT_SECONDS:3}
      request-timeout-seconds: ${TAPSTATE_CLOUD_JIRA_REQUEST_TIMEOUT_SECONDS:10}
    tawk:
      property-id: ${TAPSTATE_CLOUD_TAWK_PROPERTY_ID:}
      webhook-secret: ${TAWK_WEBHOOK_SECRET:}
      retry-interval-ms: ${TAPSTATE_CLOUD_TAWK_RETRY_INTERVAL_MS:30000}
      feishu:
        app-id: ${FEISHU_BOT_APP_ID:}
        app-secret: ${FEISHU_BOT_APP_SECRET:}
        chat-id: ${FEISHU_CHAT_ID:}
    # Event center — collection, retention and the generic external ingest entry.
    events:
      # Blank disables /v1/api/internal/events (fail closed).
      ingest-token: ${CLOUD_EVENT_INGEST_TOKEN:}
      retention-days: ${CLOUD_EVENT_RETENTION_DAYS:30}
      max-page-size: ${CLOUD_EVENT_MAX_PAGE_SIZE:100}
    # Notification delivery — durable outbox and the EMAIL channel.
    notifications:
      max-attempts: ${CLOUD_NOTIFICATION_MAX_ATTEMPTS:5}
      retry-base-seconds: ${CLOUD_NOTIFICATION_RETRY_BASE_SECONDS:30}
      lease-seconds: ${CLOUD_NOTIFICATION_LEASE_SECONDS:60}
      poll-interval-ms: ${CLOUD_NOTIFICATION_POLL_INTERVAL_MS:5000}
      email:
        enabled: ${CLOUD_NOTIFICATION_EMAIL_ENABLED:false}
        from: ${CLOUD_NOTIFICATION_EMAIL_FROM:no-reply@tapstate.com}
    # Atlas MDB allocation engine.
    # mock=true skips every real Atlas Admin API call (local dev / fast IT).
    # Real deployments set TAPSTATE_CLOUD_MDB_ATLAS_MOCK=false and provide the
    # Activated AtlasConfig key and ACTIVE MdbCluster documents in the
    # control-plane store — Atlas credentials are read from those documents,
    # not from environment variables.
    mdb:
      atlas:
        mock: ${TAPSTATE_CLOUD_MDB_ATLAS_MOCK:true}
    # Infrastructure-as-code layer — multi-cloud Cluster provisioning.
    # Env vars carry the FULL property path (relaxed binding): short names
    # like IAC_MODE do NOT bind to this prefix and are silently shadowed by
    # profile YAML literals. GODADDY_API_KEY/SECRET keep a legacy fallback
    # because CI and the real-cloud ITs export the app process under the
    # short names.
    iac:
      provider: ${TAPSTATE_CLOUD_IAC_PROVIDER:aws}
      mode: ${TAPSTATE_CLOUD_IAC_MODE:real}
      public-base-url: ${TAPSTATE_CLOUD_IAC_PUBLIC_BASE_URL:https://cloud.tapstate.com}
      environment: ${TAPSTATE_CLOUD_IAC_ENVIRONMENT:dev}
      # Blank provisions a MongoDB sidecar on each node; set for externally managed MongoDB
      runtime-atlas-uri: ${TAPSTATE_CLOUD_IAC_RUNTIME_ATLAS_URI:}
      # Runtime container image coordinates; a new Cluster runs
      # <registry>/<repository>:<resolved clusterVersion>.
      runtime-image:
        registry: ${TAPSTATE_CLOUD_IAC_RUNTIME_IMAGE_REGISTRY:ghcr.io}
        repository: ${TAPSTATE_CLOUD_IAC_RUNTIME_IMAGE_REPOSITORY:tapstate/tapstate-cloud}
      aws:
        instance-type: ${TAPSTATE_CLOUD_IAC_AWS_INSTANCE_TYPE:t3.medium}
        disk-size-gb: ${TAPSTATE_CLOUD_IAC_AWS_DISK_SIZE_GB:40}
        # Blank = resolve the region default VPC and one of its public subnets.
        vpc-id: ${TAPSTATE_CLOUD_IAC_AWS_VPC_ID:}
        subnet-id: ${TAPSTATE_CLOUD_IAC_AWS_SUBNET_ID:}
      godaddy:
        base-url: ${TAPSTATE_CLOUD_IAC_GODADDY_BASE_URL:https://api.godaddy.com}
        domain: ${TAPSTATE_CLOUD_IAC_GODADDY_DOMAIN:tapstate.com}
        api-key: ${TAPSTATE_CLOUD_IAC_GODADDY_API_KEY:${GODADDY_API_KEY:}}
        api-secret: ${TAPSTATE_CLOUD_IAC_GODADDY_API_SECRET:${GODADDY_API_SECRET:}}
        ttl: ${TAPSTATE_CLOUD_IAC_GODADDY_TTL:600}
      crypto:
        master-key: ${TAPSTATE_CLOUD_IAC_CRYPTO_MASTER_KEY:}
      tls:
        # Delay between sweeps that push newer stored wildcard certificates to online Clusters.
        distribution-interval-ms: ${TAPSTATE_CLOUD_IAC_TLS_DISTRIBUTION_INTERVAL_MS:60000}

# ========== Logging ==========
logging:
  level:
    io.tapstate.cloud: ${LOG_LEVEL_CLOUD:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
