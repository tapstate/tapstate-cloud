# ============================================================
# Static OpenAPI 3.1 spec — Global Control Plane API
# Per ADR-0123 D1: this is the contract truth source for cross-plan fixtures
# SpringDoc dynamically generates /v3/api-docs at runtime from Swagger annotations
# ============================================================
# Usage:
#   - OpenAPI Generator reads this file: mvn openapi-generator:generate
#   - TypeScript SDK: generated-sources/typescript-sdk/
#   - Java client:    generated-sources/java-sdk/
# ============================================================

openapi: 3.1.0
info:
  title: Tapstate Cloud — Global Control Plane API
  version: "v1"
  description: |
    Global Control Plane backend API for Tapstate Cloud.

    ## Authentication Contexts (ADR-0122 D2)

    ① **Cloud Console Session** — Cookie-based, 7-day idle expiry
    ② **SDK Static Token** — Bearer header, per-Cluster, long-lived
    ③ **Resolve JWT** — issued by this service for Cluster Console access

    ## Cluster Lifecycle (ADR-0124 D3)

    Spring Statemachine-driven. Week 2 implements 6 states.

    ## Regions

    Week 2: ap-southeast-1 (Singapore) only.
  contact:
    name: Tapstate Team
    email: cloud@tapstate.io

servers:
  - url: https://cloud.tapstate.io
    description: Production
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Auth
    description: Cloud Console authentication — register, login, session management
  - name: Organizations
    description: Organization management — isolation boundary for Clusters
  - name: Regions
    description: Available AWS regions for Cluster provisioning
  - name: Clusters
    description: Cluster lifecycle — create, list, retry provisioning
  - name: Resolve / JWKS
    description: Resolve JWT issuance + JWKS public key endpoint
  - name: SDK Status
    description: Global Control Plane SDK status receiver (C2 contract)
  - name: Health
    description: Health check endpoints

paths:
  # ========== Health (public) ==========
  /health:
    get:
      tags: [Health]
      summary: Liveness probe (always 200)
      responses:
        "200":
          description: Service is up

  # ========== Auth ==========
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
        "400":
          description: Invalid input or email already registered

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful, session cookie set via Set-Cookie
          headers:
            Set-Cookie:
              description: HttpOnly session cookie
              schema:
                type: string
        "401":
          description: Invalid credentials

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout and invalidate session
      responses:
        "200":
          description: Session invalidated

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user info
      security:
        - sessionCookie: []
      responses:
        "200":
          description: User profile

  # ========== Regions (public — used before login) ==========
  /api/regions:
    get:
      tags: [Regions]
      summary: List open regions
      responses:
        "200":
          description: List of available regions

  # ========== Organizations ==========
  /api/orgs:
    get:
      tags: [Organizations]
      summary: List current user's organizations
      security:
        - sessionCookie: []
      responses:
        "200":
          description: List of organizations

    post:
      tags: [Organizations]
      summary: Create new organization
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Organization created

  # ========== Clusters ==========
  /api/orgs/{orgId}/clusters:
    get:
      tags: [Clusters]
      summary: List clusters in organization
      security:
        - sessionCookie: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of clusters with current state

    post:
      tags: [Clusters]
      summary: Create Cluster (async auto-provisioning)
      description: |
        Creates a new Cluster and triggers Global Control Plane auto-provisioning
        (CloudFormation + EC2 + Docker + k3s Secret + Atlas DB).
        Returns immediately with PROVISIONING_PENDING state.
      security:
        - sessionCookie: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClusterRequest"
      responses:
        "201":
          description: Cluster created, auto-provisioning started
        "409":
          description: Cluster already exists (orgId + region + name must be unique)

  /api/orgs/{orgId}/clusters/{clusterId}:
    get:
      tags: [Clusters]
      summary: Get Cluster by ID
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Cluster detail with state

  /api/orgs/{orgId}/clusters/{clusterId}/retry:
    post:
      tags: [Clusters]
      summary: Retry provisioning_failed Cluster
      description: |
        Retries a Cluster that previously failed provisioning.
        Only allowed for PROVISIONING_FAILED state.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Retry started, state reset to PROVISIONING_PENDING

  # ========== Resolve JWT + JWKS ==========
  /api/clusters/{clusterId}/resolve:
    post:
      tags: [Resolve / JWKS]
      summary: Issue resolve JWT for Cluster Console access
      description: |
        Creates a short-lived (15 min) RS256 JWT authorizing Cluster Console access.
        JWT claims: iss, sub, org_id, cluster_id, runtime_id, scope, aud, exp.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseResolveResponse"

  /api/jwks.json:
    get:
      tags: [Resolve / JWKS]
      summary: JWKS public key set (RFC 7517)
      description: |
        Publishes public keys for runtime offline JWKS verification.
        Key rotation: 24h interval, 1h overlap.
      responses:
        "200":
          description: JWKS key set

  # ========== SDK Status Receiver (C2 contract) ==========
  /api/sdk/status:
    post:
      tags: [SDK Status]
      summary: SDK C2 status push (heartbeat + pipeline summary)
      description: |
        Runtime SDK sender posts heartbeat + pipeline state.
        Auth: Bearer {per-cluster-static-token} + nonce replay protection.
        NEVER includes user Source configs or secrets.
      security:
        - sdkStaticToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SdkStatusRequest"
      responses:
        "200":
          description: Status received, heartbeat recorded
        "401":
          description: Invalid/missing SDK token

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: TAPSTATE_CLOUD_SESSION
      description: Cloud Console session cookie (HttpOnly, Secure, SameSite=Lax)
    sdkStaticToken:
      type: apiKey
      in: header
      name: Authorization
      description: SDK static token (Bearer {per-cluster-static-token})

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@tapstate.io
        password:
          type: string
          minLength: 8
          example: SecurePass123!
        displayName:
          type: string
          maxLength: 100
          example: Alice Chen

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    UserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum: [active, disabled, pending_verification]
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true

    CreateClusterRequest:
      type: object
      required: [region, name]
      properties:
        region:
          type: string
          example: ap-southeast-1
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Production Pipeline
        specKey:
          type: string
          description: "Week 2: 'basic' only"
          example: basic

    ClusterResponse:
      type: object
      properties:
        id:
          type: string
        orgId:
          type: string
        region:
          type: string
        name:
          type: string
        state:
          type: string
          enum:
            - PROVISIONING_PENDING
            - PROVISIONING
            - READY
            - PROVISIONING_FAILED
            - DEGRADED
        provisionErrorCode:
          type: string
          nullable: true
        runtimeId:
          type: string
        publicDns:
          type: string
          nullable: true
        elasticIp:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
          nullable: true

    ResolveResponse:
      type: object
      properties:
        jwt:
          type: string
          description: RS256-signed JWT
        expiresAt:
          type: string
          format: date-time
        issuer:
          type: string
        audience:
          type: string
        scope:
          type: array
          items:
            type: string

    SdkStatusRequest:
      type: object
      required: [clusterId, runtimeStatus]
      properties:
        clusterId:
          type: string
        runtimeStatus:
          type: string
          enum: [running, degraded, stopped]
        observationTimestamp:
          type: string
          format: date-time
        pipelineStates:
          type: array
          items:
            $ref: "#/components/schemas/PipelineState"
        errorCodes:
          type: array
          items:
            type: string
            description: Canonical error codes (ADR-0024)

    PipelineState:
      type: object
      properties:
        pipelineId:
          type: string
        pipelineName:
          type: string
        status:
          type: string
          enum: [running, paused, error, completed]
        processedCount:
          type: integer
          format: int64
        lastError:
          type: string
          nullable: true
